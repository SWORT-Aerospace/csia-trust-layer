      SCOPE OF THE CITATION: this is the closest prior art found for the
      paper's FRAMING and it NARROWS the paper. It is cited to concede that
      hypothesis-dependent observation loss is an examined setting, and to
      state the one difference we can state from the abstract-level record --
      their missingness is a STOCHASTIC submodel ESTIMATED from data, ours is
      a DETERMINISTIC gate read from the diagnostic system's own
      configuration. No claim may be made that their model cannot represent
      CSIA; that has not been checked and cannot be from here.
