%YAML 1.2
---
# BIBLIOGRAPHY VERIFICATION LEDGER
#
# THE HOLE THIS CLOSES
# --------------------
# `tools/publication/bib_guard.py` fails while a marker exists. It cannot fail
# when a marker is DELETED, and deleting one is the single easiest way to make
# the build green without doing any verification. The guard's own docstring
# says "Deleting a marker without doing that check is falsification, not a
# fix" -- and until now nothing enforced that sentence.
#
# THE RULE, ENFORCED BY tests/test_bib_verification_ledger.py
# -----------------------------------------------------------
#   A bibliography entry that carries NO marker MUST have a row here with
#   status VERIFIED, an accepted route, a named checker, a date, and the
#   record consulted.
#
# So the two states are:
#
#   marker present  +  status UNVERIFIED   ->  honest, and blocks submission
#   marker absent   +  status VERIFIED     ->  honest, and does not
#   marker absent   +  status UNVERIFIED   ->  FAILS. A marker was retired
#                                              without a verification record.
#   marker present  +  status VERIFIED     ->  FAILS. Contradictory.
#
# WHAT COUNTS AS VERIFICATION
# ---------------------------
# accepted_routes below are records produced by the publisher. A web search
# result is NOT one, and `rejected_routes` names it explicitly so that
# recording it is a deliberate, visible act rather than an oversight. This is
# the rule papers/csia_systems/refs.bib already states in its own header; the
# ledger makes it checkable.
#
# HOW TO VERIFY AN ENTRY
# ----------------------
#   1. From a host whose egress permits it, run `make bib-verify`, or open the
#      publisher's own record for the DOI.
#   2. Compare EVERY field: authors, title, venue, volume, number, pages,
#      year, DOI.
#   3. Fix any field that differs. Then, and only then, delete the marker from
#      refs.bib AND set this row to VERIFIED with route, checked_by,
#      checked_on and record filled in.
#
# Both edits in the same commit. The guard fails if only the first is made.

schema: csia.publication.bib_verification_ledger/1

accepted_routes:
  - CROSSREF_DEPOSIT      # api.crossref.org, the publisher's own deposit
  - PUBLISHER_PAGE        # the publisher's landing page for the DOI
  - PUBLISHED_PDF         # the version of record itself

rejected_routes:
  - WEB_SEARCH            # a second unverified source, not a publisher record
  - SECONDARY_INDEX       # dblp, Semantic Scholar, Google Scholar, a mirror
  - BRIEF                 # supplied to this project by an upstream document
  - MEMORY                # recalled rather than looked up

# ---------------------------------------------------------------------------
# A THIRD STATE, ADDED 2026-09-04, BECAUSE THE EVIDENCE MOVED AND THE ROUTE
# DID NOT.
#
# Web SEARCH became available to this environment; web FETCH of any publisher
# host did not. Every accepted route is still refused:
#
#   api.crossref.org, doi.org, dblp.org        CONNECT -> 403
#   www.impan.pl, projecteuclid.org            EGRESS_BLOCKED
#   ieeexplore.ieee.org, arxiv.org             EGRESS_BLOCKED
#
# So four entries can now be corroborated in detail from multiple independent
# search indices agreeing on every field -- which is real evidence, and is
# NOT a publisher record. Marking them VERIFIED would retire a marker on a
# route this file already lists as rejected, which is the exact failure the
# ledger exists to prevent.
#
#   CORROBORATED_NO_PUBLISHER_RECORD
#       every bibliographic field independently reproduced by two or more
#       search indices, no field in dispute, and NO accepted route reachable.
#       The marker STAYS. bib-guard STAYS RED. This is a strictly better
#       state than UNVERIFIED and a strictly worse one than VERIFIED, and it
#       exists so the difference is visible rather than argued.
#
# A human with publisher access converts these to VERIFIED in one sitting;
# the DOIs to check are recorded on each row.
# ---------------------------------------------------------------------------
corroboration_only_routes:
  - SEARCH_INDEX_CONSENSUS

# Why everything below is UNVERIFIED, re-measured 2026-09-04. SIX routes were
# tried, not three: the first three are the accepted ones, and the last three
# were tried only to establish that no fallback exists either. All six fail at
# the proxy's CONNECT, so the failure is the egress policy rather than any
# one service being down.
#
#   api.crossref.org:443       CONNECT -> 403   (organisation egress policy)
#   doi.org:443                CONNECT -> 403
#   dblp.org:443               CONNECT -> 403
#   api.openalex.org:443       CONNECT -> 403   (would be SECONDARY_INDEX)
#   api.semanticscholar.org:443 CONNECT -> 403  (would be SECONDARY_INDEX)
#   export.arxiv.org:443       CONNECT -> 403   (would be SECONDARY_INDEX)
#
# The last three are listed for completeness ONLY. Each is a `rejected_route`,
# so even a successful lookup there could not have retired a marker: an index
# entry is a second unverified source, not a publisher record. They were
# checked so that "no route exists" is a measurement rather than an assumption.
#
# Every publisher route is denied from the authoring environment, so
# `make bib-verify` exits 2 and clears nothing. That is the correct outcome
# and no marker was retired.

entries:

