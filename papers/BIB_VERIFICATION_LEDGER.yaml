    note: >-
      ADDED 2026-09-04. The prior-art matrix carried this as
      NOT_FOUND_NEEDS_HUMAN, which was a factual error about the world:
      multiple independent sources reproduce the metadata and describe
      Theorem 2.1 (a likelihood-ratio bound implies upper bounds on
      f-divergences for bowl-shaped f with a minimum at 1). Publisher hosts
      impan.pl, doi.org and crossref are all blocked from this environment, so
      the marker stays and bib-guard stays red.
      SCOPE OF THE CITATION, deliberately narrow: the manuscript cites this
      ONLY to say that bounded-likelihood-ratio divergence bounds are an
      established subject. The attainment witness for the TV bound is OUR OWN
      elementary two-point construction, verified symbolically and numerically
      (P6c), and is NOT attributed to Rukhin. THE THEOREM HAS NOT BEEN READ,
      so no statement may be made about how our specialization relates to it.
  - paper: gate_conditioning
