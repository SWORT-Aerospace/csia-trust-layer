    key: dong2024statedependent
    status: CORROBORATED_NO_PUBLISHER_RECORD
    route: SEARCH_INDEX_CONSENSUS
    checked_by: claude-code evidence agent
    checked_on: 2026-09-04
    record: >-
      Dong, W., Yin, X. and Li, S., "A Uniform Framework for Diagnosis of
      Discrete-Event Systems with Unreliable Sensors using Linear Temporal
      Logic", IEEE Transactions on Automatic Control 69(1), p.145, January
      2024. DOI 10.1109/TAC.2023.3266021. arXiv preprint 2204.13057.
    note: >-
      TITLE CORRECTED 2026-09-04, AND THE CORRECTION MATTERS MORE THAN THE
      METADATA. The WP-C6 brief supplied the title "Verification of
      diagnosability for discrete-event systems under state-dependent
      observations". Two independent searches place this DOI, volume, issue,
      page and year on a DIFFERENT title, by the same three authors (with
      "Wei" corrected to "Weijie"), whose subject is unreliable sensors whose
      behaviour is described by an LTL formula. The bibliography entry now
      carries the corroborated title.
      THE OPEN QUESTION IS THE REASON FOR CITING IT. This repository has been
      attributing to it "the general mechanism of fault-state-dependent
      observation loss: a state-dependent observation map O: Q x Sigma ->
      2^(Delta u {eps})". That is not obviously the subject of the corroborated
      title, and it cannot be settled without reading the paper. The concession
      itself (SC-11) does not depend on this citation -- it is a disclaimer and
      the Carvalho rows carry it independently -- but the attribution does.
      A human must read this before submission. See the bibliography external
      verification packet, item B-1.

