%YAML 1.2
---
# Gate-conditioning (mathematical) paper — artifact map.
#
# STATUS: the manuscript has not landed. papers/gate_conditioning/main.tex is
# a BUILD SCAFFOLD, not the paper. This map therefore binds what exists today:
# the formal sources, the claim register, the verification script, and the
# numerical values that script produces. When the manuscript arrives, its
# figures, tables and scalars are added here and the check tightens
# automatically.
#
# Validated by `python tools/publication/artifact_map_check.py`.

schema: csia.publication.artifact_map/1
paper: Gate Conditioning and Anytime-Valid Evidence
short_name: gate_conditioning
manuscript: main.tex
phase: 1
manuscript_status: SCAFFOLD_ONLY

naming_collision_warning: >-
  docs/research/PAPER1_EMPIRICAL_SECTION.md belongs to THIS paper, not to CSIA
  Systems Paper I, despite the filename. Its own header says "draft for the
  theory paper". Do not wire it into papers/csia_systems/.

# ---------------------------------------------------------------------------
# FORMAL SOURCES
# Theorems map to proof sections, not to result files.
# ---------------------------------------------------------------------------
formal_sources:
  - id: M-SPEC
    what: the formal setting, evidence objects and gate definitions
    path: docs/math/CSIA_EVIDENCE_FORMAL_SPEC.md
  - id: M-AVE
    what: anytime-valid evidence framing, e-values and Ville's inequality
    path: docs/math/ANYTIME_VALID_EVIDENCE.md
  - id: M-T1
    what: blockwise e-process construction; Lemma 1, Lemma 2, section 5, section 6
    path: docs/math/T1_BLOCKWISE_EPROCESS.md
  - id: M-T2
    what: mission-level error control, e-BH and alpha spending
    path: docs/math/T2_MISSION_ERROR_CONTROL.md
  - id: M-REG
    what: the authoritative claim register; governs the scaffold's table
    path: docs/math/PROOF_STATUS.md
  - id: M-EMP
    what: empirical section drafted for this paper (coarsening from channel
      unavailability, explicitly NOT a measurement of gate conditioning)
    path: docs/research/PAPER1_EMPIRICAL_SECTION.md

# ---------------------------------------------------------------------------
# VERIFICATION
# ---------------------------------------------------------------------------
verification:
  - id: V-1
    what: >-
      Monte-Carlo check of the calibrator's admissibility and of Ville's bound
      under IID, autocorrelated and misspecified nulls. This is the script
      that produced the six REFUTED entries in the register.
    script: docs/math/proofs/eprocess_null_simulation.py
    regenerate: PYTHONPATH=. python docs/math/proofs/eprocess_null_simulation.py
    determinism: >-
      seeded with numpy default_rng(0); K=0.5, T=2000, N=4000 fixed in source
    emits: stdout only; no committed result file
    open_item: OI-M1

# ---------------------------------------------------------------------------
# COUNTEREXAMPLES
# Retained deliberately. Each one refuted a construction the project proposed.
# ---------------------------------------------------------------------------
counterexamples:
  - id: CX-1
    refutes: product of e-values across dependent residuals
    measured: 2.87
    against_bound: 1.0
    source: V-1
  - id: CX-2
    refutes: naive per-tick temporal product under CSIA-like smoothing
    measured: 0.442
    against_bound: 0.05
    condition: rho approximately 0.94
    source: V-1
  - id: CX-3
    refutes: LR e-process under a misspecified null
    measured: 0.4467
    against_bound: 0.05
    source: V-1
  - id: CX-4
    refutes: context-ignorant calibration under regime switching
    measured: 0.7850
    against_bound: 0.05
    source: V-1
  - id: CX-5
    refutes: restart validity without first-observation conditioning
    measured: 0.196
    against_bound: 0.05
    source: V-1
    note: found by the verification suite against the project's own proposal
  - id: CX-6
    refutes: assumption A3 at rho = 0.99
    measured: 0.208
    against_bound: 0.05
    source: V-1

# ---------------------------------------------------------------------------
# MANUSCRIPT CONTENT
# Empty until the manuscript lands. The checker requires the table count to
# match the scaffold, which currently has one transcribed register table.
# ---------------------------------------------------------------------------
figures: []

tables:
  - id: GT01
    label: claim register
    what: the claim register transcribed from PROOF_STATUS.md
    artifact: docs/math/PROOF_STATUS.md
    script: docs/math/proofs/eprocess_null_simulation.py
    derivation: >-
      transcription, not a computation. PROOF_STATUS.md governs; if the table
      and it disagree, the table is stale.
    values: [2.87, 0.442, 0.05, 0.0248, 0.0498, 0.0088, 0.4467, 0.7850, 0.196]

scalars: []

non_empirical:
  - "0\\.[0-9]{2}"
  - "0\\.[0-9]"
  - "[0-9]"
  - "1[0-9]"
  - "[2-9][0-9]"
  - "19[0-9]{2}|20[0-9]{2}"
  - "[0-9]{3,4}"

open_items:
  - id: OI-M1
    what: >-
      eprocess_null_simulation.py prints to stdout and commits no result file,
      so its numbers cannot be diffed or regression-tested.
    blocker: false
    owner: manuscript author
    resolution: >-
      have it emit docs/math/proofs/results/eprocess_null.json and map each
      counterexample above to a json_pointer, as the systems paper does.
  - id: OI-M2
    what: the manuscript itself has not been delivered
    blocker: true
    owner: manuscript agent
    resolution: >-
      replace the body of main.tex. Until then `make paper-math` builds the
      scaffold and no gate-paper release tag may be cut.
  - id: OI-M3
    what: >-
      papers/gate_conditioning/refs.bib is empty of entries. The scaffold
      cites nothing, so the bibliography guard passes trivially; it will start
      doing real work when the manuscript adds citations.
    blocker: false
    owner: manuscript agent
