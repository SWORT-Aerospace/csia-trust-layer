%YAML 1.2
---
# CSIA Systems Paper I — artifact map.
#
# Every figure, table and headline scalar in the manuscript is bound here to
# the committed result it came from, the script that produced that result, and
# the command that regenerates it. Validated by
# `python tools/publication/artifact_map_check.py`, which fails if a figure is
# unmapped, a mapped path does not exist, a mapped scalar is absent from the
# manuscript, the table count disagrees, or a Phase-I map cites a Phase-II
# artifact.
#
# PHASE DISCIPLINE. This paper reports PHASE-I results only. `phase: 1` makes
# any reference to research/phase2/ a hard failure, so no Phase-II measurement
# can silently move a Phase-I table.

schema: csia.publication.artifact_map/1
paper: CSIA Systems Paper I
short_name: csia_systems
manuscript: main.tex
phase: 1

frozen_baseline:
  commit: 848f556
  meaning: >-
    The Phase-I frozen baseline. Every result below was produced by the
    pipeline as it stood at or before this commit. Reproducing the paper means
    checking out this commit, not HEAD.
  benchmark_artifact: campaigns/bench.json
  benchmark_gate: >-
    CI asserts campaigns/bench.json regenerates bit-identically; that is the
    reproducibility anchor for the frozen layer.

environment:
  python: "3.12 and 3.13, both gated in CI"
  determinism: >-
    Every scenario in csia/scenarios.py fixes its seeds (make_sensors uses
    seeds 1-8). SITL campaigns fix the home site and the injection schedule.
    docs/REQUIREMENTS.md R3 requires identical inputs to give identical
    outputs and tests enforce it.
  sitl_target: >-
    ArduCopter 3.3 SITL, dronekit-assets prebuilt, 2015-10-22. This is the
    ONLY autopilot behind any number in this paper. The ArduCopter 4.8 work is
    Phase II and is excluded by the `phase: 1` guard above.

regeneration:
  all_results: >-
    Each script below writes its own results/*.json. They are independent and
    can be run in any order.
  all_figures: |
    PYTHONPATH=. python research/wp_c4/figures.py
    PYTHONPATH=. python research/wp_c6/figures.py
    PYTHONPATH=. python research/wp_c7/figures.py
    PYTHONPATH=. python research/wp_c8/figures.py
    python tools/publication/sync_paper_figures.py
  manuscript: make paper-systems
  note: >-
    figures.py writes to the repository-root figures/ directory. The copies
    under papers/csia_systems/figures/ exist so the submission bundle is
    self-contained; sync_paper_figures.py refreshes them and
    artifact_map_check.py fails if they drift.

