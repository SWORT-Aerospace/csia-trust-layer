    artifact: research/wp_c6/results/q_gvalid_campaign.json
    script: research/wp_c6/q_gvalid_campaign.py
    note: >-
      reported in the manuscript as a derived latency; the per-flight closure
      onsets are in the artifact, the subtraction is in the prose

  - id: S12
    value: "0.998"
    statement: rho_max, the upper adaptive-forgetting bound
    artifact: csia/trust_engine/engine.py
    script: csia/trust_engine/engine.py
    note: a source constant, not a measurement

  - id: S13
    value: "118.82"
    statement: >-
      the banked-agreement term S_0(T_0 - T*) in the escalation-delay
      decomposition, against a margin term M(T* - e_f) of 1.0. The comparison
      is the section's point: the delay is set by accumulated agreement, not
      by fault severity.
    artifact: research/wp_c8/results/escalation_algebra.json
    json_pointer: .what_dominates_N_star.mass_term_S0_times_T0_minus_Tstar
    script: research/wp_c8/escalation_algebra.py
    note: >-
      The manuscript printed 125 here, which is the value at an idealised
      T_0 = 1.0; the artifact computes 118.82 from the measured T_0 = 0.98764
      and 125 appears in no artifact. The qualitative conclusion is unchanged
      -- both are two orders of magnitude above the margin term -- but the
      printed figure now matches the artifact it is derived from.

# ---------------------------------------------------------------------------
# NON-EMPIRICAL NUMERIC LITERALS
# Regexes for numbers in the manuscript that are NOT quantitative claims:
# LaTeX column widths, section and reference numbers, years, small counts.
# Anything not matched here and not mapped above is printed for human review
# on every run. That review list is the actual enforcement of "no
# undocumented quantitative claim survives".
# ---------------------------------------------------------------------------
non_empirical:
  - "0\\.[0-9]{2}"          # p{0.20\textwidth} column widths and similar
  - "0\\.[0-9]"             # 0.5\textwidth, 0.85\textwidth
  - "1"                     # \textwidth multipliers, indices, counts
  - "[2-9]"                 # small counts: eight causes, four gates
  - "1[0-9]"                # 11pt, small counts
  - "[2-9][0-9]"            # percentages and counts checked in review
  - "19[0-9]{2}|20[0-9]{2}" # years in citations
  - "[0-9]{3,4}"            # tick counts and identifiers, reviewed in prose

open_items:
  - id: OI-1
    what: >-
      refs.bib carries 37 unresolved provenance markers (12 VERIFY, 20
      FROM-BRIEF-UNVERIFIED, 5 RECONSTRUCTED). No entry is marked verified.
    blocker: true
    owner: human
    resolution: >-
      each entry checked against the publisher record, marker removed only
      after verification. tools/publication/bib_guard.py fails until then.
      Fabricating a citation to clear this is not an acceptable resolution.
  - id: OI-2
    what: >-
      S11 (0.44 s) is derived in prose from per-flight closure onsets rather
      than stored as a single field in the artifact.
    blocker: false
    owner: manuscript author
    resolution: >-
      either emit the derived latency into q_gvalid_campaign.json or cite the
      per-flight fields explicitly in the caption.
