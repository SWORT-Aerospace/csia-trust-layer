# CSIA public dataset registry v1.
# EVERY spec field below is PUBLISHED_SPECIFICATION (from the datasets'
# public descriptions) unless locally_verified says otherwise. Nothing here
# is local inventory until acquisition succeeds and hashes are recorded.
registry_version: "1.0.0"
datasets:
  uav_sead:
    title: "UAV-SEAD: UAV Sensor and Estimator Anomaly Dataset (PX4)"
    official_source: "https://zenodo.org/ (record id to confirm on unrestricted host)"
    published_specification:
      autopilot: PX4
      archive_files: ["uav-sead-logs.zip (expected; verify on host)"]
      approx_size_gb: 15
      aircraft_count: "multiple (spec: >5)"
      flight_count: "hundreds"
      approx_duration_h: ">60"
      sensors: [imu, gps, mag, baro, battery]
      estimator_outputs: [estimator_status, innovations (firmware-dependent)]
      label_structure: "per-flight anomaly class + anomaly REGION"
      label_precision: "REGION-LEVEL, not onset/offset ground truth"
    licensing: {license: "to verify", commercial_use: UNKNOWN,
                redistribution: UNKNOWN, citation_required: true}
    intended_csia_use: "primary real-PX4 anomaly benchmark; event-level
      detection; false-alert characterization"
    prohibited_claims: ["millisecond-accurate latency (labels are regions)"]
    acquisition: {status: BLOCKED_NETWORK_POLICY,
      error: "proxy CONNECT 403 to zenodo.org (2026-08-03)",
      unrestricted_host_command:
        "python tools/acquire_public_datasets.py --dataset uav_sead"}
