unrecoverable_register:
- item: per-run RNG seed for the self-occlusion arms
  status: UNRECOVERABLE
  why: never emitted into the artifact. Determinism rests on csia/scenarios.py:make_sensors()
    fixing seeds 1-8 and on docs/REQUIREMENTS.md R3.
- item: ArduCopter 3.3 binary checksum
  status: UNRECOVERABLE
  why: the prebuilt binary is not committed and no checksum was recorded at campaign
    time. Identified by provenance and date (dronekit-assets, 2015-10-22) only.
- item: commanded versus realized displacement, step sweep
  status: UNRECOVERABLE
  why: one position_error_m field per row; the two were not stored separately.
- item: alert-episode merging rule for the real-log corpus
  status: UNRECOVERABLE
  why: 3 raw transitions become 2 episodes, and the rule is prose in docs/audit/,
    not a machine-readable field.
