open_items:
- id: OI-1
  what: refs.bib carries 37 unresolved provenance markers (12 VERIFY, 20 FROM-BRIEF-UNVERIFIED,
    5 RECONSTRUCTED). No entry is marked verified.
  blocker: true
  owner: human
  resolution: each entry checked against the publisher record, marker removed only
    after verification. tools/publication/bib_guard.py fails until then. Fabricating
    a citation to clear this is not an acceptable resolution.
- id: OI-2
  what: S11 (0.44 s) is derived in prose from per-flight closure onsets rather than
    stored as a single field in the artifact.
  blocker: false
  owner: manuscript author
  resolution: either emit the derived latency into q_gvalid_campaign.json or cite
    the per-flight fields explicitly in the caption.
