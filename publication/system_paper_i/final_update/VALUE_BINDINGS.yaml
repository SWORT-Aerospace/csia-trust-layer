# Values that must NOT appear in the manuscript as stated. `scan` fails on any.
forbidden:
  - pattern: '7\.72'
    reason: "net-of-dwell trust latency; the dwell was never in the series (FL-053). Use 8.72."
  - pattern: '2\.36\s*(s|vs|against)'
    reason: "net-of-dwell trust latency (FL-053). Use 3.36."
  - pattern: '2\.24\s*(s|vs|against)'
    reason: "net-of-dwell trust latency (FL-053). Use 3.24."
  - pattern: 'false[- ]alarm rate'
