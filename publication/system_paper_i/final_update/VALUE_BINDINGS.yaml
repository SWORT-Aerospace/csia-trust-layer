# PAPER I -- VALUE-LEVEL BINDING LEDGER
#
# One row per value the Paper I manuscript is expected to state. Each row
# names the artifact, the key path inside it, the expected value, the
# traceability level, and where known the preregistration, results and trial
# commits. `verify_bindings.py check` recomputes every artifact SHA-256 and
# re-reads every key; tests/test_paper1_final_update.py runs that check.
#
# Key paths use "/" as the separator (JSON-pointer style) because several
# real keys contain dots ("0.75", "12.0"). An `aggregate` row reduces over a
# list (or the values of a mapping) after an optional equality filter.
#
# This file does not modify, re-seal or re-hash any artifact. It records what
# the artifacts already say, and a check fails if any of them ever changes.
#
# MANUSCRIPT STATUS AT WRITING (2026-10-12): the manuscript named by the
# owner ("Self-Occlusion and Threshold-Crossing Persistence in a Cross-Sensor
# Diagnostic Layer") is NOT in this repository. The values below are the
# values the evidence supports; the manuscript is to be checked against them
# with `verify_bindings.py scan <manuscript.tex>` once it is provided.

schema: csia.publication.paper1_value_bindings/1
written_on: 2026-10-12
branch: claude/code-reviewer-repo-export-zicovg

levels:
  T1_REEXECUTED: >-
    the generating script was re-run this session on a clean `git archive`
    of HEAD (or on the committed raw archive it reads) and every value key
    reproduced; only the self-recorded `commit` field differed, because the
    archive carries no .git
  T2_RECOMPUTED: >-
    recomputed this session by an independent calculation from committed
    inputs (artifact fields, committed per-tick logs, or source constants),
    without running the original generator
  T3_ARTIFACT_RECORDED: >-
    the value sits at the named key of a committed artifact whose SHA-256 is
    pinned here, but its generator reads inputs that are not in the
    repository (gitignored flight logs or SITL runs), so it was not re-run
  T4_DOCUMENT_ONLY: >-
    the value appears only in prose or a hand-built table; no committed
    machine-readable artifact carries it. The manuscript must qualify it
    with its source document or remove it
  NOT_SUPPORTED: >-
    no evidence exists; the manuscript must not state it

