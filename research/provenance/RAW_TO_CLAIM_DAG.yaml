%YAML 1.2
---
# GENERATED by assembling committed provenance artifacts.
schema: csia.provenance.raw_to_claim_dag/1
why: Written after the S0 finding, where a paper scalar was pinned by a test that
  read a STORED ARTIFACT and could not see a 100x change in the engine constant
  behind it. The shape to avoid is PAPER SCALAR -> TEST EXPECTS THE SAME PAPER SCALAR;
  the shape to prefer is RAW -> EXTRACTOR -> DERIVED -> PAPER -> CLAIM.
classes:
- RAW_DERIVABLE
- DERIVED_FROM_BOUND
- SOURCE_CONSTANT
- FROZEN_SUMMARY_ONLY
- UNRECOVERABLE
edges_shape: RAW INPUT -> EXTRACTOR -> DERIVED VALUE -> PAPER SCALAR -> CLAIM ID
research_scalars:
- id: S_0
  value: '475.6775'
  class: DERIVED_FROM_BOUND
  raw_input: frozen EngineConfig (alpha0=8.0, beta0=2.0, rho_max=0.998)
  extractor: research/physical_validation/derivation/rederive_s0.py
  oracle_test: tests/test_scalar_rederivation.py::test_s0_rederives_from_the_frozen_engine
  used_by: systems paper mass term S_0 * (T_0 - T*) = 118.82
  caveat: NOT a flight observable -- no trial measures it. And the field is named
    settled_mass_S0 while the mass is still climbing at n=1500 (475.68 -> 498.79
    by n=3000, cap 500). S_0 is a function of the horizon and must be quoted with
    n_steps. The TRUST is settled by then; the mass is not.
- id: T_0
  value: '0.999791'
  class: DERIVED_FROM_BOUND
  raw_input: (not enumerated)
  extractor: research/physical_validation/derivation/rederive_s0.py
  oracle_test: tests/test_scalar_rederivation.py::test_t0_rederives_from_the_frozen_engine
  used_by: the same mass term
  caveat: It is NOT 1.0 and it is NOT 0.98764. The latter appears nowhere in this
    repository and was a back-solve that reproduces 118.82 by coincidence.
- id: mass_term_118_82
  value: '118.82'
  class: DERIVED_FROM_BOUND
  raw_input: S_0
  extractor: T_0
  oracle_test: 'tests/test_scalar_rederivation.py:: test_the_mass_term_rederives_to_the_published_118_82'
  used_by: systems paper, the dominant term in N*
  caveat: 125 is a DOCSTRING ILLUSTRATION using the theoretical cap 500, not a result.
    It was transcribed into the manuscript once as if it were one.
- id: shared_power_baseline_verdicts
  value: ''
  class: RAW_DERIVABLE
  raw_input: campaigns/shared_power_generalization_v1.json (frozen, hash-pinned)
  extractor: frozen csia/diagnosis/baselines.py + run_shadow
  oracle_test: 'tests/test_baseline_rederivation.py:: test_the_baseline_verdicts_rederive_from_the_frozen_campaign'
  used_by: the systems paper's baseline comparison
  caveat: 'Neither excluded field class is load-bearing: no test and no manuscript
    binding references t_first_detection, or this artifact at all.'
- id: mechanism_a_first_t_ardupilot
  value: '12.043901'
  class: RAW_DERIVABLE
  raw_input: the trial's flight log (per-tick canonical channels)
  extractor: tools/csia_experiment/extract_mechanism_a.py
  oracle_test: 'tests/test_ardupilot_repeat_reconciliation.py:: test_the_original_first_t_rederives_from_its_own_log'
  used_by: systems paper, Mechanism A
  caveat: The original trial's log records autopilot_version "ardupilot" -- a platform
    name, not a build. That trial cannot be shown FROM ITS OWN RECORD to have run
    the pinned commit (FL-017).
- id: gps_gate_weight_sum_ardupilot
  value: 3.0 -> 0.0
  class: RAW_DERIVABLE
  raw_input: (not enumerated)
  extractor: null
  oracle_test: research/physical_validation/results/mechanism_a_repeat_ardupilot.json,
    20/20 FAULT and 0/20 CONTROL, via extract_mechanism_a.py
  used_by: null
  caveat: The edge set is DERIVED from the frozen trust graph, not listed -- every
    edge with gps as an endpoint, under the runtime's own identifiers.
- id: trust_rise_ardupilot
  value: 0.9213 -> 0.9300
  class: RAW_DERIVABLE
  raw_input: research/physical_validation/results/a2_traces_raw/ (40 raw traces)
  extractor: tools/csia_experiment/extract_trust_a2.py, four frozen windows
  oracle_test: 'tests/test_ardupilot_repeat_reconciliation.py:: test_the_control_arm_rises_more_than_the_fault_arm;
    ::test_the_original_delta_is_outside_the_repeated_fault_range'
  used_by: master packet section G; the DEA profile's justification for NOT standardising
    "gate closure shall lower trust"
  caveat: 'THE VALUE 0.9213 -> 0.9300 MUST NOT BE QUOTED AS REPEATABLE. Its delta
    (+0.008656) is OUTSIDE the repeated FAULT range, root-caused in FL-017: the
    original ran a 0.5 s gps watchdog and the repeats a 1.0 s one, so the gate held
    twice as long and trust accrued twice as long before freezing. Both runs are
    correct records of different deployment configurations. And the CONTROL arm
    rises ~3x MORE than the fault arm (FL-016), which was already visible in the
    frozen n=1 artifact and never compared. The fault SUPPRESSES a rise that happens
    anyway. Campaign A1 did NOT capture trust (FL-014). NOT_CAPTURED is not FAIL,
    ZERO or UNCHANGED.'
- id: gps_gate_dwell_ardupilot
  value: 0.4788 s original / 0.9997 s repeated
  class: RAW_DERIVABLE
  raw_input: the trials' own flight logs, per tick
  extractor: the gps-incident edge set, DERIVED from the frozen trust graph
  oracle_test: 'tests/test_ardupilot_repeat_reconciliation.py:: test_the_original_dwell_matches_the_frozen_watchdog;
    ::test_the_a2_dwells_match_the_derived_watchdog; ::test_the_two_watchdogs_that_explain_the_discrepancy'
  used_by: nothing yet. It is here because it is the quantity that explains why
    the original n=1 trust delta is outside the repeated range (FL-017), and a number
    that carries an explanation must be re-derivable.
  caveat: Each dwell matches its own watchdog only to within one tick period (0.04
    s at 25 Hz), because it is observed on tick boundaries. That is a resolution
    limit, not a tolerance chosen to make the check pass. NO CLAIM IS MADE FROM
    THIS SCALAR. It is a deployment-configuration property, and quoting it without
    naming the watchdog would repeat the error it documents.
- id: trust_rise_px4
  value: 0.9856 -> 0.9875
  class: RAW_DERIVABLE
  raw_input: research/physical_validation/results/p1_traces_raw/ (40 raw traces)
  extractor: tools/csia_experiment/extract_trust_a2.py --campaign-key p1, the SAME
    four frozen windows the ArduPilot campaign uses
  oracle_test: 'tests/test_px4_repeat_reconciliation.py:: test_the_control_arm_rises_more_on_px4_too;
    ::test_the_original_px4_delta_is_outside_the_repeated_fault_range; ::test_the_watchdog_replay_reproduces_both_px4_values_from_one_log'
  used_by: null
  caveat: 'DO NOT QUOTE 0.9856 -> 0.9875 AS REPEATABLE. Its delta (+0.001884) is
    outside the repeated FAULT range, AND the PRE-fault value does not reproduce
    either (0.985624 against 0.952172) -- a symptom ArduPilot did not have. Attributed
    by controlled replay (FL-018): the SAME log under the 0.5 s and 1.0 s watchdog
    tables gives 0.986420 and 0.952526, recovering both measured values. The control
    arm rises ~2.7x more than the fault arm here too (FL-016), and that comparison
    was already possible from the frozen PX4 artifact. PX4''s demonstration is NARROWER
    than ArduPilot''s -- 1 of 4 relations live pre-fault, not 3 of 4 -- which is
    preregistered and is a property of the passive link, not of PX4.'
- id: px4_pre_fault_trust_watchdog_sensitivity
  value: 0.986420 (0.5 s) / 0.952526 (1.0 s)
  class: RAW_DERIVABLE
  raw_input: a committed PX4 flight log
  extractor: csia/runtime/online.py:STALE_TIMEOUT_S (frozen, gps 0.5)
  oracle_test: 'tests/test_px4_repeat_reconciliation.py:: test_the_watchdog_replay_reproduces_both_px4_values_from_one_log'
  used_by: nothing directly. It is the CONTROLLED EXPERIMENT that attributes the
    PX4 pre-fault discrepancy, and an attribution has to be re-derivable.
  caveat: THE INSTRUMENT IS PLATFORM-LIMITED AND THE LIMIT IS PINNED. It reproduces
    PX4's measured values to ~0.003 and does NOT reproduce ArduPilot's (0.9794 and
    0.9413 against measured 0.9246 and 0.9248), because the hand-off reconstruction
    under-counts when consecutive readings repeat, which bites harder at ArduPilot's
    channel rates. So it says nothing about why ArduPilot's pre-fault trust was
    stable -- FL-019, an UNRESOLVED mechanism, labelled rather than filled in by
    analogy. A second test asserts the replay still FAILS on ArduPilot, so the limit
    cannot lapse silently.
- id: independent_checker_agreement
  value: 378000/378000
  class: FROZEN_SUMMARY_ONLY
  raw_input: (not enumerated)
  extractor: null
  oracle_test: none
  used_by: null
  caveat: Re-deriving it means re-running the campaign that produced the ticks.
    Feasibility not assessed this session.
- id: cusum_latencies
  value: 2.96 / 1.16 / 0.72 s
  class: RAW_DERIVABLE
  raw_input: research/systems-paper/results/mechanism_b.json (frozen traces)
  extractor: the CUSUM parameters frozen at commit b9fc5d6
  oracle_test: none
  used_by: null
  caveat: n=1 per arm, four arms, one flight profile, one node. The forbidden comparison
    -- detector+dwell against detector-alone -- is recorded in CUSUM_FAIRNESS.yaml
    so it cannot recur silently.
- id: frozen_core_hashes
  value: ''
  class: SOURCE_CONSTANT
  raw_input: (not enumerated)
  extractor: null
  oracle_test: tests/test_v1_frozen.py::test_diagnostic_core_matches_its_recorded_hashes
  used_by: null
  caveat: A hash is not a behavioural check. It fires identically on a reformatted
    comment, which is exactly why the mutation campaign separates KILLED from KILLED_BY_INTEGRITY_ONLY.
