honest_limits:
- This DAG is ASSEMBLED from three existing artifacts (the scalar derivation graph,
  the artifact map, the E1 claim table) rather than traced independently. It inherits
  their accuracy and adds no verification of its own.
- The 42 SCIENTIFIC_RESULT prose literals are counted here and are NOT nodes in
  the DAG, because none has an extractor and a raw input identified yet. Adding
  them as nodes with empty chains would make the graph look complete while carrying
  nothing.
- FROZEN_SUMMARY_ONLY is the class to shrink. It stands at 1.
- NO PROVENANCE WAS MANUFACTURED. A numeric search matched every prose literal to
  some artifact value; that is coincidence, and it was rejected rather than recorded
  as a chain.
