%YAML 1.2
---
# CUSUM COMPARATOR FAIRNESS CONTRACT
#
# WHY A CONTRACT AND NOT A PARAGRAPH
# ----------------------------------
# The systems paper compares its trust-threshold path against a cumulative-sum
# detector. Any such comparison is one editorial decision away from being
# unfair in either direction, and the decisions are invisible in a results
# table: which signal, which sample rate, whether the policy dwell counts,
# whether a clean-arm threshold crossing is a "latency" or a false alarm.
#
# So they are written down here, BEFORE the table, and the table is generated
# from the same frozen traces under exactly these rules.
#
# THE ONE THAT ALREADY WENT WRONG
# -------------------------------
# The paper's first comparison quoted the trust path at 8.72 s against the
# CUSUM at 2.96 s. That is detector-PLUS-POLICY-DWELL against
# detector-alone, and it flatters the CUSUM by one dwell period. Red team
# objection 2.3 was upheld. Detector to detector the figures are 7.72 against
# 2.96 -- the CUSUM still wins, by less. The conclusion survived; the
# comparison as first stated did not, and this file exists so it cannot
# happen again silently.

schema: csia.research.cusum_fairness/1
program: CSIA PAPER EVIDENCE EXTENSION -- PHYSICAL VALIDATION V1

# ---------------------------------------------------------------------------
# WHAT BOTH DETECTORS SEE
# ---------------------------------------------------------------------------
input_signal:
  quantity: >-
    The per-node prediction-comparator chi-square residual, as computed by the
    frozen core. BOTH detectors consume the SAME series -- neither gets a
    preprocessed or differently-filtered version.
  node: gps
  note: >-
    The CUSUM bank covers four nodes and NOT baro, imu0 or imu1; those are
    listed in csia/v1_1/sequential.py NO_RESIDUAL with a stated reason each.
    The comparison is therefore scoped to a node both detectors cover, and the
    coverage limit is reported alongside the result rather than omitted.

sample_rate_hz: 25.0

preprocessing:
  trust_path: >-
    The frozen core's own exponential smoothing, unchanged. Not added for this
    comparison and not removable without changing the core.
  cusum_path: >-
    NONE. The CUSUM consumes the instantaneous residual. Giving it the
    smoothed series would be a second, undeclared filter.
  same_series_for_both: true

# ---------------------------------------------------------------------------
# DETECTOR PARAMETERS AND WHERE THEY CAME FROM
# ---------------------------------------------------------------------------
cusum:
  initial_state: 0.0
  reference_value_k: 0.5
  decision_interval_h: 500.0
  in_control_stats_source: csia/v1_1/sequential.py IN_CONTROL
  parameter_provenance: >-
    k = 0.5 is the textbook one-sided value and was not fitted here.
    h = 500.0 was selected by a ZERO-CLEAN-ALARM RULE on a fixed grid, and
    the file records the failure that forced it: the textbook h = 5.0 produced
    2681 clean-arm alarm ticks under v1.1. Both were fixed BEFORE the four
    comparison arms existed.
  parameter_freeze_commit: b9fc5d6
  parameter_freeze_path: csia/v1_1/sequential.py
  tuned_on_the_comparison_arms: false

trust_threshold:
  threshold: 0.75
  threshold_source: FailsafeConfig.nav_caution, frozen core
  parameter_freeze_tag: csia-v1.0-research-final

# ---------------------------------------------------------------------------
# THE DECISION THAT MADE THE FIRST COMPARISON UNFAIR
# ---------------------------------------------------------------------------
policy_dwell:
  seconds: 1.0
  applies_to: trust_threshold path only
  treatment: >-
    REMOVED from the trust figure for the headline comparison, because the
    CUSUM figure carries no equivalent. Both the raw and the dwell-removed
    trust latencies are published; only the dwell-removed one may be set
    against a CUSUM latency.
  forbidden_comparison: >-
    Quoting 8.72 / 3.36 / 3.24 (detector + dwell) against 2.96 / 1.16 / 0.72
    (detector alone). This is the specific error red team 2.3 caught.

# ---------------------------------------------------------------------------
# TRIAL SET AND DEFINITIONS
# ---------------------------------------------------------------------------
trial_set:
  artifact: research/systems-paper/results/mechanism_b.json
  arms: [clean, slow_ramp, spoof_3ms, fast_ramp]
  same_trial_requirement: >-
    Both detectors are run over the SAME recorded trace for each arm. Not the
    same scenario re-flown, the same trace -- a re-flight would introduce a
    difference neither detector controls.
  n_per_arm: 1
  n_caveat: >-
    ONE realisation per arm. These are single traces, not distributions, and
    no confidence statement may be attached to any latency below.

latency_definition:
  origin: fault onset, as recorded in the trace
  trust_path: >-
    first tick at which the trust coefficient is at or below 0.75, minus the
    1.0 s policy dwell
  cusum_path: >-
    first tick at which the node's cumulative sum exceeds h
  units: seconds

false_alarm_handling:
  clean_arm: >-
    The clean arm produces NO alarm on either detector. A threshold crossing
    in the clean window is a FALSE ALARM and is reported as such; it is never
    reported as a latency. The bare instantaneous-lambda series does cross its
    own threshold in the clean window (36 of 374 ticks, 9 after smoothing) and
    that is exactly why a bare lambda threshold is not one of the two
    detectors compared here.
  cusum_clean_alarms: 0
  trust_clean_alarms: 0

# ---------------------------------------------------------------------------
# WHAT THIS COMPARISON DOES NOT ESTABLISH
# ---------------------------------------------------------------------------
limitations:
  - >-
    n = 1 per arm, four arms, one flight profile, one node. A detector-to-
    detector comparison on these traces, not a general claim about CUSUM
    against trust thresholds.
  - >-
    The CUSUM bank has no residual for imu0, imu1 or baro. Its coverage is
    narrower than the trust path's and the difference is not measured here.
  - >-
    No CUSUM novelty is claimed. Page's 1954 one-sided CUSUM is used as an
    engineering baseline (systems-paper claim SC-10).
  - >-
    A comparison in which one detector's parameters were chosen after seeing
    these arms would be worthless. They were not, and the freeze commit is
    recorded above so the claim is checkable rather than asserted.
