  - id: MX-011
    date: 2026-09-07
    phase: MISSION EXTENSION (forge-seed)
    kind: DECLARED_BUT_UNSUPPORTED_CAPABILITY
    what_happened: >-
      K_OF_N WAS DECLARED AS A SUPPORTED DEPENDENCY FORM AND WAS NOT
      IMPLEMENTED. `DEPENDENCY_FORMS` listed it, and forge_seed.py carried a
      `_k_of_n` parser that NOTHING CALLED -- the compiler never emitted the
      form, no contract could express it, and no test touched it.
    found_by: >-
      Reading the mutation survivors in forge_seed.py and noticing that a
      whole function's worth of them sat in code no caller reached.
    verdict: FIXED
    consequence: >-
      A DECLARED CAPABILITY WITH NO BEHAVIOUR BEHIND IT is the exact shape of
      claim this repository exists to refuse, one level up from the science.
      Two honest resolutions existed -- remove the declaration, or make it
      true. The brief permits k-of-n "only if semantics are explicit and
      tested", so it was made true.
      `requires_k_of_n` now exists on CapabilityContract in ONE explicit form,
      `{"k": int, "of": [ids]}`. A bare list is NEVER read as 1-of-n: how many
      must hold is precisely what a reader guesses wrong. k outside [1, n] is
      refused as vacuous or unsatisfiable rather than clamped. The dead
      duplicate parser is gone and forge_seed delegates to the one in
      capability.py, so two parsers for one syntax cannot drift.
      The UNKNOWN rule holds here as everywhere else: one supported plus one
      unknown against k=2 is UNKNOWN -- it MIGHT hold -- not NOT_SUPPORTED.
      13 tests, including every boundary and seven malformed forms.
    artifact: >-
      csia_mission/capability.py; csia_mission/forge_seed.py;
      csia_mission/graphs.py; tests/test_mission_survivor_kills.py

