      tests/test_ambiguous_binding_resolution.py

  - id: SR-003
    date: 2026-09-07
    campaign_effect: >-
      MEASURED OVER 1000 GENERATED MULTI-SENSOR VARIATIONS, seed 20260907,
      each run twice (frozen policy and frozen+overlay):
        detected            783 -> 969 of 1000
        newly detected      186
        DETECTIONS LOST     0
        still undetected    217 -> 31
        peak level raised   255 runs
      THE ZERO IS THE ONE THAT MATTERS. The overlay computes
      max(frozen, supervisor), so it can only add urgency; a non-zero
      detections_lost would mean it had removed a detection the frozen core
      made, which the composition forbids.
      WHAT REMAINS IS A DIFFERENT CLASS. Every one of the 186 newly detected
      runs involved a `dropout` -- exactly the absence-of-data mechanism
      SR-001 named. The 31 still undetected are dominated by `bias_drift`:
      degradation too weak to cross a frozen trust threshold. That is a
      threshold question INSIDE the frozen core, not a supervision gap, and
      it is not retuned here.
      artifact: research/stress/results/SUPERVISION_EFFECT_1000.json
    phase: STRESS (SR-001 remediation)
    kind: GAP_CLOSED_ABOVE_THE_FREEZE
    what_happened: >-
      SR-001 IS CLOSED BY A LOSS-OF-DATA RULE FOR THE SEVEN SENSORS THAT
      DID NOT HAVE ONE, ADDED ABOVE THE FROZEN CORE RATHER THAN INSIDE IT.
      csia/runtime/failsafe.py is inside FROZEN_PATHS, so editing it would
      break the E1 freeze manifest, byte-equivalence to
      csia-v1.0-research-final, and every claim descending from them. The
      rule therefore lives in a new package, csia_supervision, in the same
      direction as csia_assurance and csia_mission: it CALLS the frozen
      policy and never modifies it. A test asserts the frozen file still
      matches the tag.
      MEASURED, 40 s of loss in a 90 s flight, frozen -> supervised:
        both IMUs        NORMAL -> EMERGENCY     (the SR-001 headline)
        one IMU          NORMAL -> CAUTION
        battery + baro   NORMAL -> CRITICAL
        mag              NORMAL -> CAUTION
        motor_esc        NORMAL -> CAUTION
        GPS              CAUTION -> CAUTION      (not double-reported)
        CLEAN FLIGHT     NORMAL -> NORMAL        (no false alarm)
        vibration anomaly CRITICAL -> CRITICAL   (bad data, unchanged)
    found_by: >-
      Implementing the rule the SR-001 entry described, then running the
      same reproducer SR-001 was recorded from.
    verdict: CLOSED_ABOVE_THE_FROZEN_CORE
    consequence: >-
      THE LEVELS ARE DERIVED, NOT CHOSEN. Inventing a severity per sensor
      would be exactly the retuning that must not happen, so each level is
      read off the severity the FROZEN config already assigns that sensor:
      heading_caution -> CAUTION for mag, power_critical -> CRITICAL for
      battery, struct_critical -> CRITICAL for vibration, imu_isolation ->
      CAUTION for a single IMU, and att_emergency -> EMERGENCY for the loss
      of BOTH attitude sources, which is the exact analogue of the frozen
      `attitude_lost` rule.
      TWO LEVELS ARE A CHOICE AND ARE LABELLED AS ONE. baro and motor_esc
      are referenced ZERO times in the frozen conditions -- they have no
      rule of any kind, by trust or by loss -- so there is no severity to
      derive. Their levels default to the lowest actionable level and carry
      the provenance UNANCHORED_THIS_IS_A_CHOICE, so a reader can see which
      two numbers are mine. Timing is not invented either: dwell_up,
      arm_time and the disarmed behaviour all come from the frozen config.
      THE OVERLAY CANNOT LOWER A FROZEN LEVEL. effective = max(frozen,
      supervisor). A layer above the core that could de-escalate would be
      able to overrule a frozen safety decision, and a test asserts it
      cannot.
      THE CLEAN-FLIGHT ROW IS THE ONE THAT MATTERS. A loss-of-data rule
      that alarmed on healthy flight would be worse than the gap it fills,
      because an alarm nobody believes is an alarm nobody acts on. It stays
      NORMAL, and so does a sensor that was never fitted -- the same
      _ever_fresh rule the frozen policy applies to GPS.
      ONE RULE CANNOT BE EXERCISED IN THIS RIG. dropout on the vibration
      node is live in the sampled stream and inert after transport
      (SR-002), so fresh["vibration"] never goes false and the overlay
      correctly stays quiet. The rule exists and its level is anchored;
      what is missing is a way to deliver the stimulus. The test records
      that rather than asserting an outcome the rig cannot produce.
      TEST SENSITIVITY, same targets/seed/16 sites, only tests added:
      0.6875 (11/16) -> 0.9375 (15/16) -> 1.000 (16/16). Every survivor was
      a boundary: < versus <= at arm_time and at dwell_up, the fresh.get
      default, proper-versus-improper subset on ever_fresh, and
      once-per-condition action issuing. The last needed a vehicle whose
      ONLY ever-fresh nodes are the two IMUs, the single case where subset
      and proper subset differ.
      STILL ADVISORY. CSIA has no command authority. This changes what the
      layer would RAISE, not what any vehicle would do. And the recorded
      stress baseline still describes the FROZEN policy alone --
      run_profile(supervised=True) is an explicit request to measure a
      different system.
    artifact: >-
      csia_supervision/dataloss.py;
      tests/test_supervision_dataloss.py;
      docs/SUPERVISION_LAYER.md;
      research/mission/results/MUTATION_PROBE_SUPERVISION.json

  - id: SR-004
    date: 2026-09-08
    phase: STRESS (SR-003 follow-up)
    kind: CAPABILITY_WITH_NO_CONSUMER
    what_happened: >-
      SR-003 ADDED A LOSS-OF-DATA RULE AND NOTHING CALLED IT. The overlay
      was built, tested to a 1.000 mutation score and measured over 1000
      variations -- and csia/deploy/shadow.py constructed a bare
      FailsafePolicy(). On a real shadow flight SR-001 was therefore STILL
      OPEN: the rule existed, was correct, and would never fire.
      Found by grepping for consumers of SupervisedFailsafe outside the
      tests and the stress harness, and finding none.
    found_by: >-
      Asking, while listing what to improve next, whether the thing I had
      just built was actually reachable from the deployment path. It was
      not.
    verdict: FIXED
    consequence: >-
      Wired behind `ShadowConfig.data_loss_supervision`, exposed as
      `csia-shadow --data-loss-supervision`, and OFF BY DEFAULT.
      OFF BY DEFAULT IS THE DELIBERATE PART. Shadow mode PRODUCES EVIDENCE.
      Turning supervision on silently would mean logs recorded before and
      after the change describe different systems while both claiming mode
      SHADOW, with nothing in the log able to tell them apart. So the
      flight-log header now carries `failsafe_policy` -- FROZEN_ONLY or
      FROZEN_PLUS_DATA_LOSS_SUPERVISION -- and the two are NOT comparable.
      THE FROZEN POLICY IS WRAPPED, NEVER REPLACED. SupervisedFailsafe owns
      a FailsafePolicy and FORWARDS `_conditions`, `_cond_since`, `cfg` and
      `transitions` rather than reimplementing them: a second
      implementation of `_conditions` would be a copy of the thing under
      test, which the shadow runner's own docstring warns against. The
      per-tick row records `frozen_level` beside the effective level, so a
      reader can always separate the frozen decision from the overlay's
      addition.
      THE DEFAULT PATH IS BYTE-FOR-BYTE UNCHANGED. A test asserts the
      policy row with supervision off has exactly the three keys it always
      had, so old and new logs stay comparable.
    artifact: >-
      csia/deploy/shadow.py; csia/deploy/cli.py; csia/deploy/flight_log.py;
      tests/test_shadow_supervision_wiring.py

  - id: MX-017
    date: 2026-09-08
    phase: QUALITY (frozen-core sensitivity)
    kind: MEASUREMENT_GAP_CLOSED
    what_happened: >-
      csia/runtime/online.py CARRIED THE LARGEST COVERAGE-VERSUS-MUTATION
      GAP IN THE REPOSITORY: 88.8% line coverage against a 0.154 mutation
      score, 11 survivors -- in the code that actually runs in deployment.
      Coverage that high with sensitivity that low has one explanation: the
      tests drive the module end to end and assert on the aggregate, so any
      single comparison can be flipped without changing the answer they
      check. 22 boundary tests were added (tests only; online.py is frozen
      and stays byte-identical).
    found_by: >-
      Reading the per-file breakdown of the frozen-core probe rather than
      its headline, and asking which file was worst.
    verdict: TESTS_ADDED_SOURCE_UNTOUCHED
    consequence: >-
      FOUR OF THE PROBES I WROTE TO MEASURE IT WERE THEMSELVES WRONG, and
      each is now recorded in the test that found it:
        * the tilt-gate probe used a ZERO GYRO on a level vehicle, where
          the integrated and accelerometer-derived attitudes are both zero
          -- so an OPEN gate blends one value into an identical one and is
          invisible. It now carries a sub-threshold rate to create the
          divergence the correction pulls back.
        * two tests fed samples entirely BELOW t_cal and measured an
          attitude filter that had never been called.
        * the adaptive-level test used a BENCH-MODE layer, where the whole
          block is inside `if self._field` and cannot run. The bench case
          is now pinned from both sides, so that vacuity cannot return.
      THE PATTERN IS THE ONE THIS LEDGER KEEPS RECORDING: a probe that
      cannot see the thing it is aimed at reports the same "no effect" as a
      system that has none, and the two are indistinguishable without
      checking that the probe can see anything at all.
    artifact: tests/test_online_survivor_kills.py

  - id: MX-018
    date: 2026-09-08
    phase: QUALITY (instrument hardening)
    kind: INSTRUMENT_GUARD
    what_happened: >-
      A MISSING TEST PATH MAKES PYTEST EXIT 4, AND THE MUTATION PROBE READS
      ANY NON-ZERO EXIT AS "TESTS FAILED", I.E. AS A KILL. I hit this by
      passing two test files that do not exist to `--tests`.
      The probe was ALREADY PROTECTED: it runs the unmutated copy first and
      aborts if it does not pass, so no fake score was possible. I had
      briefly believed otherwise and was wrong -- the guard was there and
      it worked.
    found_by: >-
      Passing tests/test_failsafe.py and tests/test_scenarios.py to
      --tests. Neither exists.
    verdict: GUARD_MADE_SPECIFIC
    consequence: >-
      The existing baseline guard catches it but reports only "the
      unmutated copy does not pass", sending the reader hunting for a
      broken test that is really a typo in an argument. The probe now
      validates every test path up front and names the missing ones, with
      the reason spelled out. A correct refusal that misdirects the reader
      is a small defect, but it is one that costs an hour at the wrong
      moment.
