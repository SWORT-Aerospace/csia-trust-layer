      NOT MADE. research/v1_1/results/mechanism_a_ardupilot.json carries the
      control arm's snapshots: control +0.014020 at post against fault
      +0.008656, and +0.038232 at late -- 4.4x. The published headline is the
      fault arm alone.
      The frozen artifact is NOT edited. It records what that trial measured.
      What survives: the DEA profile's use of this result to justify NOT
      standardising "gate closure shall lower trust" is unaffected and in fact
      strengthened -- trust falls in none of the 20 repeats.
      What does not: any phrasing implying the fault drove trust up.
