      1 is VALUE_TOO_COMMON_TO_BIND (1.000).
      7 span more than one artifact and are untouched.
    found_by: >-
      tools/publication/resolve_duplicate_pointers.py. A candidate pair is
      the same quantity only when both are in one artifact, carry one value,
      and one containing object is a FIELD SUBSET of the other agreeing on
