    kind: PREVIOUSLY_UNREPORTED_FINDING
    what_happened: >-
      The headline "trust RISES across a gate collapse (0.9213 -> 0.9300)" is
      true and, stated alone, misleading. Campaign A2 captured both arms and
      the CONTROL arm rises about THREE TIMES MORE than the FAULT arm:
