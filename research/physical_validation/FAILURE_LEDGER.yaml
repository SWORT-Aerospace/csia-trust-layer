      Wired behind `ShadowConfig.data_loss_supervision`, exposed as
      `csia-shadow --data-loss-supervision`, and OFF BY DEFAULT.
      OFF BY DEFAULT IS THE DELIBERATE PART. Shadow mode PRODUCES EVIDENCE.
      Turning supervision on silently would mean logs recorded before and
      after the change describe different systems while both claiming mode
      SHADOW, with nothing in the log able to tell them apart. So the
      flight-log header now carries `failsafe_policy` -- FROZEN_ONLY or
      FROZEN_PLUS_DATA_LOSS_SUPERVISION -- and the two are NOT comparable.
