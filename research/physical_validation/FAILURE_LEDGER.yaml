  - id: SR-001
    date: 2026-09-07
    phase: STRESS (multi-sensor degradation campaign)
    kind: SUPERVISION_GAP
    what_happened: >-
      LOSS OF DATA ESCALATES THE FAILSAFE FOR EXACTLY ONE OF EIGHT SENSORS.
      GPS has an explicit rule -- "GPS data invalid" fires when the node is
      not fresh and was monitored earlier in the run. Every other rule in
      FailsafePolicy._conditions is gated on fresh.get(<sensor>), so a
      sensor that stops delivering valid data is REMOVED FROM SUPERVISION
      rather than alarmed on.
      The sharpest instance is attitude. The attitude rules reason over
      `imus = [n for n in ("imu0","imu1") if fresh.get(n)]` and then take
      `att = max((T[n] for n in imus), default=1.0)`. When NEITHER IMU is
      fresh the default applies, attitude confidence reads 1.000, and both
      att_caution and att_emergency become unreachable.
      MEASURED: both IMUs dropped out for 40 s of a 90 s flight. Freshness
      detection worked correctly -- both marked not fresh at t=30 s -- and
      the failsafe peak over the whole flight was NORMAL. The same holds
      for battery+baro, mag+baro and battery+motor_esc dropouts. A GPS
      dropout under identical conditions reaches CAUTION.
    found_by: >-
      A randomised multi-sensor stress campaign: 53 of 200 generated
      variations were NOT_DETECTED, and grouping them by fault composition
      showed the missed sets were dominated by `dropout`. The minimal
      reproducer was then constructed by hand.
    verdict: RECORDED_NOT_FIXED
    consequence: >-
      NOT A DEFECT IN FRESHNESS DETECTION, which works. The gap is that
      only GPS has a rule that ACTS on absence.
      THE EXCLUSION IS DELIBERATE IN ORIGIN AND DOCUMENTED IN THE FROZEN
      SOURCE: "A sensor that is not delivering data has NO meaningful trust
      value (it holds the Bayesian prior). Rules must only reason over
      sensors actually being monitored -- comparing against a frozen prior
      produced phantom IMU divergence alarms on real flight logs." That
      rationale is sound for TRUST-BASED rules. It does not by itself
      supply a LOSS-OF-DATA rule for the other seven nodes, and GPS shows
      what one looks like.
      The existing watchdog regression test (tests/test_runtime.py
      test_stale_sensor_watchdog) covers GPS only, so this asymmetry was
      not previously pinned.
      NOT FIXED HERE. csia/runtime/failsafe.py is FROZEN. Four
      characterization tests now pin the behaviour from both sides -- the
      GPS rule firing, the non-GPS dropouts not firing, and a control
      showing the same sensors DO escalate on BAD data as opposed to NO
      data -- so the day this changes, it is visible and deliberate.
      SCOPE OF THE CLAIM: CSIA is an advisory layer with no command
      authority. This says what the trust layer would and would not raise;
      it says nothing about mitigations elsewhere in a vehicle.
    artifact: >-
      tests/test_stress_layer.py (test_sr001_*);
      research/stress/results/STRESS_CATALOG.json;
      csia_stress/observables.py

  - id: SR-002
    date: 2026-09-07
    phase: STRESS (instrument validation)
    kind: TEST_RIG_DELIVERY_GAP
    what_happened: >-
      A FAULT THAT PERTURBS THE SENSOR STREAM AND REACHES THE LAYER AS
      NOTHING. `dropout` on the vibration node marks every sample in its
      window invalid -- 40000 of 40000 samples measured -- and the online
      layer never sees it, because SimulatedFlightSource.samples() emits
      the 10 Hz RMS envelope as {"rms": ..., "valid": True} with the flag
      HARDCODED, discarding the stream's own validity.
      So the pair is live in the stream and inert after transport. One of
      the 19 stream-live (kind, target) pairs is affected; the other 18
      survive.
    found_by: >-
      A characterization test asserting that a battery+vibration dropout
      leaves both nodes not fresh. It failed: vibration stayed fresh
      throughout. The applicability matrix had measured perturbation at the
      SAMPLED STREAM, while every run goes through the EVENT SOURCE.
    verdict: RECORDED_NOT_FIXED
    consequence: >-
      THIS WAS A HOLE IN MY OWN VACUITY GUARD. The whole point of the
      applicability matrix is that a stress profile cannot inject a fault
      nothing acts on, and it was checking the wrong boundary -- one layer
      upstream of where the runs actually consume data. A profile built on
      dropout@vibration would have injected a fault the layer could not
      see and reported a clean result, which is precisely the failure mode
      the matrix exists to prevent.
      The matrix is now TWO-STAGE: a pair is live only if it perturbs the
      sampled stream AND survives into the event stream. 18 live, 30 inert,
      1 lost in transport, and the lost one is REPORTED in every campaign
      artifact rather than quietly excluded -- "this rig cannot deliver
      that fault" is something a reader of a stress result must know.
      NOT FIXED. csia/runtime/plugins.py is not frozen, but changing how
      the simulator delivers the vibration channel alters an
      evidence-producing path that existing tests and golden corpora
      depend on. That is a deliberate decision for a human, not a side
      effect of adding a stress harness.
    artifact: >-
      csia_stress/applicability.py;
      tests/test_stress_layer.py (test_dropout_on_vibration_is_lost_in_transport)

  - id: HF-010
    date: 2026-09-07
    introduced_as: >-
      Commit 032fdf7 named this entry HF-007. That id was ALREADY IN USE by a
      2026-09-06 finding, so it was renumbered to HF-010 before the ledger was
      published. The commit subject is immutable history and still says HF-007;
      this line is here so a reader following that commit lands on the right
      entry rather than on the earlier one.
    phase: PROGRAM A (HF-004 follow-up)
    kind: INSTRUMENT_FIDELITY
    what_happened: >-
      HF-004'S ATTRIBUTED CAUSE WAS CORRECT AND ITS MAGNITUDE WAS BADLY
      UNDERSTATED. The replay rebuilt the core hand-off sequence by
      detecting a CHANGED CHANNEL VALUE; the live adapter
      (PlatformAdapter.to_core_samples) gates on CHANNEL ARRIVAL TIME:
        stamps = tuple(self._latest[ch][1] for ch in mapping.values() ...)
        if stamps and self._emitted.get(sensor) == stamps: continue
      Two identical consecutive readings have different arrival times and
      equal values, so the live run hands the sensor over and the replay
      does not. This was documented as a "slight" under-count.
      MEASURED on a committed 751-tick shadow log: 1454 hand-offs by value
      against 3527 by arrival time. THE VALUE METHOD MISSES 58.8% OF THEM.
    found_by: >-
      Reading the live gate and the replay side by side while working
      HF-004, then counting both reconstructions over the committed logs
      rather than assuming the documented "slight" was slight.
    verdict: PARTIALLY_FIXED_HF_004_STILL_OPEN
    consequence: >-
      NOTHING NEW HAD TO BE LOGGED AND THE FROZEN CORE IS UNTOUCHED. Each
      logged channel already carries `age_s`, so arrival time is
      `t_mono - age_s` -- the same quantity `_latest` holds. The
      reconstruction was reading the wrong field, not missing a field.
      RESULT, decision replay, categorical differences of 750 compared:
        ardupilot  511 -> 13     bit-identical 24 -> 51,
                                 worst relative difference 0.0286 -> 0.0020
        px4        144 -> 144    unchanged, worst relative 0.1045 unchanged
      So HF-004's mechanism accounted for nearly all of the ArduPilot
      divergence and NONE of the PX4 divergence. What remains on PX4 has a
      different cause and is still unattributed. The PX4 hand-off sequence
      did change (1314 -> 1372); the extra hand-offs simply do not touch
      the compared node.
      THE VERDICT IS STILL DIVERGENT ON BOTH PLATFORMS. Decision replay
      still does not serve as a verification instrument and the
      software-hardening gate must still not count it as PASS. HF-004
      stays open with a much sharper characterisation.
      MY FIRST VERSION OF THIS FIX WAS WRONG AND MADE PX4 WORSE (144 -> 282
      divergent). Reconstructed arrival is `t_mono - age_s`, two
      independently rounded quantities, so a HELD value's arrival wobbles
      by microseconds instead of repeating exactly; compared at full
      precision every stamp looks new, which is over-counting, not
      reconstruction. The quantum that fixes it is set from two MEASURED
      scales rather than chosen: held-value jitter maxes at 3.19e-05 s
      (ardupilot) and 1.25e-04 s (px4), while the smallest real
      inter-arrival gap is 0.0186 s and 0.0198 s -- populations separated
      by 159x on the tighter platform. 1 ms sits ~8x above the worst
      jitter and ~19x below the smallest real gap, and any value in
      [1.3e-4, 1.8e-2] gives the same answer. That is what makes it a
      quantisation and not a tuning knob.
      The old gate is KEPT AND SELECTABLE (`gate="value"`) so the two can
      be compared rather than one silently replacing the other, and the
      report now names the gate it used.
    artifact: >-
      tools/deploy/profile_core_from_log.py (HandoffReconstructor);
      tools/assurance/decision_replay.py;
      tests/test_handoff_reconstruction.py

  - id: HF-011
    date: 2026-09-07
    introduced_as: >-
      Commit 032fdf7 named this entry HF-008. That id was ALREADY IN USE by a
      2026-09-06 finding, so it was renumbered to HF-011 before the ledger was
      published. The commit subject is immutable history and still says HF-008;
      this line is here so a reader following that commit lands on the right
      entry rather than on the earlier one.
    phase: PROGRAM A (freeze verification)
    kind: GUARD_CANNOT_DO_ITS_JOB
    what_happened: >-
      THE FROZEN-CORE DIRECTORY DIGESTS HASH COMPILED BYTECODE ALONGSIDE
      SOURCE. `sha256_tree` walks every file under a directory, so
      `__pycache__/*.pyc` is hashed with the .py files. CPython's default
      timestamp-based invalidation embeds the SOURCE MTIME in the .pyc
      header, so a file rewritten and then restored BYTE-IDENTICALLY still
      produces a different .pyc and a different directory digest.
      The recorded counts show it plainly: the manifest records
      csia/trust_engine as 4 files where the directory holds 2 sources, and
      csia/diagnosis as 12 where it holds 6. The other half is bytecode.
      CONSEQUENCE: A FRESH CLONE HAS NO __pycache__ AT ALL, so those two
      digests cannot be reproduced anywhere the artifact was not built.
      The check could never have passed on a fresh clone. That is the same
      shape as the freeze-tag test that SKIPS on a fresh clone, already
      recorded in docs/OPTIPLEX_VALIDATION_NODE.md: a guard that only works
      where it was made.
      `sha256_tree`'s own docstring claimed the digest was "stable under
      mtime". Through the bytecode it had no such stability.
    found_by: >-
      The digest for csia/diagnosis failing after mutation-testing runs
      rewrote and restored frozen source files byte-identically. Git
      reported the tree clean and `git diff csia-v1.0-research-final`
      reported EMPTY, so the source was provably unchanged while the
      digest said otherwise.
    verdict: FIXED_WITHOUT_TOUCHING_THE_RECORDED_EVIDENCE
    consequence: >-
      THE FROZEN SOURCE WAS NEVER MODIFIED. Verified two independent ways:
      `git diff csia-v1.0-research-final -- <the six frozen paths>` is
      empty, and the per-file hashes recomputed now equal the ones the E1
      manifest recorded for online.py, failsafe.py, scenarios.py and
      profiles.py. ONLY THE TWO DIRECTORY DIGESTS WERE EVER CONTAMINATED;
      every per-file hash in the manifest was always correct.
      THE RECORDED VALUES ARE NOT EDITED. Overwriting a frozen digest to
      make a test pass is exactly what must not happen, so the two
      contaminated values stay in E1_FREEZE_MANIFEST.yaml as the historical
      record they are, and the manifest is byte-unchanged.
      WHAT WAS ADDED INSTEAD: `sha256_tree(..., source_only=True)`, which
      excludes build artifacts, and
      research/physical_validation/results/FROZEN_SOURCE_DIGESTS.json,
      which records source-only digests measured from a tree verified
      byte-identical to the freeze tag and IS reproducible on a fresh
      clone. Two tests now cover it: one recomputes those digests, and one
      cross-checks them against the manifest's per-file hashes so the two
      records cannot drift apart silently.
      Verified to discriminate: appending one comment line to a frozen file
      makes the new test fail, and restoring it makes it pass.
    artifact: >-
      research/physical_validation/results/FROZEN_SOURCE_DIGESTS.json;
      tools/csia_experiment/build_e1_freeze_manifest.py;
      tests/test_e1_freeze_manifest.py

  - id: HF-012
    date: 2026-09-07
    introduced_as: >-
      Commit c8b5dae named this entry HF-009. That id was ALREADY IN USE by a
      2026-09-06 finding, so it was renumbered to HF-012 before the ledger was
      published. The commit subject is immutable history and still says HF-009;
      this line is here so a reader following that commit lands on the right
      entry rather than on the earlier one.
    phase: PROGRAM A (independent verification)
    kind: REPRODUCTION
    what_happened: >-
      A SECOND, INDEPENDENT REDUCTION OF THE E1 RAW TRACES REPRODUCES THE
      PUBLISHED NUMBERS. Every published E1 figure had passed through
      exactly one program, so the artifact, the claim table and the paper
      agreed with each other BY CONSTRUCTION and would have agreed just as
      loudly if that program were wrong.
      The second reducer was written from the trace format and the
      preregistered window definitions, without reading
      extract_trust_a2.py. The aggregation rule was recovered by testing
      candidates against one published trial: mean, median and last value,
      of which the MEDIAN reproduced the published figure to the last digit
      and the others did not.
      RESULT over 80 trials (40 ArduPilot + 40 PX4):
        per-trial trust_pre, trust_post, trust_delta   0 mismatches
        every window's trust and n_steps               0 mismatches
        n, median, min, max of the fault distribution  reproduced exactly
        20 of 20 fault trials with a positive delta    reproduced, both platforms
    found_by: >-
      Writing the reducer and running it, rather than assuming that a
      number nothing had ever recomputed was a number that had been checked.
    verdict: REPRODUCED_WITH_ONE_AMBIGUITY
    consequence: >-
      THE ONE THING THAT DID NOT REPRODUCE FIRST TIME WAS THE IQR, AND THE
      CAUSE IS A DEFINITION THE ARTIFACT NEVER STATES. Its
      `statistics_policy` promises "N, median, min, max and IQR at the
      TRIAL level" and does not say which quartile definition. The
      published q1/q3/iqr come from Python's DEFAULT method (`exclusive`);
      my first reducer chose `inclusive` and disagreed. Neither is wrong --
      they are different statistics:
        A2  iqr 1.2874e-05 (exclusive, published) vs 1.1898e-05 (inclusive)
        P1  iqr 5.3640e-04 (exclusive, published) vs 4.3690e-04 (inclusive)
      That is an 8% difference on A2 and 19% on P1, in the third
      significant figure of a reported quantity. AN INDEPENDENT REPRODUCER
      CANNOT LAND ON THE PUBLISHED IQR WITHOUT GUESSING.
      NOTHING IS CHANGED IN THE PUBLISHED ARTIFACT. The frozen result is
      correct under the method it used; the gap is that the method is not
      recorded next to the number. The reducer now reports BOTH definitions
      side by side and records which one reproduces the published figures,
      and a test pins that so the ambiguity is documented rather than
      rediscovered.
      WHAT THIS DOES NOT ESTABLISH, stated because a reproduction is easy
      to over-read: that the traces describe reality, that the windows were
      the right windows, or that the experiment answers its question. A
      second reduction checks arithmetic and bookkeeping, not physics.
    artifact: >-
      tools/csia_experiment/reduce_e1_independently.py;
      research/physical_validation/results/E1_INDEPENDENT_REDUCTION.json;
      tests/test_e1_independent_reduction.py

  - id: HF-013
    date: 2026-09-07
    introduced_as: >-
      Commit c8b5dae named this entry HF-010. That id was ALREADY IN USE by a
      2026-09-06 finding, so it was renumbered to HF-013 before the ledger was
      published. The commit subject is immutable history and still says HF-010;
      this line is here so a reader following that commit lands on the right
      entry rather than on the earlier one.
    phase: PUBLICATION (prose-to-artifact bindings)
    kind: TRACEABILITY
    what_happened: >-
      THE 27 AMBIGUOUS PROSE LITERALS WERE NARROWED BY SECTION CONTEXT, AND
      MOST OF THEM STAYED AMBIGUOUS. Each literal sits in a section about
      one experiment whose artifacts live under a path that names it, so
      filtering candidates to that scope decides some of them.
      OUTCOME of 27:
        3  CONFIRMED, hand-verified against prose and artifact
        1  REVIEW -- the prose and the artifact disagree
        1  DUPLICATE_POINTER -- one quantity recorded at two pointers
        2  SPURIOUS_MATCH -- the shared token means something else
        1  ALREADY_STATED elsewhere
       19  STILL AMBIGUOUS
    found_by: >-
      Filtering by section, then reading every surviving candidate against
      the sentence by hand rather than accepting the survivor because it
      was the only one left.
    verdict: PARTIALLY_RESOLVED_NOTHING_APPLIED
    consequence: >-
      THE THREE CONFIRMED BINDINGS have independent corroboration, not just
      a matching value. 0.717 and 0.723 are the minimum and maximum of
      `ramp_versus_step`'s three ramps (0.71813, 0.71686, 0.72273), and the
      SAME three entries carry floor_ticks 104, 168, 139 -- the prose's
      "104 to 168 ticks" pins the identification without using the trust
      values at all. 0.678 is observed_range[0] under a key named
      evidence_floor_confirmation, in the section that derives the floor.
      THE REVIEW ITEM IS A REAL DISAGREEMENT. The prose says "the measured
      floor ranges 0.678 to 0.700"; the artifact's observed_range is
      [0.6785, 0.9422], whose upper end is 0.9422, not 0.700. 0.700 is the
      SATURATION value -- predicted_e_f algebraically, and the value the 8
      of 21 saturating cells land on. The sentence therefore pairs a
      measured minimum with a saturation value and calls the pair a
      measured range. Not obviously wrong, since 0.7000 IS measured in
      those cells and the paper states that separately, but the artifact
      holds no scalar for "measured floor upper end" and there is nothing
      honest to bind to. FLAGGED FOR A HUMAN, NOT BOUND -- binding the
      bound of a wider population is precisely the MX-013 error.
      THE SPURIOUS MATCHES MATTER MORE THAN THE BINDINGS. kappa(S) = 0.000
      over eight HYPOTHESIS classes matched V2_COMPLEXITY.json '/*/classes'
