    artifact: papers/BIB_VERIFICATION_LEDGER.yaml; make bib-guard

  - id: FL-003
    date: 2026-09-06
    phase: P2 (synthetic adapter quarantine)
    kind: OUR_OWN_ERROR
    what_happened: >-
      The synthetic-evidence quarantine guard's first marker list contained
      the bare phrase "SYNTHETIC EVIDENCE", matched case-insensitively. It
      flagged papers/csia_systems/main.tex, which says "...with a synthetic
      evidence sequence: maximum absolute error 0.00...". That sentence is
      correct methodology describing a closed-form check against a
      constructed input, not constructed data masquerading as a measurement.
    found_by: >-
      tests/test_synthetic_evidence_is_quarantined.py on its first run.
    verdict: RECORDED
    consequence: >-
      THE TEMPTING FIX WAS THE WRONG ONE. Adding main.tex to the exemption
      list would have made the guard pass and would then have exempted that
      file from every FUTURE violation -- and main.tex is precisely the file
      where a synthetic number must never appear. The marker was narrowed
      instead, to the adapter's own distinctive string
      ("SYNTHETIC EVIDENCE -- constructed for testing"), which cannot occur in
      ordinary prose. No exemption was added.
      Also in the same run: figures/ was in the scanned tree list and holds
      only PNGs, so the coverage check correctly reported that the scan
      matched nothing there. figures/ was removed from the list rather than
      the coverage check weakened -- a PNG cannot carry a JSON marker.
    artifact: tests/test_synthetic_evidence_is_quarantined.py

  - id: FL-004
    date: 2026-09-06
    phase: P3 (csia-edge validate)
    kind: OUR_OWN_ERROR
    what_happened: >-
      The first capability summary keyed relations by NAME alone.
      `velocity_gps_doppler` names two distinct edges (imu0-gps and
      imu1-gps), so on the single-IMU reference profile it appeared in BOTH
      the "structurally absent" and the "unknown" bucket at once. The report
      was internally correct -- one instance is INAPPLICABLE, the other
      UNKNOWN -- and read as a contradiction.
    found_by: >-
      Running `csia-edge validate --profile
      profiles/minimal_single_imu_ardupilot.yaml` and reading the output,
      rather than by any test.
    verdict: RECORDED
    consequence: >-
      Summary labels now carry their endpoints when a relation name is
      ambiguous: velocity_gps_doppler(imu0,gps) against
      velocity_gps_doppler(imu1,gps). Pinned by
      test_an_ambiguous_relation_name_is_disambiguated_in_the_summary, which
      asserts the two buckets are disjoint. Worth recording because the
      underlying data was right and only the presentation was wrong -- which
      is the class of defect a test suite does not catch and a reader does.
    artifact: csia/aircraft/capability.py; tests/test_csia_edge.py

  - id: FL-005
    date: 2026-09-06
    phase: P3 (csia-edge)
    kind: GUARD_STOPPED_WORK
    what_happened: >-
      P3 asked for a `csia-edge run` runtime. The repository already has a
      mature one -- csia/deploy/shadow.py, with structural transmit-surface
      denial, the flight-log header and the watchdog -- and building a second
      would repeat the parallel-hierarchy mistake P1 correctly avoided.
    verdict: RECORDED
    consequence: >-
      `csia-edge run` deliberately exits 4 and points at `csia-shadow`. What
      csia-edge adds is `validate`, which did not exist: the pre-flight
      answer to "what will this vehicle be blind to", derived from the
      profile and the frozen relation graph before anything is connected.
      A SEAM IS ALSO NOW EXPOSED RATHER THAN HIDDEN: this repository has two
      overlapping configuration concepts -- configs/vehicle/*.yaml (the
      deployment config, whose SHA is in every flight-log header) and
      profiles/*.yaml (the canonical vehicle profile). They overlap on
      autopilot family and transport. `csia-edge validate --deployment`
      cross-checks them and exits 3 on conflict rather than preferring one.
      Unifying them would change the flight-log header hash and therefore
      every committed trial manifest, so that decision is NOT made here and
      is flagged for the user.
    artifact: csia/deploy/edge.py; tests/test_csia_edge.py

  - id: FL-006
    date: 2026-09-06
    phase: P9-P10 (clean-room reference and property campaign)
    kind: GUARD_STOPPED_WORK
    what_happened: >-
      tests/test_ci_env.py::test_every_third_party_import_is_installed_by_ci
      failed, reporting `independent_checker` and `structural_reference` as
      "imported but not in any extra CI installs". Both are repository files,
      imported by the property test after a sys.path insert -- the exact
      pattern that guard's own docstring exists to permit.
    found_by: The full suite run after P9/P10.
    verdict: RECORDED
    consequence: >-
      THE TEMPTING FIX WAS AGAIN THE WRONG ONE. Declaring two repository
      modules as PyPI dependencies in pyproject.toml would have made the
      guard pass and would have been a lie in the packaging metadata.
      The guard was conflating two questions that its own docstring already
      distinguishes: "what do our first-party sources IMPORT" (scan csia/,
      tests/, tools/) and "what is IMPORTABLE from this repository" (a wider
      set). research/ answers the second and must not be added to the first,
      because it also holds analysis scripts importing matplotlib and sympy
      that CI neither installs nor needs.
      Split into SCANNED_DIRS and LOCAL_NAME_DIRS. The scan is unchanged; the
      name lookup now also walks research/ and engineering/.
    artifact: tests/test_ci_env.py

  - id: FL-007
    date: 2026-09-06
    phase: P10 (property campaign)
    kind: NEGATIVE_RESULT
    what_happened: >-
      NOT A FAILURE -- recorded because a campaign that reports only what it
      found is missing half its result. The 100,000-structure campaign found
      ZERO disagreements and ZERO counterexamples. Every property held.
    verdict: RECORDED
    consequence: >-
      A clean campaign is a weaker result than a campaign that found and fixed
      something, and it is worth saying so. What it establishes is bounded:
      three STRUCTURAL implementations agree, and production was NOT among
      them -- see PAPER_IMPACT_LEDGER PI-002 for why, and for what may
      therefore not be claimed.
    artifact: research/physical_validation/results/structural_property_campaign.json

  - id: FL-008
    date: 2026-09-06
    phase: P11 (edge-identifier correction)
    kind: OUR_OWN_ERROR
    what_happened: >-
      THE FIX FOR FL-004 WAS ITSELF WRONG, and this entry supersedes its
      consequence field. To disambiguate the two velocity_gps_doppler edges I
      SYNTHESISED a label -- "velocity_gps_doppler(imu0,gps)" -- by
      concatenating the relation name with its endpoints. It read well, the
      buckets were disjoint, the test passed, and the string exists nowhere
      else in the repository or in any artifact. Meanwhile the runtime has had
      stable identifiers for these two edges since before this program began:
      csia/prediction/comparator.py:149-150 computes them as
      `velocity_gps_doppler_0` (imu0-gps) and `velocity_gps_doppler_1`
      (imu1-gps), csia/runtime/online.py:207-208 registers the same two in
      _edge_meta, csia/deploy/shadow.py:191 traces them by those names, and
      they are the keys under `gps_gates` in every Mechanism-A trial artifact.
    found_by: >-
      Re-reading csia/prediction/comparator.py while checking whether the
      capability report could be joined to a trial artifact. No test caught
      it: the FL-004 test asserted the two buckets were DISJOINT, which a
      wholly invented label satisfies perfectly.
    verdict: RECORDED
    consequence: >-
      The invented labels were replaced by the runtime's own identifiers
      (csia/aircraft/capability.py EDGE_ID, edge_id(),
      RelationCapability.edge_id), and to_dict() now emits "edge_id" beside
      "relation" rather than replacing it -- the display name is still true and
      still useful, it is simply not an identifier.
      THE LESSON IS NOT "a name collision needs a suffix". It is that a
      disambiguating label is only worth anything if it JOINS: an identifier
      the rest of the system never writes is a private convention wearing an
      identifier's clothes, and it makes the report look more precise while
      making it strictly less useful.
      Three guards added, none of which the invented scheme would have passed:
      no edge ID may appear in two mutually exclusive availability buckets
      (checked across every shipped profile, not just the one that exhibited
      the defect); every identifier the summary emits must appear as a literal
      in the frozen core; and any relation name the trust graph gives to more
      than one edge must have an EDGE_ID entry, so the next duplicate fails
      closed instead of silently reappearing in two buckets.
      No frozen-core file was modified. No evidence is affected: the capability
      layer is pre-flight reporting and feeds no diagnostic decision.
    artifact: csia/aircraft/capability.py; tests/test_csia_edge.py
    supersedes: FL-004 (consequence only; the defect description stands)

  - id: FL-009
    date: 2026-09-06
    phase: P1-followup (profile/deployment seam)
    kind: OUR_OWN_ERROR
    what_happened: >-
      The first draft of csia/deploy/deployment.py asserted -- in its module
      docstring, and enforced it in code -- that the deployment config's
      `csia.profile: FIELD_DERIVED_NOISE` "selects per-sensor noise
      parameters, which is diagnostic by definition". Both halves were wrong.
      It resolved the string through csia/profiles.py:get_profile(), which
      holds VEHICLE profiles (sow001_quad, interceptor_seeker), and the
      loader therefore raised on configs/vehicle/example_quad.yaml -- the only
      committed deployment config in the repository. FIELD_DERIVED_NOISE lives
      in csia/simulation/profiles.py. Two registries, one word.
      The second error was the one that mattered. Following the value through
      the runtime shows csia.profile reaching exactly one place --
      csia/deploy/shadow.py:285, the flight-log header. It selects nothing. It
      is a provenance LABEL, and it has to be: a shadow deployment reads real
      telemetry and has no simulated noise to parameterise.
    found_by: >-
      Running the new loader against the committed config instead of trusting
      the docstring. The KeyError named the registry that did not contain the
      value, which is what exposed that there were two.
    verdict: RECORDED
    consequence: >-
      THE DOCSTRING WAS THE DEFECT, not the code. It was a plausible claim
      about the system, written from key names rather than from following the
      call, and it would have propagated into the standards work and the
      handoff packet as "the deployment config sets three diagnostic values".
      The true figure is TWO -- csia.tick_hz and csia.field_mode, both of which
      are passed to OnlineTrustLayer -- and it is now DERIVED rather than
      asserted: core_reachable_keys() reads cli.py's ShadowConfig construction
      and shadow.py's OnlineTrustLayer call and reports the intersection, so
      the number cannot go stale the way a docstring can.
      The label is still validated at load, against the correct registry, for
      a different and smaller reason: it lands in the permanent flight-log
      header, and a typo there names nothing forever.
      Worth recording because nothing failed. The suite was green, the design
      was sound, and the module simply said something untrue about the system
      it was documenting -- which is the failure mode that a test suite cannot
      catch and that a paper inherits verbatim.
    artifact: >-
      csia/deploy/deployment.py; docs/VEHICLE_PROFILE_VS_DEPLOYMENT.md;
      tests/test_deployment_schema.py

  - id: FL-010
    date: 2026-09-06
    phase: P1-followup (incidental finding)
    kind: OUR_OWN_ERROR
    what_happened: >-
      docs/DOCUMENT_INDEX.md opens "319 markdown files exist in this
      repository." The tracked count at commit cb4e797, before this program
      added any document, is 342. The index's own status vocabulary calls
      itself CANONICAL, so the first sentence a new reader meets is a
      measurement that is 23 short.
    found_by: >-
      Checking, before adding docs/VEHICLE_PROFILE_VS_DEPLOYMENT.md, whether a
      guard would object to a new markdown file. None does -- and that absence
      is why the number drifted.
    verdict: RECORDED
    consequence: >-
      Corrected to the measured count and pinned by a guard, because this
      repository already decided this question for a different number:
      tests/test_doc_counts.py exists precisely because "39", "48", "62" and
      "77" were each the true collected test count at some commit and each was
      stale when a reader saw it. The same rule now applies to the markdown
      count. The guard adds friction to every commit that adds a document,
      which is the intended cost: the alternative is a CANONICAL document
      whose first sentence is false.
      NOT a scientific defect and no claim depends on it.
    artifact: docs/DOCUMENT_INDEX.md; tests/test_doc_counts.py

  - id: FL-011
    date: 2026-09-06
    phase: P7 (repeated current-stack preregistration)
    kind: NEGATIVE_RESULT
    what_happened: >-
      THE ORIGINAL E1 BUILD CANNOT BE IDENTIFIED. Preparing the repeated
      Mechanism A preregistration required pinning the autopilot build the
      original n=1 trials ran on. It is not recorded anywhere:
      research/v1_1/results/mechanism_a_ardupilot.json carries
      `platform: "ardupilot"` and nothing more; the underlying
      results/mechanism_a/ap_FAULT.json carries no firmware field at all;
      research/v1_1/CURRENT_STACK_REPLICATION.md names "ArduPilot 4.8"
      throughout and never a commit. configs/vehicle/example_quad.yaml has
      `firmware_git_hash: UNSET` with the comment "Fill this in from the
      vehicle, do not copy it from here" -- the field exists, the discipline
      was designed, and the campaign predates its use.
      "ArduPilot 4.8" is a DEVELOPMENT BRANCH, not a release: the newest
      released tag is Copter-4.7.1. Every 4.8-dev build is a different
      program.
    found_by: >-
      Writing the P7 preregistration and trying to pin the build, rather than
      writing "the same stack" and moving on.
    verdict: RECORDED
    consequence: >-
      A repeated campaign therefore CANNOT be described as a repeat of the
      original run, and the preregistration says so in section 2 before any
      data exists. What it can establish is the within-build repeatability of
      a NEWLY PINNED build (e21b732a07ce2b632ea99b098ee6ab7ece0971ea, authored
      2026-09-05, verified to contain the same
      AP_GROUPINFO("GLTCH", 6, GPSParms, glitch, 0) injection parameter the
      replication document cites).
      THE CONSEQUENCE THAT MATTERS: if the repeat's numbers differ from the
      original's, there are two candidate explanations -- run-to-run variation
      and a different autopilot build -- and the design cannot separate them,
      because one of the two is unrecoverable. Reporting a difference as
      run-to-run variation would assert something no design here can
      establish.
      Going forward, tools/csia_experiment/manifest.py:provenance() records
      the pinned commit in every trial manifest, and a trial whose manifest
      lacks it is INVALID_SCENARIO rather than a result. That closes the gap
      for future campaigns; it cannot close it retroactively.
      NOT A DEFECT IN THE ORIGINAL RESULT. The n=1 Mechanism A finding stands
      on what it measured. What is lost is the ability to re-run exactly it.
    artifact: >-
      research/physical_validation/prereg/MECHANISM_A_REPEATED_CURRENT_STACK_PREREG.md;
      research/v1_1/results/mechanism_a_ardupilot.json

  - id: FL-012
    date: 2026-09-06
    phase: P8 (execution environment)
    kind: GUARD_STOPPED_WORK
    what_happened: >-
      Neither current-stack simulator was installed in this environment.
      `which sim_vehicle.py arducopter px4` returns nothing, no ArduPilot or
      PX4 source tree exists on disk, and firmware.ardupilot.org answers 000
      through the agent proxy. The E1 evidence tier depends on both.
    found_by: >-
      Checking whether P8 could actually run before writing anything that
      assumed it could. USER_ACTION_REQUIRED.md initially said the repeated
      campaign "runs on the same ArduPilot 4.8 SITL and PX4 SIH"; that
      sentence was true about HARDWARE and false about this environment, and
      it was corrected rather than left.
    verdict: RECORDED
    consequence: >-
      ArduPilot is buildable here and was measured to be: the source clones
      from github.com (821 MB, under 60 s), gcc/g++/make/cmake/ninja are all
      present, 22 GB of disk is free, and `./waf configure --board sitl`
      returns 0. So the blocker is not access -- it is build time and the
      section-2 identifiability problem above.
      Recorded rather than assumed either way. A campaign reported as "not run
      because it could not be run" when it could have been is as much a
      misstatement as the reverse.
    artifact: research/physical_validation/prereg/MECHANISM_A_REPEATED_CURRENT_STACK_PREREG.md

  - id: FL-013
    date: 2026-09-06
    phase: P7/P8 (build identification)
    kind: OUR_OWN_ERROR
    what_happened: >-
      FL-011 IS WRONG AND THIS ENTRY CORRECTS IT. FL-011 concluded that the
      autopilot build behind the E1 Mechanism A evidence "cannot be
      identified", on the strength of having searched the Mechanism A
      artifacts and CURRENT_STACK_REPLICATION.md and found no firmware field.
      That search was too narrow. The build is recorded, unambiguously and in
      four places, by artifacts from the same campaign era:
      research/phase2/results/modern_replication.json carries
      `git_head: 01a504b` with `firmware_string: ArduCopter V4.8.0-dev`;
      research/dual_admissibility_confirmatory/results/STAGE2_1_KILL_TEST.json
      carries "simulator": "ArduPilot SITL @ 01a504b"; every row of
      .../heldout_raw/CAPTURE_INDEX.json carries
      "ArduCopter V4.8.0-dev@01a504b"; and HIL_CRITERION_0_PLAN.md names it as
      "the same commit the repository is verified against".
      The commit resolves: 01a504b472259602e13df4cf07df7c0cdbb35993, authored
      2026-08-23, two days before the Mechanism A flight ids
      (20260825T005244Z, 20260825T005343Z).
    found_by: >-
      Running research/phase2/modern_replication.py against a freshly built
      master and reading the resulting git DIFF, which showed the committed
      artifact's `git_head` changing from 01a504b to the new build's hash. The
      recorded value was visible only because the file was overwritten -- see
      the consequence below, which is a second, separate error.
    verdict: RECORDED
    consequence: >-
      TWO ERRORS, AND THE SECOND IS WORSE THAN THE FIRST.
      (1) FL-011's conclusion is withdrawn. The repeated campaign IS a repeat
      of the original build, not of a newly pinned one, and the
      preregistration was corrected BEFORE being frozen -- section 2 now
      records the identification, the correction and why it matters. What
      survives from FL-011 is the narrower true statement: the Mechanism A
      artifacts THEMSELVES carry no firmware field, and a reader holding only
      those files cannot identify the build. That is worth fixing going
      forward, and tools/csia_experiment/manifest.py:provenance() now records
      the build in every trial manifest.
      (2) RUNNING THE PROBE OVERWROTE COMMITTED EVIDENCE.
      modern_replication.py writes research/phase2/results/
      modern_replication.json unconditionally, and running it modified a
      committed artifact -- the exact thing this program is instructed never
      to do. It was reverted immediately with `git checkout --` and the file
      is byte-identical to its committed state; no commit contains the
      modification. The near-miss is recorded because the guard that should
      have caught it does not exist: nothing in this repository stops a
      research script from overwriting frozen evidence, and the only reason it
      was noticed is that `git status` was checked straight afterwards.
      NO EVIDENCE IS AFFECTED. The overwrite lasted under a minute and was
      never committed.
    artifact: >-
      research/physical_validation/prereg/MECHANISM_A_REPEATED_CURRENT_STACK_PREREG.md;
      research/phase2/results/modern_replication.json
    supersedes: FL-011 (conclusion withdrawn; the narrow finding stands)

  - id: FL-014
    date: 2026-09-06
    phase: P8 (repeated current-stack campaign)
    kind: OUR_OWN_ERROR
    what_happened: >-
      THE CAMPAIGN RAN WITHOUT CAPTURING ONE OF ITS OWN PREREGISTERED
      QUANTITIES. Section 5 item 2 of the preregistration asks for the trust
      coefficient of `gps` before and after onset. The per-tick trust series
      is written by tools/deploy/shadow_sitl_check.py only when it is given
      `--trust-trace`, and the campaign runner did not pass it. All 40 trials
      ran, all 40 adjudicated VALID, and the trust data is simply not in the
      flight logs.
    found_by: >-
      Extracting the preregistered quantities from the logs rather than
      assuming the campaign had captured them. The extractor reports
      NOT_CAPTURED with the reason; it does not infer a value, and it does not
      leave the field absent where a reader might miss it.
    verdict: RECORDED
    consequence: >-
      The 40 trials are NOT invalidated. The other preregistered quantities
      were captured, the arithmetic balances, and the qualitative comparison
      the preregistration fixed in advance holds: the collapse occurs in 20 of
      20 valid FAULT trials and 0 of 20 valid CONTROL trials.
      WHAT IS LOST IS SPECIFIC. This campaign says NOTHING about the "trust
      rises across the fault" observation (ArduPilot 0.9213 -> 0.9300, PX4
      0.9856 -> 0.9875), which therefore still rests on n=1 per platform. That
      observation is quoted in the master system input packet section G and in
      the DEA profile's justification for NOT standardising "gate closure
      shall lower trust", so it is not a minor gap -- it is the one number a
      repeat would most have strengthened.
      The remedy is a SECOND campaign with --trust-trace, not a re-read of
      these logs: the data is not in them. Recorded as a follow-on rather than
      run here, because a second 40-flight campaign was not started at the
      point this was discovered and starting one to avoid recording a
      shortfall would be the wrong order of operations.
      THE GENERAL LESSON: a preregistration that names quantities does not
      make a runner capture them. The runner should have been checked against
      section 5 field by field before 40 flights, the same way it was checked
      against the adjudication vocabulary on a 1+1 pair.
    artifact: >-
      research/physical_validation/prereg/MECHANISM_A_REPEATED_STATUS.md;
      research/physical_validation/results/mechanism_a_repeat_ardupilot.json

  - id: FL-015
    date: 2026-09-06
    phase: P8 (quantity extraction)
    kind: OUR_OWN_ERROR
    what_happened: >-
      Three defects in the extractor, each found by looking at the data rather
      than at the summary it produced.
      (1) A flight log's last line carries no `t_mono`. The extractor
      defaulted it to 0.0, which gave that row a large negative relative time,
      swept it into the "before" bucket and made it `before[-1]`. Every
      "before" reading was therefore taken from a row with no gates and came
      back 0.0 on BOTH arms -- which read as the mechanism being present
      before the injection.
      (2) A single tick either side of onset is a fragile estimator of a
      quantity being claimed to have changed. Replaced with the median over a
      2 s window.
      (3) first_t and the RULE-B tick count were then measured over the
      settled window, which starts at onset+2, so the collapse was reported at
      14.00 s when the series shows it at 13.04 s. The extractor was reporting
      its own window boundary as if it were a measurement.
    found_by: >-
      Printing the gate-weight time series for one FAULT and one CONTROL trial
      instead of trusting the aggregate. The transitions -- 0.0 at t=0, 3.0 at
      t=0.08, 0.0 at t=13.04 on the fault arm and no collapse at all on the
      control -- made all three defects visible at once.
    verdict: RECORDED
    consequence: >-
      All three fixed and the reason recorded in the source. The corrected
      numbers replicate the original n=1 result: the original's first_t of
      12.043901 for `gnss.position MISSING` falls inside the repeat's range
      (12.0399-12.0827, median 12.0432) and its 450 ticks is bracketed by the
      repeat's 449-450.
      A FOURTH THING THE SAME INSPECTION CAUGHT, and it is the important one:
      the original artifact's first_t is for a DIFFERENT INTERMEDIATE QUANTITY
      than the gate weight. It reports "gnss.position MISSING with NO_3D_FIX"
      -- the canonical channel going away -- while the extractor was measuring
      the diagnostic gate closing, which follows it about a second later.
      Reporting one against the other as a replication would have been exactly
      the RULE-B failure the trial contract exists to prevent. Both are now
      extracted, both are named, and the ~1.0 s interval between them is
      reported as an observation with no claim attached.
    artifact: tools/csia_experiment/extract_mechanism_a.py


