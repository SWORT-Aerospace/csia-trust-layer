  - id: MX-020
    date: 2026-09-08
    phase: QUALITY (gate integrity)
    kind: GATE_COULD_NOT_FAIL
    what_happened: >-
      THE MUTATION HALF OF THE QUALITY RATCHET WAS INCAPABLE OF FAILING, AND
      HAD BEEN REPORTING HOLDS. `quality_ratchet.py` does not run the
      probes: it reads the three mutation artifacts committed under
      research/mission/results/. Nothing regenerates them. The nightly's
      mutation stage writes to a run-scoped build/nightly/<ts>/mutation.json
      that the ratchet never opens, and no Makefile target, workflow or
      script writes the three files it does open. So every night it compared
      committed files against a floor derived from those same committed
      files and found them equal, by construction.
      A SECOND, SEPARATE DEFECT in the same function: the comparison loop ran
      over ("mutation_mission", "mutation_frozen_core") only, while the floor
      also stores `mutation_assurance_baseline`. That metric was measured on
      every run, written into the floor, and never compared to anything.
      The coverage half of the ratchet was never affected -- it shells out to
      pytest and measures live.
    found_by: >-
      Reading measure_all() while preparing the deliberate re-baseline that
      MX-015 called for, and asking what actually writes the file it reads.
      Nothing does. Confirmed by grepping every script, workflow and Makefile
      target for the three artifact paths: the only writers are the ledger
      and the tools' own source.
    verdict: REAL_DEFECT_FIXED
    consequence: >-
      The fix is not to run three probes every night, which would add hours
      for no information while the code is unchanged. A stored score IS a
      valid measurement of the code it was taken over; what was missing was
      the link between the two. Three changes:
      (1) both the floor and, for runs after this change, the artifact itself
      record `targets_digest` -- a sha256 over the CONTENTS of the target
      files -- and a score is comparable only while that digest still matches
      the working tree;
      (2) an independent staleness signal, SITE_COUNT_DRIFT: every artifact
      already records the mutation-site count it saw, which is a pure
      function of the targets' syntax, so a disagreement proves the artifact
      is stale even if a digest was recorded wrongly;
      (3) MUTATION_METRICS now names all three metrics, and a test asserts it
      covers every mutation key present in the floor, so a metric cannot be
      floored and ungated again.
      Artifact-declared digests outrank the floor's own record, and the
      report labels which of the two it used (ARTIFACT_DECLARED vs
      FLOOR_RECORDED) so a weaker provenance is never shown as a stronger
      one. Changing a target file now makes the gate NOT_COMPARABLE -- exit
      2, INCONCLUSIVE, never a pass -- until the probe is re-run.
      Verified in both directions: with no digests recorded the gate went
      from HOLDS to NOT_COMPARABLE on all three metrics; a synthetic fall in
      mutation_assurance_baseline, previously invisible, now reports
      REGRESSION.
    honest_limit: >-
      This makes a stale score UNUSABLE, not fresh. While the targets are
      unchanged the gate can still only confirm that the tests did not get
      worse against code that also did not change; a regression introduced
      by a test-only edit, with the targets untouched, is still not detected
      until somebody re-runs the probe. Detecting that would need the probes
      in the nightly, at a cost of hours per run, and has not been done.
    artifact: >-
      tools/xr/quality_ratchet.py; tools/xr/mutation_probe.py;
      tests/test_quality_ratchet.py;
      research/mission/results/QUALITY_FLOOR.json
