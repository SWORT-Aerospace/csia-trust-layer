  - id: MX-008
    date: 2026-09-07
    phase: MISSION EXTENSION (quality audit)
    kind: TEST_SENSITIVITY_MEASURED
    what_happened: >-
      A MUTATION PROBE SCORED THE MISSION LAYER AT 0.4676 -- 115 of 216
      injected defects went unnoticed by the tests. The same probe scored the
      csia_assurance firewall from the previous round at 0.6125. Coverage was
      88.7% at the time, so the gap between "the line ran" and "a test
      constrains the line" was 36 percentage points.
    found_by: >-
      Building the probe and running it. No such measurement had been made
      for any part of this repository before.
    verdict: PARTIALLY_ADDRESSED_AND_RECORDED
    consequence: >-
      NEARLY EVERY SURVIVOR WAS A BOUNDARY EQUALITY -- `>` against `>=`, `<=`
      against `<`. They survive because a test checking "well before" and
      "well after" never visits the instant between, and that instant is
      where an off-by-one lives.
      18 boundary tests were added, killing 13 mutants: 0.4676 -> 0.5278.
      ALL 18 PASSED ON FIRST RUN, so no behavioural defect was found -- the
      code was already right at those boundaries and nothing had been
      checking it.
      THE SCORE IS STILL LOW AND IS REPORTED AS LOW. 102 mutants survive, of
      which 17 are provably equivalent (module-level constant renames, where
      every reader uses the same symbol), leaving ~85 real gaps. The weakest
      files are graphs.py 0.364 and forge_seed.py 0.419.
      The probe is committed so the number can be tracked rather than
      re-derived, and it reports its own limits: equivalent mutants are not
      detected, so the score is a LOWER BOUND; and a high score would bound
