      __init__.py. Same word, unrelated quantity, coincident value. A
      resolver that reported 27 of 27 resolved would have bound it.
      A SIDE EFFECT WORTH RECORDING: adding result artifacts makes value
      matching MORE ambiguous, not less. The stress campaign artifact
      committed earlier today now appears as a candidate for the literal
      0.700, because a 1000-run campaign contains many values. Every new
      artifact enlarges the space of coincidences.
      NOTHING IS APPLIED. These bind into PAPER1_ARTIFACT_MAP.yaml, which
