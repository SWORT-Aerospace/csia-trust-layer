  - id: MX-024
    date: 2026-09-08
    phase: PUBLICATION (prose/artifact conflict)
    kind: DECISION_REQUIRED_FROM_A_HUMAN
    what_happened: >-
      main.tex:901 says "the model assumes a constant e_f where the measured
      floor ranges 0.678 to 0.700". The artifact's observed_range is
      [0.6785, 0.9422]. The lower end matches; THE UPPER END DOES NOT.
      0.700 is the algebraic saturation value -- 8 of 21 cells whose
      residual saturates land on exactly 0.7000 -- while the other 13 cells
      have minimum evidence ABOVE 0.700, up to 0.9422, because their fault
      never drove the physics residual to saturation.
      So the prose quotes the band spanned by cells that REACH the floor,
      silently excluding the 13 that do not, and the artifact stores no
      scalar for that selection. Neither side is wrong about a number: the
      sentence describes a selection the artifact does not record, which is
      why the binding target does not exist.
    verdict: OPEN_AWAITING_A_HUMAN
    why_it_matters: >-
      The sentence is defending a modelling assumption against two
      misclassified cells. 0.678-0.700 makes the assumption look tight at
      3%; across all 21 cells the spread is 0.678-0.942, and for the 13
      non-saturating cells the constant-e_f assumption is wrong in the
      OPPOSITE direction and by more. A reader checking whether e_f
      variation explains the misses is entitled to the wider number.
    consequence: >-
      research/publication/DECISION_0700_EVIDENCE_FLOOR.md sets out the
      three options with their costs and recommends stating the selection
      explicitly in prose AND recording the derived quantity in the
      artifact so the claim becomes machine-checkable. NOT APPLIED: it is an
      editorial judgement about what the sentence asserts, and no
      measurement settles it. Binding 0.700 to one of the four surfaced
      candidates -- two of which are a THRESHOLD, not a measurement -- is
      explicitly ruled out as a repeat of MX-013.
    artifact: research/publication/DECISION_0700_EVIDENCE_FLOOR.md

  - id: SR-007
    date: 2026-09-08
    phase: SUPERVISION (SR-006 gap)
    kind: RULE_ADDED_AND_VALIDATED
    status: >-
      RESOLVED. False-alarm measurement complete: 0 firings in 58 campaign
      runs that carry no baro fault, worst margin 0.243 above the threshold.
      The rule stands. Nothing in the deployed default changes -- the whole
      overlay remains opt-in via --data-loss-supervision, off by default.
    what_happened: >-
      SR-006 measured a gap the data-loss overlay does not cover: baro keeps
      DELIVERING while its value walks away from truth. At a drift of 1.0
      units/s the altitude error reaches 327 m and baro trust falls to
      0.231, and the frozen failsafe stays NORMAL at every swept magnitude,
      because FailsafeConfig names baro nowhere.
      Absence of data is SR-001 and dataloss.py covers it. Presence of data
      the trust engine does not believe is a different failure and had no
      rule at all.
    consequence: >-
      csia_supervision/lowtrust.py adds a low-trust rule for sensors the
      frozen policy judges NOWHERE. It fires only on a FRESH sensor, so it
      never double-reports a loss the data-loss rule already owns, and it
      takes arm_time, dwell_up and the disarmed behaviour from the frozen
      FailsafeConfig rather than choosing them.
      STRUCTURAL SAFEGUARD: the module refuses AT IMPORT to carry a rule for
      any sensor the frozen policy already judges. A rule for gps or imu0
      would be this overlay restating -- and therefore able to shift -- a
      frozen threshold, which is retuning the frozen core through the back
      door. eligible() is asserted in tests in both directions.
    the_threshold_is_a_choice_and_the_procedure_was_declared_first: >-
      There is no frozen number for baro, so one had to be chosen, and the
      selection procedure was written down BEFORE any fault was measured:
      (1) measure the minimum baro trust on CLEAN flights, every profile;
      (2) the threshold must sit strictly below that with margin;
      (3) among values satisfying (2), take an EXISTING FailsafeConfig
      constant rather than inventing a new float;
      (4) if none satisfies (2), report it and invent nothing.
      Measured at step 1: clean-flight minimum baro trust 0.9930
      (hover_circle) and 0.9931 (fast_cruise), so all four frozen constants
      clear step 2. Step 3 chose 0.75, the value of nav_caution, because
      baro's ONLY trust-graph edge is altitude_baro spanning (baro, gps),
      and gps trust is what nav_caution governs.
      THAT IS AN ARGUMENT FROM TOPOLOGY, NOT A DERIVATION. The number is
      frozen; applying it to this sensor is a judgement. Provenance is
      recorded as BORROWED_FROM_A_FROZEN_CONSTANT -- weaker than the
      ANCHORED entries in dataloss.py, stronger than a free choice.
    detection_measured: >-
      With the rule on, baro bias_drift is DETECTED from rate 0.02 upward,
      against a campaign sampling range of [0.03, 0.20]. Previously it was
      never detected at any swept magnitude up to 1.00. Peak level CAUTION,
      matching the level dataloss.py already assigns baro.
    the_finding_that_decides_it: >-
      A CLEAN-FLIGHT MARGIN IS THE WRONG MARGIN in principle, because baro's
      only edge partners it with gps and a GPS failure could in theory
      starve baro of corroboration with nothing wrong with the barometer.
      MEASURED, IT DOES NOT. Across 58 campaign variations carrying no baro
      fault, baro's minimum trust over the ARMED window is 0.993 -- the
      clean-flight figure -- and the rule fires zero times. Margin 0.243.
      Another sensor's failure does not degrade baro.
    a_misreading_i_made_and_corrected: >-
      The first version of that measurement read StressRun.min_trust, which
      spans the WHOLE run including warm-up from the 0.8 Beta prior. It
      returned 0.8182 and I reported it as the feared mechanism confirmed --
      GPS loss starving baro, margin only 0.068, the rule possibly unsafe.
      THAT WAS WRONG. 0.8182 is 9/11 to four decimals and appears in EVERY
      campaign run whatever is faulted; runs degrading only battery and imu1
      with GPS entirely healthy report the identical value. It is the
      warm-up floor as trust climbs off the prior and says nothing about
      fault response, and since the rule cannot fire before arm_time it was
      also the wrong window. The uniform percentiles -- p00 through p95 all
      exactly 0.8182 -- were the clue that the instrument, not the system,
      was being measured.
      Re-measured over the armed window: 0.993, margin 0.243, zero firings.
      The conclusion the broken instrument reached (0 false alarms) happened
      to be right, and conservatively so, since a whole-run minimum is a
      lower bound on the armed-window minimum. The REASON it gave was
      fiction. Recorded because a right answer from a wrong measurement is
      still a wrong measurement.
    the_threshold_was_not_adjusted: >-
      At no point was the 0.75 moved. Had the false-alarm rate been
      unacceptable the rule would have been withdrawn or re-scoped; the
      number stayed fixed while the instrument was fixed instead.
    not_covered_and_said_so: >-
      motor_esc has the identical gap and is NOT covered. Its clean-flight
      trust margin under load has not been measured, and a rule whose
      false-alarm rate is unknown is worse than a stated gap. It is listed
      in lowtrust.CANDIDATES so the omission is visible rather than inferred
      from an absence.
    artifact: >-
      csia_supervision/lowtrust.py; csia_supervision/dataloss.py;
      csia_stress/low_trust_false_alarm.py;
      tests/test_lowtrust_supervision.py

  - id: SR-008
    date: 2026-09-08
    phase: SUPERVISION (SR-006 gap, second sensor)
    kind: RULE_ADDED_AND_A_FALSE_ALARM_FOUND_BY_CONSTRUCTION
    what_happened: >-
      motor_esc is the second and last sensor the frozen policy judges
      nowhere. Measured over the declared magnitude sweep, `power_sag` on
      motor_esc drags its trust to 0.79 at 150 rpm lost, 0.64 at 250 and
      0.49 at 700 -- and the frozen core detects NONE of it below 2200 rpm
      lost, which is more than three times the campaign's maximum draw of
      700. Even that 2200 detection is not motor_esc being judged; it is
      the fault growing large enough to trip some other sensor's rule.
    consequence: >-
      A low-trust rule at 0.70, borrowed from power_critical because
      motor_esc's `power_thrust` edge spans (motor_esc, battery) and battery
      trust is what power_critical governs. Level CAUTION, matching
      dataloss.py's motor_esc level: the THRESHOLD is borrowed, the LEVEL is
      not, because a degraded sensor should not outrank the same sensor
      going silent.
      Detection with the rule on: power_sag@motor_esc caught from 250 rpm
      lost upward, covering most of the campaign range. 150 rpm still misses
      (trust 0.7916, above the line) and that is the published floor.
    the_margin_that_set_the_threshold: >-
      NOT the clean-flight one. motor_esc has FOUR trust-graph edges --
      imu0, imu1, battery, vibration -- so other sensors' faults genuinely
      drag it down, unlike baro with its one. Clean-flight minimum 0.9672;
      worst across 140 campaign runs carrying NO motor_esc fault, 0.7984.
      0.75 would have left 0.048 of margin; 0.70 leaves 0.098. Baro's
      equivalent margin is 0.243, and the two rules are recorded as the
      unequally separated pair they are.
    the_false_alarm_that_random_sampling_missed: >-
      140 random campaign runs gave zero false alarms, and that was not
      enough. CONSTRUCTING the adversarial case found one: drop three of
      motor_esc's four partners and leave the fourth (vibration) merely
      DEGRADED, and motor_esc -- perfectly healthy -- is dragged to 0.664
      and the rule raised CAUTION at t=24.6 s. Its one remaining
      corroborator was itself the faulty sensor.
      A random campaign will not reliably draw a specific four-way
      combination. Where the worst case can be reasoned about, it should be
      built, not waited for.
    the_fix_is_structural_not_a_moved_number: >-
      The threshold was NOT lowered to make the case go away. A trust value
      is only evidence of degradation when something was in a position to
      disagree with it; with a single live corroborator, a disagreement
      cannot say WHICH END of the edge is at fault, so a low trust is
      equally consistent with this sensor being bad and with its lone
      corroborator being bad.
      `has_corroboration` therefore requires MIN_CORROBORATORS = 2 live edge
      partners (capped at however many the sensor has) before any judgement,
      with the partner set READ from csia.trust_graph.graph.EDGES rather
      than restated. A sensor that cannot be judged is reported in
      `uncorroborated` rather than silently skipped.
      This is the same rule the capability bridge applies in the other
      direction: UNKNOWN is never resolved into a definite state.
      Verified both ways after the change: both constructed false-alarm
      cases fire NOTHING (1250 unjudgeable ticks each), and every real fault
      still fires -- power_sag@motor_esc at 250, 350 and 700 rpm, baro drift
      at 0.05 and 1.00.
    honest_limit: >-
      MIN_CORROBORATORS = 2 is a structural argument, not a measured
      optimum: two is simply the smallest number at which "which end is at
      fault" is answerable at all. It also costs coverage -- a sensor down
      to one live partner is now never judged, so a genuine degradation
      during a multi-sensor failure will be missed. That is the deliberate
      direction: a miss is a stated limit, a false alarm on a healthy sensor
      trains an operator to ignore the layer.
    artifact: >-
      csia_supervision/lowtrust.py; tests/test_lowtrust_supervision.py;
      research/stress/results/LOW_TRUST_FALSE_ALARM_MOTOR_ESC.json;
      research/stress/results/DETECTION_FLOOR.json

  - id: MX-025
    date: 2026-09-08
    phase: ASSURANCE (the apparatus itself)
    kind: STRUCTURAL_GUARD_ADDED
    what_happened: >-
      THREE TIMES IN ONE SESSION AN INSTRUMENT IN THIS REPOSITORY PRODUCED A
      CLEAN, PLAUSIBLE, ENTIRELY FICTIONAL RESULT.
      MX-020: the quality ratchet compared committed files against a floor
      derived from those same files. It reported HOLDS every night of its
      life and could not have reported anything else.
      MX-021: the detection-floor sweep asked a run object for `.detected`,
      which does not exist. A per-point `except Exception` turned the
      AttributeError into a point with no verdict, those points read as "not
      detected", and the sweep announced UNDETECTED_AT_EVERY_MAGNITUDE for
      all four pairs -- a finding about the FROZEN CORE produced entirely by
      a typo.
      SR-007: the false-alarm measurement read a whole-run minimum spanning
      warm-up from the 0.8 prior. It returned 0.8182 in every run whatever
      was faulted, and that constant was reported as evidence of a specific
      physical mechanism that does not exist.
      EVERY ONE WAS CAUGHT BY A HUMAN DECIDING, ON A HUNCH, TO RUN A
      CONTROL. None was caught by anything structural. This repository tests
      the SYSTEM thoroughly and the APPARATUS almost not at all.
    verdict: RULE_MADE_STRUCTURAL
    consequence: >-
      tools/assurance/instrument_controls.py establishes one rule: an
      instrument may not emit an artifact until it has demonstrated, IN THE
      SAME RUN, that it still responds to a stimulus whose answer is known
      and stays silent on a stimulus known to be null.
      Both halves are required. An instrument stuck on "yes" passes every
      positive control ever written; one stuck on "no" -- which is exactly
      what MX-021 was -- passes every negative one.
      `guard()` RAISES rather than logging, and `stamp()` attaches the
      control evidence to the artifact it licensed, so a result cannot be
      separated from the proof that its apparatus was working when it was
      taken.
      Registered so far: quality_ratchet (positive: an injected 0.80 fall
      must report REGRESSION; negative: an identical pair must report
      HOLDS), detection_floor (positive: dropout@gps, which the FROZEN
      policy carries an explicit rule for; negative: a bias_drift of rate
      ZERO, which perturbs nothing by arithmetic), and
      low_trust_false_alarm (positive: a severe baro drift must read below
      the rule's threshold; negative: an untouched baro must read above 0.9
      while other sensors fail).
    the_controls_are_themselves_proven_able_to_fail: >-
      A control that cannot fail is the very disease this module treats, one
      level up. tests/test_instrument_controls.py REINTRODUCES all three
      real defects -- the swallowed AttributeError verbatim, the whole-run
      minimum returning 0.8182, and a check() stuck on HOLDS -- and asserts
      the control pair REFUSES in each case. It also covers the opposite
      failures: an instrument stuck on "detected", a measurement stuck on
      "healthy", a gate stuck on "REGRESSION". 14 tests.
      A green control run means something only because a broken instrument
      has been shown to make it red.
    circularity_is_guarded: >-
      A control whose expected answer comes from the instrument under test
      proves only self-consistency, which is what MX-020 had. Every Control
      therefore carries a `basis` naming where its answer comes from -- the
      frozen policy's own rules, or arithmetic, or a DIFFERENT instrument --
      and a test asserts none is missing or trivial.
    honest_limit: >-
      A CONTROL PAIR IS A LIVENESS AND DISCRIMINATION CHECK, NOT A
      CALIBRATION. It shows the instrument still responds to a known
      stimulus and stays silent on a null one; it says nothing about whether
      the measurements BETWEEN those two poles are correct. Each pair states
      this in `does_not_establish` and a test asserts it does.
      Coverage is also partial: three instruments are registered, chosen
      because each has a RECORDED fabrication. campaign.py,
      attribute_replay_divergence.py, mutation_probe.py and the tools under
      tools/assurance/ are NOT yet registered, and until they are, the rule
      is enforced where it was learned rather than everywhere.
    artifact: >-
      tools/assurance/instrument_controls.py;
      tests/test_instrument_controls.py; csia_stress/detection_floor.py;
      csia_stress/low_trust_false_alarm.py; tools/xr/quality_ratchet.py

  - id: MX-026
    date: 2026-09-08
    phase: ASSURANCE (the apparatus itself)
    kind: RULE_EXTENDED_TO_FULL_COVERAGE
    what_happened: >-
      MX-025 established the control-pair rule and applied it to the three
      instruments with a RECORDED fabrication. That left six other
      artifact-writing instruments unguarded, which made the rule a habit
      rather than a rule -- and the three that failed were not special, they
      were simply the ones somebody happened to look at.
    consequence: >-
      All NINE artifact-writing instruments now carry a registered control
      pair, call guard() before writing, and stamp the control evidence into
      the artifact they emit:
      quality_ratchet (injected fall -> REGRESSION / identical -> HOLDS);
      mutation_probe (mutating a comparison must CHANGE the source / a
      source with no operators has ZERO sites -- catching a mutation engine
      that silently returns the original, which would make every mutant
      equivalent and report a catastrophic score that is pure artefact);
      stress_regression (injected difference -> CHANGED / identical ->
      UNCHANGED); preflight (unknown platform -> FAIL / real platform ->
      PASS, using the platform check so a dirty tree cannot make the control
      ambiguous); decision_replay (_rel exceeds tolerance on a real
      difference / is exactly zero on identical values);
      attribute_replay_divergence (_live distinguishes differing gate sets /
      does not distinguish identical ones -- the comparison the whole HF-014
      attribution rests on); plus the three from MX-025.
      Two new tests enforce it: every instrument in the declared set must be
      registered, and every one must call guard() and stamp() in its source.
    a_control_i_had_to_strengthen: >-
      The test asserting no control is justified by the instrument it checks
      also requires the `basis` to be a real justification rather than a
      phrase. It rejected my own "a set equals itself" as too thin. I
      strengthened the basis rather than lowering the bar -- the point of
      that test is to stop a control being licensed by an assertion nobody
      would accept from anyone else.
    honest_limit: >-
      A CONTROL PAIR IS STILL A LIVENESS AND DISCRIMINATION CHECK, NOT A
      CALIBRATION, for all nine. It shows an instrument responds at the two
      poles and says nothing about the measurements between them.
      Several pairs also check a CORE FUNCTION rather than the whole
      pipeline -- decision_replay's pair exercises `_rel`, and
      attribute_replay_divergence's exercises `_live`. Those are the
      comparisons their verdicts rest on, but a defect elsewhere in either
      pipeline would pass. Full-pipeline controls for both need a fixture
      log, which is the next increment.
    artifact: >-
      tools/assurance/instrument_controls.py; tests/test_instrument_controls.py;
      tools/xr/mutation_probe.py; tools/xr/stress_regression.py;
      tools/deploy/preflight.py; tools/assurance/decision_replay.py;
      tools/assurance/attribute_replay_divergence.py; csia_stress/campaign.py

  - id: MX-027
    date: 2026-09-08
    phase: DOCUMENTATION (onboarding)
    kind: CONTEXT_CONSOLIDATED
    what_happened: >-
      System context was spread across 390 markdown files, 66 ledger entries
      and the source. An agent or engineer arriving cold had no single
      document giving the mathematics, the layer stack, the cyber posture,
      the simulation apparatus, the measured numbers and the open problems.
    consequence: >-
      docs/CSIA_SYSTEM_REPORT.md. Twelve sections: what CSIA is; the
      mathematics (Beta-conjugate trust with adaptive forgetting, the four
      evidence channels, the eleven physical edges, diagnosis priors, the
      six failsafe thresholds, the escalation-delay model); the layer stack
      and the six FROZEN_PATHS; the layers above the core; cyber and safety
      posture; the simulation apparatus; everything actually measured; the
      open problems; the assurance apparatus and why it is the real story;
      where we are; where it goes next including the theoretical direction;
      how to work in the repository; and section 12, what the system is NOT.
    section_12_is_the_load_bearing_one: >-
      It states plainly that novelty is NOT shown because the prior-art
      search has never run; that this is not a certified safety artifact;
      that every number is simulated on two flight profiles, one simulator,
      one host; that decision replay is DIVERGENT so results are one-shot;
      and that latency figures are desktop Python, not embedded timing.
      A context document that omitted those would make every number in it
      more dangerous than useful.
    artifact: docs/CSIA_SYSTEM_REPORT.md

  - id: SR-009
    date: 2026-09-09
    phase: SUPERVISION (false alarm found by construction)
    kind: SHIPPED_RULE_HAD_A_DEMONSTRATED_FALSE_ALARM
    what_happened: >-
      THE FALSIFICATION SEARCH FOUND A REAL FALSE ALARM IN THE motor_esc
      LOW-TRUST RULE, ON ITS FIRST COMBINATION, IN CODE COMMITTED THE SAME
      DAY. With battery DROPPED and imu0, imu1 and vibration all DEGRADED
      BUT STILL DELIVERING, a perfectly healthy motor_esc was dragged to
      trust 0.65 and the rule raised CAUTION at t=27.8 s.
      The SR-008 corroboration guard did not stop it. That guard counted
      LIVE edge partners: three were live, comfortably past
      MIN_CORROBORATORS = 2, so the judgement was allowed -- and those same
      three degraded partners were what dragged motor_esc down.
      LIVENESS WAS THE WRONG TEST. The guard's own docstring stated the
      principle it failed to implement: a trust value is only evidence of
      degradation when something was IN A POSITION TO DISAGREE with it. A
      partner that is itself failing is not in such a position, because its
      disagreement is equally explained by its own fault.
    found_by: >-
      csia_stress/falsify.py, on combination 1 of 95 -- the most adversarial
      one, which is where the most-adversarial-first ordering puts it.
      140 RANDOMISED CAMPAIGN RUNS HAD REPORTED ZERO FALSE ALARMS FOR THIS
      EXACT CLAIM. Enumeration found it immediately. This is the second time
      in two days that construction found what sampling could not, and it
      is the whole justification for the instrument.
    verdict: STRUCTURAL_FIX_MADE_VERIFICATION_IN_FLIGHT
    consequence: >-
      A corroborator must now be live AND IN GOOD STANDING: above the
      threshold the system ALREADY applies to it. GOVERNING_THRESHOLD maps
      each sensor to that number -- att_caution for the IMUs,
      struct_critical for vibration, power_critical for battery,
      nav_caution for gps -- and the two sensors the frozen policy judges
      nowhere use this overlay's own borrowed thresholds. NO NEW NUMBER IS
      INTRODUCED ANYWHERE, and the threshold that was already chosen was
      NOT moved.
    the_commitment_made_before_the_fix: >-
      ONE structural fix, verified by the full 103-combination search. If a
      counterexample survives it, the motor_esc rule is WITHDRAWN, not
      adjusted again. Iterating fix-then-search until the search comes back
      clean is tuning by another name, and it is the failure mode this
      programme exists to avoid. Stated before the fix was written so it
      could not be revised after seeing the result.
    artifact: >-
      csia_supervision/lowtrust.py; csia_stress/falsify.py;
      research/stress/results/FALSIFICATION_BEFORE_STANDING_GUARD.json;
      tests/test_lowtrust_supervision.py

  - id: MX-028
    date: 2026-09-09
    phase: ENVIRONMENT (a blocker that was not one)
    kind: UNVERIFIED_CLAIM_CORRECTED
    what_happened: >-
      I REPEATEDLY REPORTED ArduPilot SITL AS BLOCKED IN THIS ENVIRONMENT,
      INCLUDING IN THE SYSTEM REPORT AND THE UNBLOCKING GUIDE, ON EVIDENCE
      THAT DID NOT SUPPORT IT. What was actually tested was
      firmware.ardupilot.org, the BINARY firmware server, which returns 403
      through the proxy. The SOURCE path was never tested.
      When the user challenged the claim, the checks took under a minute:
      `git ls-remote https://github.com/ArduPilot/ardupilot.git` succeeds;
      gcc 13.3, g++, make and cmake are present; passwordless sudo works;
      apt-get resolves against archive.ubuntu.com; 19 GB of disk is free;
      pymavlink, empy, future and pexpect install cleanly.
    verdict: CLAIM_WAS_WRONG
    consequence: >-
      SITL is very likely buildable here, which makes it the highest-value
      open item rather than a blocked one -- one SITL run is what closes
      HF-014 and turns decision replay from DIVERGENT into a verification
      instrument. docs/CSIA_SYSTEM_REPORT.md and
      docs/UNBLOCKING_THE_BLOCKED_WORK.md both assert the blocker and both
      require correction.
    the_general_lesson: >-
      A NEGATIVE CAPABILITY CLAIM NEEDS A TEST, EXACTLY LIKE A POSITIVE ONE.
      "Blocked" was an inference from one adjacent 403, and it was repeated
      often enough to become a fact in the documentation. The same standard
      that applies to a measurement applies to a statement about what the
      environment can do: if it was not tested, it is not known.
    artifact: >-
      docs/CSIA_SYSTEM_REPORT.md; docs/UNBLOCKING_THE_BLOCKED_WORK.md

  - id: SR-010
    date: 2026-09-09
    phase: SUPERVISION (rule withdrawn)
    kind: RULE_WITHDRAWN_AFTER_VERIFICATION_FAILED
    what_happened: >-
      THE STRUCTURAL FIX IN SR-009 DID NOT HOLD, AND THE motor_esc LOW-TRUST
      RULE IS WITHDRAWN. Per the commitment made BEFORE the fix was written:
      one structural fix, verified by the full search, and if a
      counterexample survives the rule is withdrawn rather than adjusted a
      second time.
      The fix worked exactly as designed and was still not enough. At the
      firing moment, measured directly: battery was rejected (dropped),
      vibration was rejected (trust 0.300 against struct_critical 0.60), and
      imu0 (0.918) and imu1 (0.939) both passed their att_caution 0.82
      standing -- supplying the two corroborators MIN_CORROBORATORS
      requires. The judgement proceeded, and motor_esc, entirely healthy,
      sat at 0.667 because the REJECTED vibration partner was dragging it
      there through the trust graph.
    the_architectural_finding: >-
      THE GUARD GATES WHETHER TO JUDGE; IT DOES NOT CLEAN THE VALUE BEING
      JUDGED. Rejecting a partner as unfit to corroborate does not remove
      that partner's influence on the sensor's trust. So a sensor can be
      judged on a trust value contaminated by exactly the partners just
      deemed unfit to judge it -- which is incoherent, and no amount of
      guarding at the decision point can repair it.
      WHY baro SURVIVES THE SAME SEARCH: it has ONE edge partner. Either gps
      corroborates or it does not; there is no middle state where a partner
      is rejected while its contamination remains. A rule of this shape is
      sound on a sparsely-connected sensor and unsound on a
      well-connected one, and the four-partner topology is what makes the
      difference. The thin 0.098 margin recorded in SR-008 was the symptom
      of exactly this and was read at the time as merely "thin".
    verdict: WITHDRAWN
    consequence: >-
      RULES contains `baro` alone. `motor_esc` moves to CANDIDATES carrying
      the measured numbers and the reason, so the gap is a STATED LIMIT
      rather than a silent absence. The SR-009 good-standing guard is KEPT:
      it is correct and necessary, it demonstrably rejects unfit partners,
      and a test now covers a live-but-suspect partner directly. It is
      simply not sufficient on a well-connected sensor.
      Reinstating motor_esc requires a trust value computed WITHOUT the
      rejected partners -- a frozen-core change, which is not made here.
    what_this_costs: >-
      motor_esc degradation is again unsupervised. power_sag@motor_esc is
      undetected below 2200 rpm lost against a campaign maximum of 700, and
      that is now a published limit rather than a covered case. A stated
      gap is worth more than a rule that raises CAUTION on healthy hardware.
    artifact: >-
      csia_supervision/lowtrust.py; tests/test_lowtrust_supervision.py;
      research/stress/results/FALSIFICATION_BEFORE_STANDING_GUARD.json

  - id: HF-015
    date: 2026-09-09
    phase: ASSURANCE (decision replay, on a live SITL log)
    kind: DIVERGENCE_GONE_ON_A_PROPERLY_INSTRUMENTED_LOG
    what_happened: >-
      ARDUPILOT SITL WAS BUILT AND RUN, CSIA WAS DRIVEN AGAINST IT LIVE, AND
      DECISION REPLAY ON THE RESULTING LOG REPORTS SEMANTICALLY_EQUIVALENT
      WITH **ZERO** CATEGORICAL DIVERGENCES.
      Measured: 2251 ticks, 61226 messages, 2 stale ticks, 0 watchdog trips.
      Replay compared 1962 decisions: 1342 BIT_IDENTICAL, 620 semantically
      equivalent only, 0 divergent, worst relative difference 0.0152.
      The previous verdict was DIVERGENT on both platforms -- 511 ArduPilot
      categorical differences, cut to 13 by HF-010, and 144 on PX4.
    the_two_hf_014_instruments_did_their_job: >-
      The log carries what no committed log carried. (1) The header records
      the staleness configuration the run used, and it is BYTE-IDENTICAL to
      what a replay derives -- so configuration drift is now ruled out by
      direct measurement rather than by the inference in HF-014. (2) The
      per-sensor `fresh` map is on 2248 of 2251 ticks, and comparing the
      replay's reconstructed freshness against the recorded map gives 1967
      agreements and **0 disagreements**, across every sensor.
      HF-014 localised the PX4 divergence to freshness and could go no
      further because that map was never written down. On a log where it IS
      written down, the freshness reconstruction is exact.
    verdict: MAJOR_PROGRESS_HF_004_NOT_CLOSED
    what_this_does_not_establish: >-
      HF-004 IS NOT CLOSED AND MUST NOT BE MARKED SO.
      (1) THIS IS ARDUPILOT. The 144 divergences HF-014 attributed were
      PX4's, and PX4 SITL was not built here. The PX4 case is untested.
      (2) This is a NEW log from current code, not the committed 2026-08-25
      logs. Those remain DIVERGENT and always will -- they cannot be
      retro-instrumented.
      (3) The verdict is SEMANTICALLY_EQUIVALENT, not BIT_IDENTICAL or
      NUMERICALLY_EQUIVALENT: continuous trust values still differ, worst
      relative difference 0.0152 against a 1e-12 tolerance. Categorical
      decisions agree; the numbers behind them do not.
      (4) 289 replayed states matched no recorded tick within half a tick
      and were counted, not dropped.
    the_integration_finding_that_cost_the_most: >-
      ARDUPILOT STREAMS TELEMETRY TO A LINK ONLY AFTER IT HAS SEEN A GCS
      HEARTBEAT ON THAT LINK. CSIA is read-only by construction and can
      never send one, so a link where CSIA is the only endpoint carries
      heartbeats and almost nothing else -- measured: 25 messages in 20 s,
      of which 21 were heartbeats. With a forwarder in front (a GCS on the
      primary link copying packets to CSIA's port) the same 20 s carried
      13556 messages with full RAW_IMU, ATTITUDE, GLOBAL_POSITION_INT and
      SYS_STATUS.
      A FORWARDER IS THEREFORE MANDATORY, NOT A CONVENIENCE, and the
      runbook's `sim_vehicle.py --out=` topology is load-bearing for a
      reason it did not previously state. Setting SR1_* stream rates as
      parameters -- over MAVLink or as SITL startup defaults -- did NOT
      substitute for it.
    also_measured: >-
      Runbook Stage 1 predictions held: trust rose off the 0.8 prior to
      1.000 on every fresh node, level stayed NORMAL for all 2251 ticks, and
      no failsafe action occurred. motor_esc held at exactly the 0.8 prior
      because SITL sends no ESC telemetry and the node was never fresh --
      the documented "no data, no evidence, trust holds at the prior"
      behaviour, observed live.
      Preflight reported DO_NOT_FLY on a dirty working tree, which is the
      correct verdict and is recorded rather than bypassed.
    artifact: >-
      research/physical_validation/results/sitl_2026_09_09/;
      full flight log at /home/user/sitl-run/logs (14.8 MB, outside the repo)

  - id: HF-016
    date: 2026-09-09
    phase: ASSURANCE (PX4 SITL, HF-014 root cause)
    kind: ROOT_CAUSE_PARTIALLY_FOUND_AND_PARTIALLY_FIXED
    what_happened: >-
      PX4 SITL WAS RUN AND HF-014's SIGNATURE REPRODUCED WITH BOTH SIDES
      RECORDED FOR THE FIRST TIME. CSIA flew against PX4 SITL (SIH airframe
      10040, sihsim_quadx) for 2251 ticks / 38543 messages. Replay-vs-recorded
      freshness gave 133 disagreements, DOMINATED BY BARO (126) -- the same
      shape HF-014 measured, where 122 of 144 divergences were `altitude_baro`.
      Decision replay: DIVERGENT, 127 of 1980 compared.
      Contrast with ArduPilot on the same day: 0 divergent.
    the_bug_that_was_found_and_fixed: >-
      The hand-off reconstructor derives arrival time as `t_mono - age_s` and
      compared arrivals by ROUNDING both to a 1 ms grid. That derivation
      carries sub-millisecond jitter: measured on this log, `baro.altitude`
      gave 1094 samples with only 381 distinct arrival times, 683 consecutive
      deltas below 20 ms, median 1 us and MAX 126 us. Rounding is
      boundary-sensitive -- two values 126 us apart land on different integers
      whenever they straddle a boundary -- so a spurious hand-off is emitted
      for an arrival that never happened, perturbing when freshness is
      evaluated.
      Replaced with a tolerance comparison at the SAME magnitude the grid
      used: nothing about the scale changed, only the operation, from one
      that can flip on a 1 us difference to one that cannot.
    measured_effect: >-
      Reconstructed hand-offs moved toward the counts the log implies:
      baro 93 -> 89 (implied 88), mag 1274 -> 1268 (implied 1266), gps
      721 -> 711 (implied 709). PX4 replay divergences 127 -> 119.
      ArduPilot unchanged at 0 divergent, 1342/1962 bit-identical -- no
      regression.
    what_is_still_open: >-
      119 PX4 DIVERGENCES REMAIN AND THIS DOES NOT CLOSE HF-004.
      The residual signature is now PERFECTLY SYMMETRIC: 59 ticks where the
      replay has `altitude_baro` live and the recording does not, and 59
      where the recording has it and the replay does not, plus 1 other. That
      symmetry is the signature of a PHASE OFFSET of about one tick at baro's
      staleness boundary, not a semantic disagreement -- around each of the
      ~89 baro arrival cycles the replay's freshness edge lands a fraction of
      a tick away from the live run's, producing one leading and one lagging
      tick.
      The likely mechanism, NOT yet demonstrated: the replay drives the layer
      only at hand-off times, so its internal tick boundaries fall differently
      from the live run's 25 Hz wall-clock ticks. Testing that needs the tick
      boundaries themselves recorded, which no log carries.
    a_correction_i_made_mid_analysis: >-
      I first reported that the reconstructor over-produces imu0 hand-offs
      (2250 emitted against 1196 "implied"). That was wrong: the implied
      count came from a heuristic counting drops in `age_s`, which
      systematically undercounts a channel arriving every tick. imu0's
      derived arrival genuinely advances every tick -- 2250 distinct values,
      2246 consecutive deltas above 20 ms. The flawed measurement was mine,
      not the reconstructor's, and the real defect was baro's jitter.
    the_px4_integration_finding: >-
      CSIA MUST ATTACH TO PX4's ONBOARD MAVLINK INSTANCE, NOT ITS GCS ONE.
      On the GCS link (udp 14550) PX4 streams 7354 messages in 20 s and CSIA
      produced NO trust values at all -- the Normal stream set carries
      ATTITUDE, GLOBAL_POSITION_INT and SERVO_OUTPUT_RAW but no HIGHRES_IMU,
      no SCALED_PRESSURE, no SYS_STATUS, so every channel read UNAVAILABLE.
      On the Onboard link (udp 14540) HIGHRES_IMU arrives at 49 Hz and CSIA
      produced trust on 2250 of 2251 ticks.
      NOTE THE CONTRAST WITH ARDUPILOT (HF-015): ArduPilot streams nothing
      until it sees a GCS heartbeat on the link, so CSIA needs a forwarder;
      PX4 streams to its configured remote unconditionally, so CSIA can
      attach directly -- to the right instance. Two platforms, two different
      integration constraints, both now measured rather than assumed.
    artifact: >-
      tools/deploy/profile_core_from_log.py;
      tests/test_handoff_arrival_stability.py;
      research/physical_validation/results/sitl_2026_09_09/

  - id: HF-017
    date: 2026-09-09
    phase: ASSURANCE (PX4 SITL, HF-016 residual)
    kind: MY_INSTRUMENT_WAS_WRONG_NOT_THE_SYSTEM
    what_happened: >-
      THE 119 RESIDUAL PX4 DIVERGENCES WERE AN ARTIFACT OF MY OWN COMPARISON,
      NOT A PROPERTY OF THE REPLAY. HF-016 read the perfectly symmetric
      signature (59 leading, 59 lagging at baro's staleness boundary)
      correctly as a phase offset, and then assumed the offset was inherent
      to driving the layer from reconstructed hand-offs. It was not. It was
      in the pairing.
      The replayed states carry the layer's own tick clock -- exact multiples
      of dt_tick anchored at 0.0. The recorded rows were stamped with wall
      time and then shifted by the first row's t_mono. On the log that
      produced the 119, that first row sits at t = 0.023607 s, which is 0.59
      of a tick, so every pairing after it was off by MORE than half a tick.
      At a staleness boundary that flips a freshness bit once on the rising
      edge and once on the falling edge -- symmetric by construction, which
      is exactly the signature that was observed.
    the_falsification_test_and_its_result: >-
      PREREGISTERED in research/FUTURE_DIRECTIONS_2026_09.md section 1,
      written before the test ran: "If the residual persists with the tick
      grid aligned, the phase-offset hypothesis is wrong and the cause is
      elsewhere."
      The residual did not persist. ONE log, ONE reconstruction, ONE
      comparator, two alignments:
        wall-clock join  119 divergent, 439 bit-identical, worst 1.8e-2,
                         verdict DIVERGENT
        tick-index join    0 divergent, 2250 of 2250 BIT-IDENTICAL, worst 0.0
      ArduPilot is unchanged at 0 divergent under both alignments, so this is
      not a change that buys agreement by loosening a comparison -- the
      tick-index join is STRICTER (it is an exact integer equality, and it
      left 1 state unmatched against the wall join's 271).
    a_second_and_worse_defect_found_on_the_way: >-
      THE LONG-STANDING "144 DIVERGENT" FIGURE WAS NEVER A MEASUREMENT.
      It came from logs/shadow-sitl-px4/20260825T005931Z-1b4add14, whose
      header carries `stale_timeout_s: None`. The replay applied timeouts
      derived from the platform TODAY to a run whose timeouts were never
      recorded, and reported the difference as a decision divergence. That is
      a finding manufactured out of a gap in the log -- the same defect as
      MX-021, where a swallowed AttributeError became "undetected at every
      magnitude". Alignment does not explain that log (its t0 is 0.000097 s,
      so both joins agree); the missing configuration does.
      `replay` now returns NOT_COMPARABLE with reason
      NO_STALENESS_CONFIG_IN_LOG, and emits NO divergence count at all, so
      there is no number for a reader to quote. NOT_COMPARABLE IS NEVER PASS.
    a_third_defect_found_on_the_way: >-
      The default log paths were two hardcoded 2026-08-25 files. `logs/` is
      gitignored in its entirety, so those paths are not in the repository
      and resolve to LOG_ABSENT on any checkout but the one machine that
      produced them -- and neither log was replayable there either. The
      default now selects the newest log per platform that actually carries
      the staleness config, and every run records the flight_id and
      csia_commit of the log it read, because a path is not an identifier
      when the directory is untracked.
    what_i_got_wrong_mid_analysis: >-
      I checked t0 on the WRONG LOG first. The freshly recorded run has
      t0 = 0.000078 s, essentially zero, so I concluded the shift hypothesis
      was wrong and went looking elsewhere. The log that actually diverges
      has t0 = 0.023607 s. The hypothesis was right and my test of it was
      aimed at a log that could not have shown it.
    what_is_still_open: >-
      THIS DOES NOT CLOSE HF-004. Two SITL runs on two platforms now replay
      without a categorical divergence; that is not a general property of the
      instrument.
      A REAL RESIDUAL REMAINS AND HAS NOT BEEN TUNED AWAY: on the freshly
      recorded PX4 run the replay is NOT bit-identical. A difference appears
      at tick 52 at 1.7e-14 and accumulates through the alpha/beta recursion
      to 6.7e-10 by tick 2250. That is six orders below any decision
      threshold and three orders ABOVE the declared 1e-12 portability
      tolerance, so the verdict is SEMANTICALLY_EQUIVALENT rather than
      NUMERICALLY_EQUIVALENT. The tolerance has NOT been changed to
      accommodate it. A 1e-12 relative tolerance may simply be the wrong
      number for a filter that carries state for 2250 steps at rho = 0.998,
      but changing it because a result would look better is exactly the move
      this ledger exists to prevent.
      The tick_tau field is, on these runs, derivable as
      floor(t_mono/dt_tick)*dt_tick -- checked at 2242 agreements and 0
      disagreements. It is not redundant in general (the layer's last fired
      tick can lag t_mono when the final channel arrival crosses a boundary),
      but on this evidence it did not.
    artifact: >-
      tools/assurance/decision_replay.py;
      csia/deploy/flight_log.py; csia/deploy/shadow.py;
      tests/test_replay_alignment.py;
      research/physical_validation/results/sitl_2026_09_09/DECISION_REPLAY_ALIGNMENT.json

  - id: SR-011
    date: 2026-09-09
    phase: SUPERVISION (contamination-aware trust, SR-010 follow-up)
    kind: PROPOSAL_MEASURED_AND_REJECTED_ON_ITS_OWN_KILL_CONDITION
    what_was_proposed: >-
      SR-010 withdrew the motor_esc low-trust rule with the observation that
      "the guard gates WHETHER TO JUDGE, it does not clean THE VALUE BEING
      JUDGED". The proposed remedy, written up as FUTURE_DIRECTIONS section
      2, was to carry a decomposition of where a sensor's trust came from --
      the per-edge contribution to E_i -- so a judgement could rest on the
      trust attributable to partners in good standing.
      It was built, it was measured, and IT DOES NOT WORK. The rule stays
      withdrawn.
    what_was_built_and_verified: >-
      csia_supervision/contamination.py reconstructs the per-edge terms the
      frozen core computes and discards, and ShadowTrust re-runs the Beta
      recursion on a restricted partner set. Both are exact:
        per-edge decomposition vs the core's own published c_nbr --
          12000 comparisons over three profiles, 0 disagreements,
          worst absolute difference 3.3e-16;
        unrestricted shadow vs state.trust -- max drift 0.0 over 4500 ticks;
        shadow routed through the reconstruction -- 1 ulp, and it does NOT
          accumulate: still 1 ulp 2250 ticks later.
      Anti-vacuity both ways: weighting edges by THIS tick's trust instead of
      the previous tick's produces disagreements, and restricting to no
      partner moves trust by 0.185.
    a_correction_to_sr_010: >-
      SR-010 said reinstating the rule "needs a trust value computed WITHOUT
      the rejected partners, which is a FROZEN-CORE CHANGE". THAT WAS WRONG.
      Every term the recursion needs is already published in TrustState, so
      it reproduces exactly outside the core. No frozen file was touched.
    the_measurement: >-
      Threshold selected by the procedure DECLARED BEFORE any adversarial
      combination ran: clean-flight minimum restricted trust 0.9665 over the
      ARMED window on both flight profiles, ceiling 0.9165 after the 0.05
      margin, and the largest existing FailsafeConfig constant below it is
      att_caution = 0.82. No float invented.
      All 95 enumerated combinations run, motor_esc itself UNFAULTED:
        core trust        27 false alarms of 95
        restricted trust  14 false alarms of 95
      KILL CONDITION K2 FIRES. A safety rule with 14 false alarms in 95
      adversarial combinations is not usable, and 14 is not 0.
    why_it_fails_which_is_the_useful_part: >-
      PARTNER-LEVEL STANDING AND EDGE-LEVEL AGREEMENT ARE DIFFERENT FACTS,
      AND THE RESTRICTION ONLY FILTERS ON THE FIRST.
      Traced on combination 0 at t = 40.0 s: motor_esc sits at 0.65000 with
      all three incident edges at consistency 0.0000, and the only ADMITTED
      partner is imu0 at trust 0.8528 against its own att_caution standing of
      0.82. imu0's bias drift breaks the accel/motor-current relation while
      imu0's own trust -- held up by its other edges and its physics checks
      -- stays above threshold. The contamination arrives through an admitted
      edge, so filtering partners by standing cannot remove it. Measured
      across the search: 78 of 95 runs had an ADMITTED partner carrying an
      edge at consistency below 0.01.
    the_second_failure_mode_which_is_worse: >-
      With no admissible partner the neighbour term drops out entirely and
      the sensor is scored on physics, temporal and statistical checks alone
      -- all of which read healthy. On combination 0 the restricted trust
      climbs from 0.65 to 0.987 from t = 49.6 s while the core stays pinned
      at 0.65. Across the search the maximum restricted trust at zero
      coverage is 0.9987. A sensor nothing is in a position to vouch for
      reports NEAR-PERFECT trust, which is the exact state the corroboration
      guard exists to refuse to judge in.
    the_apparent_improvement_is_partly_blindness: >-
      27 to 14 looks like a halving and must not be quoted as one. The
      restriction silenced 13 runs the core would have flagged, and 5 of
      those 13 had zero-coverage ticks -- silence bought by the evidence
      going ABSENT rather than getting cleaner. Counting those as false
      alarms avoided would be counting blindness as accuracy. The artifact
      carries all 95 rows so this can be checked rather than taken on trust.
    what_is_kept_anyway: >-
      The decomposition itself, because it answers a question the system
      could not answer before: WHICH evidence is holding a capability up.
      `evidence_support` traces an evidence id through the sensor that reads
      it to the edges corroborating that sensor. Measured on a clean hover,
      baro.altitude.supported rests 83% on the baro-gps edge and 17% on the
      baro-battery thermal edge. It is DESCRIPTIVE: it promotes nothing,
      demotes nothing, and UNKNOWN is still never resolved.
      "Weak leg" is reported as TWO fields because it is two questions --
      smallest share and lowest consistency. A well-corroborated partner in
      flat disagreement carries a LARGE share, so one combined field would
      hide the case worth seeing.
    artifact: >-
      csia_supervision/contamination.py;
      csia_stress/contamination_probe.py;
      tests/test_contamination.py;
      research/physical_validation/results/contamination/CONTAMINATION_PROBE.json

  - id: HF-018
    date: 2026-09-09
    phase: ASSURANCE (HF-004 closure)
    kind: FINDING_CLOSED_BY_HUMAN_DECISION_ON_STATED_EVIDENCE
    closes: HF-004
    decided_by: >-
      THE PROGRAM OWNER, EXPLICITLY, in the instruction "close HF-004 with
      these two SITL runs". Recorded because no stage promotes itself: the
      measurement below does not close a finding on its own, a person does,
      and a reader is entitled to know which.
      I had stated in the preceding turn that two runs are not a general
      property and that HF-004 should stay open. That objection was heard
      and overruled. It is preserved here rather than removed.
    what_hf_004_claimed: >-
      "Decision-level replay from a flight log is not faithful enough to
      serve as a verification instrument, on either platform." Measured
      then: ArduPilot 511 of 750 compared ticks differed CATEGORICALLY,
      PX4 144 of 750.
    the_evidence_it_is_closed_on: >-
      Two SITL flights recorded 2026-09-09, one per platform, each carrying
      the run's own staleness configuration and the layer's own tick
      boundary:
        ardupilot  20260909T132406Z-a8bb841c
                   2248 compared, 3 unmatched, 0 DIVERGENT
                   22 bit-identical, 2226 semantically equivalent
                   worst relative difference 1.80e-05
        px4        20260909T131511Z-687f2511
                   2242 compared, 9 unmatched, 0 DIVERGENT
                   51 bit-identical, 980 numerically equivalent,
                   1211 semantically equivalent
                   worst relative difference 6.74e-10
      Plus the controlled comparison in HF-017: on the PX4 log that produced
      the 119 residual divergences, the tick-index join gives 2250 of 2250
      BIT-IDENTICAL and 0 divergent.
      THE CATEGORICAL CLAIM HF-004 MAKES IS THEREFORE NOT REPRODUCIBLE ON
      EITHER PLATFORM ON THESE RUNS.
    the_question_the_pinning_test_asked_and_its_honest_answer: >-
      `test_decision_replay_is_still_divergent_and_still_not_counted_as_pass`
      was written to say: if this ever turns non-DIVERGENT, check whether the
      reconstruction was genuinely fixed or whether a comparison was widened
      until it agreed. Only the first is a result.
      IT WAS NOT WIDENED. The tolerance is unchanged at 1e-12 -- and the PX4
      worst difference of 6.74e-10 sits ABOVE it, which is why the verdict is
      SEMANTICALLY_EQUIVALENT and not NUMERICALLY_EQUIVALENT. The alignment
      was made STRICTER: an exact integer equality on the layer's tick index,
      replacing a nearest-within-half-tick match. On the same log the strict
      join left 1 state unmatched where the loose one left 271.
    what_hf_004_prescribed_and_was_NOT_done: >-
      HF-004 said "THE FIX IS NOT A TOLERANCE. It is to LOG THE ACTUAL
      HAND-OFFS at run time instead of reconstructing them afterwards."
      THAT WAS NEVER DONE. `csia/deploy/shadow.py` computes `core_samples`,
      feeds them to the layer, and does not write them to the log. The
      replay still RECONSTRUCTS hand-offs from `t_mono - age_s`.
      So the agreement was reached by a different route than the one HF-004
      specified: a corrected arrival comparison (HF-016), a corrected tick
      alignment (HF-017), and two new log fields (`fresh`, `tick_tau`). The
      route matters, because "the reconstruction agrees on two runs" is a
      weaker statement than "the hand-offs are recorded and cannot disagree".
      A task list in an earlier session marked "record real hand-offs in
      shadow.py" as COMPLETED. It is not. That claim is withdrawn here.
    what_this_closure_does_NOT_do: >-
      IT DOES NOT PROMOTE ANY GATE. HF-004's consequence line said the
      software-hardening gate may not count decision replay as PASS. Closing
      the finding does not flip that gate; changing a gate is a separate,
      explicit decision and none is taken here.
      IT DOES NOT MAKE REPLAY A CERTIFIED VERIFICATION INSTRUMENT.
      IT DOES NOT COVER: hardware runs, other flight profiles, injected
      faults, other durations, or any platform but these two. The evidence
      is two 90-second clean SITL flights.
    what_remains_open_and_is_recorded_as_open: >-
      THE NUMERIC RESIDUAL, and it is LARGER ON ARDUPILOT than on PX4:
      1.80e-05 against 6.74e-10, both above the declared 1e-12 tolerance.
      ArduPilot manages only 22 bit-identical decisions out of 2248 and zero
      within tolerance. So the replay reproduces DECISIONS on both platforms
      and reproduces VALUES on neither. A 1e-12 relative tolerance may be
      the wrong number for a filter carrying state across 2250 steps at
      rho = 0.998 -- but it has NOT been changed, and it will not be changed
      to make this look better.
    artifact: >-
      research/physical_validation/results/DECISION_REPLAY_RESULTS.json;
      research/physical_validation/results/sitl_2026_09_09/DECISION_REPLAY_ALIGNMENT.json;
      tests/test_post_e1_hardening_round1_artifacts.py

  - id: MX-029
    date: 2026-09-09
    phase: RESEARCH (headroom before machinery)
    kind: SWEEP_FOUND_REAL_HEADROOM_IN_ONE_CONSISTENT_DIRECTION
    what_was_asked: >-
      Before proposing a learned component, measure whether a plain parameter
      sweep already closes the gap. Six numbers control retention and fusion:
      rho_max, rho_min, and the four evidence weights.
    nothing_was_changed: >-
      `OnlineTrustLayer` already accepts an `EngineConfig`. Every
      configuration was passed in at construction. No frozen file was touched
      and the shipped defaults are unchanged. THIS RECOMMENDS NOTHING --
      choosing a configuration is a decision and no stage promotes itself.
    the_metric_declared_before_the_run: >-
      Threshold-free, because the frozen failsafe thresholds are calibrated
      to the SHIPPED weights and judging different weights by them would
      confound the two:
        separation = clean_floor - fault_floor   (post-arm, per SR-007)
        headroom   = clean_floor
      BOTH REPORTED, NEVER COLLAPSED. A configuration can raise separation
      purely by dragging clean flight down, and one score would hide it.
    the_anti_vacuity_control_that_decided_the_answer: >-
      The simulator fixes its sensor seeds, so one configuration on one seed
      is one noise realisation. Every configuration was run over THREE
      independent seed sets, built by constructing the sensor objects with
      offset seeds -- `scenarios.py` is frozen and its `sample_streams` takes
      no seed, but the sensor classes do, and offset 0 reproduces
      `make_sensors` exactly (asserted by the negative control).
      The seed-to-seed spread at the shipped configuration turned out to be
      LARGE: 0.2338 on baro against a mean separation of 0.6417, i.e. 36 %.
      Any apparent gain below that is noise, and one was.
    the_result: >-
      MORE PHYSICS WEIGHT, LESS NEIGHBOUR WEIGHT, AND IT IS A PARETO
      IMPROVEMENT RATHER THAN A TRADE. w_phys = 0.40 (from 0.30) beat the
      shipped configuration on separation AND on headroom, on all three
      faults:
                        separation            headroom
                     shipped  w_phys=.40   shipped  w_phys=.40
        baro          0.6417    0.6538      0.7465    0.7825
        battery       0.2840    0.3859      0.9615    0.9668
        gps           0.2776    0.3724      0.7877    0.8007
      w_nbr = 0.25 points the same way and is nearly as good; the two are
      the same move, since raising one weight renormalises the others down.
      AGAINST SEED NOISE: battery's gain of 0.102 against a spread of 0.002
      is decisive; gps's 0.095 against 0.071 is marginal; baro's 0.012
      against 0.234 IS NOISE and is not claimed.
    what_did_not_work: >-
      rho_min = 0.85 raised baro and battery separation but LOWERED gps
      separation and lowered headroom on two of three. It is a trade, not a
      win, and its baro gain does not beat that channel's seed noise.
      Retention length is therefore NOT where the headroom is -- the fusion
      weights are.
    what_this_is_not: >-
      Three faults on one simulator, a coordinate sweep rather than an
      optimum, and no hardware. It is a reason to run the same sweep on real
      data before touching a shipped constant, not a reason to touch one.
    artifact: >-
      tools/research/config_sweep.py;
      research/predictor_study/CONFIG_SWEEP.json

  - id: MX-030
    date: 2026-09-09
    phase: RESEARCH (would a learned predictor help?)
    kind: STANDARD_ARGUMENT_FALSIFIED_SMALL_REAL_GAIN_FOUND
    what_was_asked: >-
      The temporal sub-score is a one-step Holt innovation. The standard
      argument for learning here is that a better nominal model produces
      whiter innovations on healthy data, so the same lam machinery detects
      smaller faults. Measured offline, on simulated flights, changing
      nothing in CSIA.
    the_standard_argument_is_FALSE_here: >-
      THE WHITEST PREDICTOR ON CLEAN DATA IS NOT THE BEST DETECTOR IN 10 OF
      11 CASES. Whiteness and detection come apart, and they come apart for
      a reason that is structural rather than incidental: a predictor good
      enough to whiten healthy data is often good enough to TRACK THE FAULT.
      A slow bias drift is, to a model with a trend term or enough memory,
      just a trend to be predicted. Measured in the instrument's own positive
      control: on a pure ramp, an AR fitted on first differences leaves an
      innovation of 2.1e-10 where persistence leaves 1e-2 -- a factor of
      5e7. Reporting innovation variance alone would have shown every
      candidate as an improvement.
    the_real_gain_and_its_size: >-
      Detection floors, d' >= 1.0 fixed for every predictor, over magnitude
      grids read out of the sensors that consume them. Six channels scored:
        baro.altitude   bias_drift   holt 1.0 -> AR(4) 0.5   (one grid step)
        battery.voltage power_sag    holt NEVER -> AR(4) 3.0
        imu0.accel      bias_drift   no change
        mag.field_ut    emi_spike    no change
        vibration.rms   vib_anomaly  no change
        motor_esc.rpm   power_sag    neither detects
      MEDIAN FLOOR RATIO 1.0. Four of six channels are unchanged.
      Both gains REPRODUCE on three independent noise draws (seeds 100, 300,
      500), identically.
      BOTH ARE ALSO AT THE GRID'S RESOLUTION. baro's 2x is exactly one step
      of a grid that steps by ~2x, so the true factor lies somewhere in
      (1, 4] and this grid cannot say where. battery's floor is the LARGEST
      value on its grid, so "AR(4) detects it" means "at the top of the grid
      and no lower"; the true floor may be above it.
    two_instrument_bugs_this_study_made_and_caught: >-
      FIRST, the fault window was compared against WHOLE-FLIGHT clean
      statistics, which confounds the fault with the flight phase --
      `fast_cruise` manoeuvres inside that window. Six of nine channels came
      back with NEGATIVE d', which is what sent me looking. Replaced with a
      paired comparison: same window, same profile, same seed, clean against
      faulted.
      SECOND, AND WORSE: three of seven magnitude grids named a parameter the
      sensor does not read -- `depth` for the battery, `amp` for the
      magnetometer, `rate` for the GPS. A sensor silently ignores an unknown
      parameter and applies its default, so the grid swept NOTHING while
      perturbing the channel identically at every magnitude, and the study
      reported "no detection floor" for a sweep that never varied the fault.
      That is the MX-021 shape exactly. Every parameter name is now cited to
      the line of the sensor that consumes it, and a `PARAMETER_INERT` guard
      RAISES when perturbation does not vary across a grid.
    a_structural_finding_worth_more_than_the_gain: >-
      FIVE OF ELEVEN WATCHED CHANNELS SHOW NO STIMULUS AT ANY MAGNITUDE.
      A GPS position spoof perturbs none of the four gps channels the
      temporal predictor watches, and a power sag leaves battery current
      untouched. For those channels no predictor of any kind could help, and
      a floor reported for them would be an instrument artifact. This is not
      a defect: HIST_CHANNELS deliberately leaves horizontal position to the
      physics check because it is trend-dominated under manoeuvring. It does
      mean the temporal sub-score is structurally blind to a spoof, and that
      the place to look for spoof sensitivity is the physics predictor.
    the_limitation_that_decides_what_this_is_worth: >-
      Every fault here is a parametric injection from six known kinds, so a
      predictor scored against them is scored against the INJECTOR. The
      repository already records fault classes the simulator cannot produce
      at all -- RF jamming as RF, urban multipath -- and notes that the
      nearest proxy omits the degraded-but-present regime a real fault
      produces first. Those are the regimes a better predictor would be
      claimed to help with, and there is no data for them.
      A median floor ratio of 1.0 on injected faults is not a case for
      shipping a learned predictor. It is a reason to collect real data.
    artifact: >-
      tools/research/predictor_study.py;
      research/predictor_study/PREDICTOR_STUDY.json

  - id: MX-031
    date: 2026-09-10
    phase: RESEARCH (the same bug, twice, in one day)
    kind: MY_INSTRUMENT_SWEPT_A_PARAMETER_THE_SENSOR_DOES_NOT_READ
    what_happened: >-
      `Fault` validates its KIND against KNOWN_KINDS and raises on a typo,
      deliberately, because "a typo'd kind would otherwise be silently
      ignored by every sensor". ITS PARAMETERS HAD NO SUCH CHECK. Each sensor
      reads what it knows with `params.get(name, default)` and silently
      substitutes its own default for anything else.
      So `Fault("power_sag", "battery", 20, 30, {"depth": 0.25})` is not an
      error, is not a warning, and is not a 0.25 V sag. It is the battery's
      default 1.0 V sag, applied identically at every value written.
      THE PREDICTOR STUDY (MX-030) DID THIS ON THREE OF SEVEN GRIDS --
      `depth`, `amp` and `rate` where the sensors read `depth_v`,
      `amplitude` and `drift`. THE CONFIG SWEEP (MX-029) REPEATED TWO OF
      THEM. Both produced smooth, plausible magnitude curves over a fault
      that never varied.
    why_being_careful_would_not_have_helped: >-
      The correct names were already written correctly in
      `csia_stress/falsify.py`, in a file read earlier in the same session.
      I wrote the new grids from memory instead of from the authority. That
      is not a lapse to resolve by resolving to be careful; it is a missing
      check.
    what_was_built: >-
      `csia_stress/fault_params.py`. The check is BEHAVIOURAL, not a table:
      it samples the sensor twice with two different values of each named
      parameter and reports which ones moved the output. A lookup table
      would be a second copy of the sensor models, free to drift from them;
      asking the model cannot drift.
      Two strengths, and the difference is not a loosening:
        assert_effective      every named parameter must bite. Correct
                              wherever a SPECIFIC parameter is the swept
                              axis, because one dead key is a sweep that
                              measures nothing.
        assert_any_effective  at least one must bite. Correct for a
                              per-KIND superset like falsify.WORST_PARAMS,
                              which necessarily carries keys some targets do
                              not read -- `power_sag` names both `depth_v`
                              (battery) and `rpm_loss` (motor), and each
                              ignores the other's.
      Both tools now validate AT IMPORT, so a mis-named sweep cannot start,
      let alone reach an artifact. The error names the parameters the sensor
      DOES read, so the next caller gets the correction rather than the
      complaint.
    the_correction_to_MX_029: >-
      MX-029's battery and gps faults ran at the SENSOR DEFAULTS, not the
      magnitudes that entry documented. The comparison between
      configurations was still a valid comparison -- every configuration saw
      the identical fault -- but the recorded magnitudes were wrong.
      RE-RUN WITH `depth_v: 1.3` AND `drift: (4,4,0)`. THE CONCLUSION
      SURVIVES:
                        separation            headroom
                     shipped  w_phys=.40   shipped  w_phys=.40
        baro          0.6417    0.6538      0.7465    0.7825
        battery       0.3178    0.4150      0.9615    0.9668
        gps           0.2778    0.3727      0.7877    0.8007
      Still Pareto-better on all three. Battery's gain of 0.097 against a
      seed spread of 0.0010 is decisive, gps's 0.095 against 0.0707 is
      marginal, and baro's 0.012 against 0.2338 remains NOISE and is still
      not claimed.
    what_was_NOT_affected: >-
      `falsify.WORST_PARAMS` was always correct, and MX-030's structural
      finding stands unchanged: a GPS position spoof perturbs none of the
      four gps channels the temporal predictor watches, which was measured
      with `drift` and not with the mis-named scalar.
    artifact: >-
      csia_stress/fault_params.py; tests/test_fault_params.py;
      tools/research/config_sweep.py; tools/research/predictor_study.py;
      research/predictor_study/CONFIG_SWEEP.json

  - id: MX-032
    date: 2026-09-10
    phase: RESEARCH (falsification under an alternative configuration)
    kind: SAFETY_CLAIM_RE_SEARCHED_AND_STILL_HOLDS
    what_was_asked: >-
      Apply w_phys = 0.40 and re-run the falsification search.
    what_apply_CANNOT_mean_here: >-
      `EngineConfig` lives in `csia/trust_engine/engine.py`, a FROZEN path,
      so the shipped default was NOT edited and is unchanged at 0.30. The
      configuration is passed to `OnlineTrustLayer` at construction, which
      is what it has always accepted. `csia_stress/falsify.py` (not frozen)
      now threads a config through `run`, `search` and `_fires`, defaulting
      to the shipped one so every earlier result is reproduced exactly.
    the_prerequisite_that_had_to_be_checked_first: >-
      The baro rule's threshold of 0.75 was selected by a declared procedure
      against the SHIPPED configuration's clean-flight minimum. Changing the
      weights moves the trust distribution and therefore moves what that
      threshold means, so the selection criterion was re-checked BEFORE the
      search rather than assumed:
        SHIPPED       clean baro min 0.9839, margin over threshold +0.2339
        w_phys=0.40   clean baro min 0.9856, margin over threshold +0.2356
      The margin WIDENS slightly. The threshold remains legitimately placed
      under the alternative configuration, so the search is meaningful.
    the_result: >-
      Both arms, 8 of 8 combinations enumerated and run, exhaustive:
        SHIPPED       NO_COUNTEREXAMPLE_IN_SEARCHED_SPACE, worst post-arm
                      baro trust 0.9930, 0 C3 violations
        w_phys=0.40   NO_COUNTEREXAMPLE_IN_SEARCHED_SPACE, worst post-arm
                      baro trust 0.9932, 0 C3 violations
      Against a threshold of 0.75. Faulting both of baro's edge partners at
      the top of their campaign ranges barely moves baro's trust at all,
      which is why the rule is safe and is the more useful fact than the
      verdict.
      THE TWO ARMS ARE NOT A BEFORE/AFTER OF ONE SYSTEM. The threshold was
      selected against the shipped configuration; the second arm answers
      "does the claim still hold there", not "which is better".
    two_things_fixed_in_the_search_while_here: >-
      FIRST, SR-007 AGAIN. `_fires` reported `worst_trust` over the WHOLE
      run, which is dominated by warm-up: every combination returned exactly
      0.8182, the 0.8 Beta prior after one step, faulted or not. SR-007 is
      the record of that same number being read as a fault response once
      already. It cannot affect a verdict -- `lowtrust.py:309` returns
      before `arm_time`, so no counterexample can live in the warm-up -- but
      it misled a reader, and it misled me for one turn of this session.
      Now reported as `worst_trust_post_arm` ALONGSIDE the whole-run figure
      rather than instead of it, because silently changing what an existing
      field means is its own defect. The corrected number is 0.9930, not
      0.8182.
      SECOND, the module docstring said the baro search enumerates 15
      combinations. It enumerates 8. Nothing depended on the number -- the
      search reads the applicability matrix and never read that sentence --
      but a reader checking "did it cover the whole space" against the prose
      would have concluded it covered about half.
    what_this_does_not_establish: >-
      NO_COUNTEREXAMPLE_IN_SEARCHED_SPACE is that sentence and nothing more,
      under either configuration. One rule, two edge partners, one flight
      profile, one simulator. AND NOTHING IS PROMOTED: the shipped weights
      are unchanged, no gate moved, and a sweep result plus a clean
      falsification search is not authority to change a frozen constant.
    artifact: >-
      csia_stress/falsify.py;
      research/predictor_study/FALSIFICATION_UNDER_W_PHYS_040.json

  - id: MX-033
    date: 2026-09-10
    phase: RESEARCH (the sweep, widened)
    kind: NARROW_RESULT_QUALIFIED_BY_WIDER_EVIDENCE_AND_A_PAIRING_DEFECT_FIXED
    what_was_run: >-
      The configuration sweep widened on every axis that was thin:
        faults      3 hand-picked -> 18, every live (kind, target) pair the
                                     applicability matrix admits, plus 10
                                     multi-fault and degraded-environment
                                     scenarios from the catalog
        seeds       3 -> 5 independent noise realisations
        profiles    faults on hover_circle -> faults on BOTH profiles
        configs     16 coordinate variants -> 6, BOTH DIRECTIONS of the two
                                     axes that mattered, because the config
                                     axis was already swept
      37 comparable cases after excluding 1 that saturated (mag dropout:
      identical fault floor under every configuration, so it discriminates
      nothing and is excluded rather than averaged in).
    a_defect_in_the_narrow_sweep_found_on_the_way: >-
      `config_sweep.py` computes the clean floor as a MINIMUM OVER BOTH
      FLIGHT PROFILES and subtracts a fault floor measured on hover_circle
      ALONE. The two sides of that subtraction come from different flights,
      so every separation it reported is understated whenever fast_cruise
      has the lower clean floor.
      Here every separation is PAIRED within one seed and one profile. The
      narrow tool is kept, not deleted -- MX-029 and MX-031 quote its
      numbers and an artifact whose generator is gone cannot be checked --
      but it is marked superseded in its own docstring.
    the_headline_from_MX_029_DOES_NOT_GENERALISE_AS_STATED: >-
      MX-029 and MX-031 recorded w_phys = 0.40 as "a Pareto improvement, not
      a trade", on three faults. On 37 cases it is not that.
        better on BOTH halves      26 of 37
        worse on at least one      11 of 37
        wins exceeding that case's own seed-and-profile spread   15
      The claim as written was true of the three faults measured and is not
      true in general. Corrected here rather than in place, because the
      ledger is append-only and the earlier entry describes what was
      actually measured then.
    but_the_direction_survives_and_the_losses_are_noise: >-
      EVERY LOSS IS SMALL AND ALL BUT ONE IS INSIDE ITS OWN NOISE.
        worst separation loss   -0.0037   (that case's noise: 0.0781)
        worst headroom loss     -0.00074
        10 of 11 losses are smaller than that case's seed-and-profile spread
        the 11th is a separation WIN of +0.0160 against a spread of 0.0055,
          classified a loss only because headroom moved by -0.00004
      Against a largest win of +0.0926, with 15 wins beating their own noise.
      THE OPPOSITE DIRECTION IS THE CONTROL AND IT IS DECISIVE: w_phys = 0.20
      is better on 8 of 37, worse on 29, and beats noise on ZERO. A one-sided
      move can be luck on a fault set; a move whose reverse is clearly worse
      is a direction.
    the_pattern_which_is_the_useful_part: >-
      THE LOSSES ARE THE INERTIAL PAIR, AND ONLY THE INERTIAL PAIR.
      10 of the 11 losses are imu0 or imu1; the eleventh is a GNSS-denied
      scenario scored on gps, 21x smaller than that case's own noise.
      By sensor, wins against losses: gps 8/1, mag 4/0, battery 4/1,
      motor_esc 3/1, vibration 3/0, baro 2/0, imu 0/10.
      That is mechanically legible rather than a coincidence. Raising
      `w_phys` raises the weight on PHYSICS residuals, which is where a
      violated physical relation shows -- power against thrust, magnetic
      field, position against Doppler. The dual-IMU check is a NEIGHBOUR
      relation (`redundant_imu`), not a physics one, so weight moved toward
      physics is weight moved away from the only cross-check the inertial
      pair has.
    what_is_still_NOT_established: >-
      Nothing is promoted. The shipped w_phys is unchanged at 0.30, no gate
      moved, and no frozen file was touched: every configuration is passed
      to `OnlineTrustLayer` at construction.
      This is a simulator, one fault window, one duration, and magnitudes at
      the adversarial end of each campaign range. The IMU regression is
      within noise HERE and that is not the same as absent -- an inertial
      fault campaign at mid magnitudes is the measurement that would settle
      it, and it has not been run.
    artifact: >-
      tools/research/config_sweep_wide.py;
      tests/test_config_sweep_wide.py;
      research/predictor_study/CONFIG_SWEEP_WIDE.json

  - id: MX-034
    date: 2026-09-11
    phase: RESEARCH (the measurement MX-033 named)
    kind: HYPOTHESIS_KILLED_CAUTION_DISCHARGED
    what_was_open: >-
      MX-033 found that raising w_phys from 0.30 to 0.40 loses on 11 of 37
      cases and that TEN OF THE ELEVEN ARE THE INERTIAL PAIR. Every loss was
      inside its own noise, but the wide sweep measured only at the
      ADVERSARIAL magnitude, where a large fault floors trust under every
      configuration and a real difference would be hardest to see. MX-033
      named the measurement that would settle it and did not run it.
    the_hypothesis_declared_before_the_run: >-
      Raising w_phys degrades inertial detection, because the dual-IMU
      cross-check is a NEIGHBOUR relation and weight moved to physics is
      weight moved off the only cross-check the pair has.
      KILLED IF at no magnitude does the w_phys=0.40 separation fall below
      SHIPPED by more than that magnitude's own seed-and-profile spread.
    what_was_run: >-
      660 runs. Three fault kinds on both inertial nodes -- bias_drift over
      six magnitudes, emi_spike over four, dropout -- across 5 seeds and BOTH
      flight profiles, under SHIPPED, w_phys=0.40 and w_phys=0.20. Grids span
      well below and well above, so the discriminating band is bracketed
      rather than assumed.
    the_result: >-
      HYPOTHESIS KILLED ON THIS GRID. Losses exceeding noise: ZERO of 16
      points that showed any trust response at all.
      THE GRID DID BRACKET THE BAND, which is what makes the null meaningful
      rather than a measurement taken in a dead zone. Separation on
      bias_drift climbs 0.0000 -> 0.0166 -> 0.1198 -> 0.2653 -> 0.4913 across
      rates 0.002 to 0.20, so the instrument was plainly responding.
      Across that whole band the configuration difference is FLAT: every
      delta lies between -0.0006 and +0.0005, against seed-and-profile
      spreads of 0.02 to 0.10. The effect of the weight change on inertial
      separation is roughly two orders of magnitude smaller than the noise,
      at every magnitude tried.
      MX-033's caution is therefore discharged: the inertial regression it
      flagged is not real on this grid, and it was not merely invisible at
      the adversarial end.
    a_second_finding_that_was_not_being_looked_for: >-
      DROPOUT PRODUCES NEGATIVE SEPARATION: -0.0235 on imu0 and -0.0240 on
      imu1, meaning the minimum trust during the fault is HIGHER than on a
      clean flight. That is not a defect in the metric. When a sensor stops
      delivering it is not fresh, the Beta recursion does not update, and
      trust HOLDS instead of falling -- so a total loss of data looks
      healthier than a noisy but live sensor.
      This is SR-001 reproduced through a completely different instrument:
      the frozen policy alarms on falling trust and says nothing when a
      sensor stops delivering. The supervision overlay exists for exactly
      this and is off by default.
    what_this_does_not_establish: >-
      KILLED_ON_THIS_GRID is that sentence. Three fault kinds on a
      simulator, one fault window, one duration. `bias_drift` is a linear
      ramp and `emi_spike` is additive noise at a fixed rate; neither is a
      bearing failure, a mounting resonance or a saturating gyro. Nothing is
      promoted, the shipped w_phys is unchanged at 0.30, and no frozen file
      was touched.
    artifact: >-
      tools/research/imu_campaign.py;
      research/predictor_study/IMU_CAMPAIGN.json

  - id: MX-035
    date: 2026-09-11
    phase: RESEARCH (cross-component trust, specification)
    kind: SPECIFICATION_AND_REFERENCE_IMPLEMENTATION_UNVALIDATED
    what_was_asked: >-
      Apply the CSIA idea to every component an automated vehicle has
      BESIDES its sensors, and combine that with the existing cross-sensor
      layer.
    the_one_fact_it_rests_on_and_it_is_measured: >-
      THE FROZEN TRUST CORE IS NODE-AGNOSTIC. `TrustCore(names, cfg)` takes
      arbitrary node names and `step` takes arbitrary edges carrying a
      residual and a gate; the file contains no reference to any sensor.
      Driving it over nodes called `esc_fl`, `pack` and `cpu` works today,
      and a test asserts it.
      So extending CSIA past its sensors needs NO frozen change. It needs the
      two things the core does not supply: the RELATIONS that must hold
      between component observables, and the GATES saying when each is
      observable at all.
    what_was_built: >-
      `csia_components/`: a catalogue of 14 relations across 8 constraint
      families -- redundancy, conservation, actuation, effort, timing,
      thermal, integrity, kinematic -- of which 12 apply to every powered,
      actuated, computer-controlled platform regardless of whether it flies,
      drives or floats. Each relation records what must hold, what
      observables it needs, WHEN IT IS CHECKABLE, which nodes a violation
      implicates, and what it is blind to.
      Plus `CombinedGraph`, which runs the frozen core over sensor nodes and
      component nodes together.
    the_two_design_problems_that_make_this_harder_than_the_sensor_case: >-
      CLOSED-LOOP MASKING INVERTS THE OBVIOUS EDGE. The intuitive actuator
      check is commanded-versus-achieved, and on any vehicle with a
      controller that is the WRONG residual, because the controller exists
      to drive it to zero. A motor losing authority does not show as a
      velocity error; it shows as the controller quietly commanding more to
      hold the same velocity. The informative residual is on the COMMAND
      side -- effort rising while output holds. Same shape as MX-030, where
      a better predictor tracked a fault and hid it.
      BLAME IS AMBIGUOUS IN A WAY IT IS NOT BETWEEN TWO IMUs. Two IMUs are
      peers; a command and its effect are not. Every non-redundancy relation
      implicates a SET, and a test enforces that no such relation names a
      single culprit.
    a_gap_found_and_fixed_in_the_writing: >-
      `implicated_by` was written to report a node implicated by two
      independent constraint families, which is the whole reason for
      combining the graphs. It could never do so: `blames` names relation
      ROLES ("actuator", "power_source"), not platform nodes, so two
      families never coincided and the cross-family result was ALWAYS EMPTY.
      Fixed by taking a platform binding from role to node; unbound roles are
      now reported with a warning rather than silently producing a null.
      A test pins both the empty case and the bound one.
      Separately, the test that no relation names a single culprit FAILED on
      first run and caught two catalogue entries -- `source_impedance` and
      `error_rate` -- that blamed one node when their own measurement chain
      implicates three. The catalogue was corrected, not the test.
    what_is_deliberately_NOT_done: >-
      No component node feeds the failsafe: the frozen policy names eight
      sensor nodes and nothing here changes what it reads, so a component
      trust value is published and judged by nobody -- the same state SR-006
      recorded for baro, recorded rather than quietly fixed. No capability is
      promoted on component evidence. Nothing runs in the flight-time path.
    what_is_NOT_established_and_it_is_most_of_it: >-
      NOTHING HERE HAS BEEN MEASURED ON ANYTHING. There is no
      component-fault simulator in this repository and no recorded
      component-fault data, so no detection floor, no false-alarm rate and
      no latency is known for any of the 14 relations. THE THRESHOLDS DO NOT
      EXIST, because a threshold is a property of a specific platform's noise
      and cannot be chosen from a desk.
      The component side is in a strictly WEAKER evidential position than the
      sensor side, which is itself unvalidated on hardware. Closed-loop
      masking is argued from what a controller does and measured only in its
      analogue (MX-030), not here. NO NOVELTY IS CLAIMED: cross-checking
      actuators against plant models, power against conservation and tasks
      against deadlines are standard fault-detection practice, and the
      prior-art search still cannot run from this environment.
    artifact: >-
      csia_components/catalog.py; csia_components/combined.py;
      tests/test_components.py

  - id: MX-036
    date: 2026-09-11
    phase: RESEARCH (component simulator and relation validation)
    kind: PREDICTION_TEST_ONE_CLAIM_FALSIFIED_TWO_CONFOUNDS_CAUGHT
    what_was_built: >-
      `csia_components/simulate.py`, a four-rotor electric platform written
      FROM PHYSICS: pack open-circuit voltage and internal resistance, motor
      torque-to-current, thrust as rpm squared, I^2R dissipation into a
      thermal time constant, a PI controller closing a vertical-velocity
      loop, a scheduler, and a link with sequence numbers. Seven fault kinds,
      each named for what breaks in hardware rather than for the check that
      might find it: efficiency loss, bearing friction, pack impedance rise,
      shunt bias, thermal path loss, cpu overrun, bus drops.
      Plus `residuals.py`, one residual per catalogued relation -- 12 of 14,
      with the two ground-vehicle relations recorded as not implemented and
      why, so "12 of 14" cannot be read as 14.
    why_this_is_not_pure_circularity_and_why_it_is_still_partly_so: >-
      The simulator implements physics and never imports a residual. More
      importantly, EVERY CLAIM TESTED WAS COMMITTED BEFORE THE SIMULATOR
      EXISTED: each relation's gate, blames and blind_to were written in
      MX-035 with no component simulator in the repository. Running them
      afterwards is a test of statements made in advance.
      IT REMAINS TRUE that simulator and residuals share one author and one
      week. A relation passing here is consistent with a model of the
      physics, not with any vehicle.
    the_falsified_prediction: >-
      `actuator_response` was declared BLIND to `esc_efficiency_loss`, on the
      argument that the controller compensates. IT IS NOT BLIND, robustly:
      an 0.5% efficiency loss reads 2.0x the worst clean excursion and 40%
      reads 299x, at every magnitude on the grid and every seed.
      THE REASON IS THE USEFUL PART. The controller compensates the OUTPUT,
      and to do so it must move the COMMAND. A residual spanning command to
      effect therefore sees the divergence GROW, caused by the compensation
      itself. What a closed loop actually kills is the TRACKING ERROR --
      setpoint against output -- which is a narrower and more useful lesson
      than the one first written: watch the command, not the tracking error.
      MX-035's claim that `effort_drift` is "the residual that survives a
      closed loop" was also too strong; two survive.
      The catalogue was corrected. The test that would have hidden this by
      agreeing with me was never written.
    two_confounds_the_cross_relation_matrix_caught: >-
      Running EVERY fault against EVERY relation, not only its own, exposed
      two defects in the simulator that no per-relation test would have seen.
      FIRST: `actuator_response` "detected" bus drops at 1.3x clean, which no
      physics in the model supports. Cause: a random number was drawn only
      when a drop was possible, so a faulted run consumed a different number
      of draws than a clean one and EVERY downstream noise sample differed.
      Fixed by drawing unconditionally; a clean and a faulted run now differ
      only by the fault, asserted bit-for-bit by a test.
      SECOND: `clock_agreement` reported a 4e7-fold excursion on `cpu_overrun`,
      a fault with no clock involvement. Cause: `clock_a` advanced by the
      NOMINAL period while the loop was stretched, so a scheduling fault
      silently desynchronised the two clocks. Fixed so both clocks see the
      same wall time; the residual fell to 1.4x, which is a real and small
      coupling.
    two_defects_in_my_own_campaign_found_on_the_first_run: >-
      `effort_drift` took its reference effort from the SAME run it scored,
      so the clean residual was identically zero, every fault "detected" and
      the floor meant nothing. That is the train-on-test error MX-030 had to
      fix on the predictor side, committed again eleven days later. The
      reference now comes from a held-out seed that appears in no scored run.
      Four relations have a clean baseline of EXACTLY zero, so "exceeds the
      clean maximum" degenerates to "is not zero" and the ratio is undefined.
      For three of them that is honest -- a link with no dropped frames
      really has zero gaps. It is now flagged per row rather than producing a
      confident-looking ratio from nothing.
    what_was_measured: >-
      Detection floors against this platform's own clean-run noise, 5 seeds,
      every fault against every relation. Examples, as multiples of the worst
      clean excursion:
        shunt_bias          -> power_balance          0.2% bias, 13.3x
        bearing_friction    -> actuator_agreement     0.02 A,    5.3x
        esc_efficiency_loss -> actuator_response      0.5%,      2.0x
        cpu_overrun         -> loop_rate              0.2 ms,    3.1x
        bus_drops           -> sequence_continuity    0.2%, against a zero
                                                      clean baseline
    four_faults_with_NO_responder_and_one_matters: >-
      `pack_impedance_rise` IS UNDETECTABLE ON A STEADY HOVER, at every
      magnitude to 0.25 ohm. Not a relation failure: `source_impedance` is
      gated on current variation, a constant load cannot identify an
      impedance, and the gate correctly refuses to run. The operational
      consequence is real -- a degrading pack is invisible until the vehicle
      manoeuvres -- and it is the kind of thing that is obvious only once
      measured.
      The other three are `thermal_path_loss` on motors 0, 2 and 3, and that
      is an instrumentation limit of the campaign rather than of the
      relation: `thermal_rise` was configured to watch motor 1 only. One
      relation instance per motor is needed.
    what_is_still_NOT_established: >-
      No number here is a measurement of any real vehicle, and a floor
      against simulated noise is a floor against simulated noise. The
      phenomena this simulator cannot produce are exactly the ones it cannot
      warn about, and unlike the sensor side that list has not been
      enumerated yet. Two of the fourteen relations have no residual at all.
      No component node feeds the failsafe. No novelty is claimed.
    artifact: >-
      csia_components/simulate.py; csia_components/residuals.py;
      tools/research/component_validation.py;
      tests/test_component_validation.py;
      research/predictor_study/COMPONENT_VALIDATION.json

  - id: MX-037
    date: 2026-09-12
    phase: RESEARCH (active evidence acquisition, E0 simulation)
    kind: FOUR_OF_MY_OWN_CLAIMS_FALSIFIED_BY_THE_TESTS_I_WROTE_TO_CHECK_THEM
    what_was_asked: >-
      Build CSIA Active Evidence Acquisition: convert detected
      non-identifiability into a request for the smallest safe diagnostic
      action that separates the remaining causal hypotheses, keeping CSIA
      outside flight-control authority and preserving abstention.
    what_was_built: >-
      csia_active_evidence/, six modules and no learned component of any
      kind: identifiability (the error model, inverted into a probe
      requirement in closed form), probes (seven bounded excitations with
      their statistics COMPUTED from the realised waveform, never declared),
      authority (an independent ALLOW/CLIP/DENY mock with no override
      parameter), selector (cheapest probe meeting the requirement, or a
      refusal), updater (set-valued hypothesis elimination with four
      verdicts), contract (the versioned episode and the stopping rule).
      Plus tools/research/active_evidence_campaign.py, 91 tests across
      tests/test_identifiability.py and tests/test_active_evidence.py, and
      eight documents under research/active_evidence/.
    the_hypothesis_declared_before_the_run: >-
      research/active_evidence/PREREGISTRATION.md, committed before the
      campaign ran. A probe meeting all three closed-form necessary
      conditions resolves delta_r in an independent plant; a probe failing
      any one does not. A SINGLE FALSE POSITIVE FALSIFIES IT.
    the_result: >-
      28 cells: 20 met-and-resolved, 7 failed-and-unresolved, 0 false
      positives, 1 false negative. Verdict
      NO_COUNTEREXAMPLE_IN_THIS_GRID, which is exactly that sentence: four
      deltas, seven probes, five seeds, one simulator, E0.
    the_measurement_that_makes_the_case: >-
      The null probe under a 0.040 ohm pack rise. The terminal voltage moves
      -0.959 V, which is unmistakable, and the fitted resistance moves
      8.6e-12 ohm, which is nothing. The information is not missing from the
      vehicle; it is missing from the excitation. This also discharges both
      halves of Rule A: the null arm resolves nothing AND is not vacuous.
    four_things_i_got_wrong_and_the_tests_that_caught_them: >-
      (AE-F1) The module's docstring asserted a Monte Carlo agreement that
      had never been committed -- exactly the CURRENT_PROGRAM_STATE.md
      section 6 failure, a result living only in a transcript. Writing the
      test made the mean claim TRUE and better (2.1e-05 ohm) and the scatter
      claim FALSE. (AE-F2) The textbook slope variance
      sigma_V/sqrt(sum(I-Ibar)^2) is optimistic by up to 85% for a measured
      regressor, over 108 cases in three noise regimes. It errs in the
      DANGEROUS direction: a requirement inverted from an over-confident
      scatter authorises a probe that cannot deliver. Replaced with a
      delta-method expansion, within 2.2%; the falsified expression is KEPT
      as naive_estimate_sd and re-measured every run. (AE-F3) from_measured
      refused only a non-positive remainder after subtracting the noise
      power, so a pure-noise hover was accepted as excited on 45 to 48
      percent of windows, measured. Now the excess must clear k sigma times
      the chi-squared sampling error of the variance estimate. (AE-F6) The
      amps-per-m/s constant was 9.0 by invention; measured 2.519. The guess
      was optimistic by 3.6x and the constant is now coupled to the campaign
      artifact by a test.
    the_design_rule_i_derived_and_then_falsified: >-
      A profile symmetric about its window midpoint has cov(t,I)=0 EXACTLY,
      measured at 1e-16, so drift aliasing is removed by construction rather
      than budgeted. The probe library was rebuilt around it. Then the
      campaign measured the REALISED current: the closed loop lags the
      command, a lag breaks a palindrome, and four of six probes lose the
      property with realised drift biases up to 0.0052 ohm -- LARGER THAN
      THE SMALLEST DELTA IN THE GRID. Only the two multi-cycle bursts keep
      it (+0.019 s, +0.004 s), because the lag averages across cycles. The
      campaign's own cell verdicts could not have caught this: they score a
      differential comparison and a common bias cancels. It was found only
      because the rule had been stated sharply enough to be checkable, and
      because the realisation was measured separately on purpose.
    what_did_not_change: >-
      No frozen path read, imported or edited. No threshold, gate, weight,
      prior, signature, hypothesis semantic, smoothing, freshness semantic,
      failsafe semantic or support semantic touched. No paper number, no
      claim row, no figure. Nothing promoted: the package writes no trust
      value, no capability state and no support verdict. A test parses every
      module with ast and asserts none can reach a transmit path, none
      imports the frozen core, and no episode may set
      active_action_prohibited False.
    the_governance_conflict_i_did_not_route_around: >-
      docs/CURRENT_PROGRAM_STATE.md section 1 lists ENERGY DOMAIN among the
      FORBIDDEN work areas while the dual-paper freeze holds, and states it
      governs where documents disagree. Pack internal resistance is the
      energy domain. The work proceeded on the program owner's explicit
      instruction. PREREGISTRATION.md section 0 records the conflict and the
      narrowing under which it proceeded; this line records that it was
      recorded rather than quietly reframed.
    honest_limit: >-
      E0. The plant shares a linear terminal-voltage law with the
      derivation, so agreement cannot rule out an error common to both. The
      resolved verdict compares populations of five seeds, four degrees of
      freedom, roughly 35 percent sampling error on the scatter; re-running
      the false-negative cell at 5, 20 and 40 seeds gave 0.00119, 0.00134
      and 0.00129, so that one is stable, but a cell near the threshold
      could flip. No RC dynamics, no temperature coupling, no cell
      imbalance, no actuator authority limit. Not a safety argument.
    novelty: >-
      NOVELTY_NOT_ESTABLISHED. All four scholarly endpoints (arxiv.org,
      api.semanticscholar.org, api.crossref.org, api.openalex.org) returned
      HTTP 000 with the proxy reporting connect_rejected, the same denial
      already recorded as publication blockers 1, 3 and 4. The search is
      INCOMPLETE and NO NOVELTY CLAIM IS PERMITTED for any part of this
      work. The closest named prior art the repository already knows about
      is Matei et al., ACM TCPS 8(1) 2024, DOI 10.1145/3631612, recorded in
      forge/PRIOR_ART_REQUIRED.md as covering interventions to disambiguate
      uncertain diagnosis. It has not been read.
    verdict: RECORDED
    consequence: >-
      A closed-form identifiability model that says what excitation a
      diagnosis needs, an authorizer that can refuse it, and a set-valued
      update that abstains. No gate was promoted, no stage promoted itself,
      and nothing here is wired into any runtime path.
    artifact: >-
      csia_active_evidence/; tools/research/active_evidence_campaign.py;
      tests/test_identifiability.py; tests/test_active_evidence.py;
      research/active_evidence/PREREGISTRATION.md;
      research/active_evidence/PRIOR_ART_MATRIX.md;
      research/active_evidence/DERIVATIONS.md;
      research/active_evidence/SIMULATOR_VALIDITY_ENVELOPE.md;
      research/active_evidence/FAILURE_AND_COUNTEREXAMPLE_LOG.md;
      research/active_evidence/CLAIM_LEDGER.md;
      research/active_evidence/RESULTS.md;
      research/active_evidence/EXPERIMENT_MANIFEST.json;
      research/active_evidence/results/ACTIVE_EVIDENCE_CAMPAIGN.json

  - id: MX-038
    date: 2026-09-12
    phase: RESEARCH (active evidence acquisition, baselines and rejection)
    kind: NEGATIVE_RESULT_THE_PROPOSED_SUBSYSTEM_EARNS_NOTHING
    what_was_asked: >-
      The same active-evidence work order, supplied in full. Measured against
      it, MX-037 covered perhaps a third: it had a closed-form
      identifiability model, a probe library, an authorizer and a set-valued
      updater, but NO BASELINES. It tested whether the model's prediction was
      right, not whether active evidence acquisition is worth anything.
    what_was_built: >-
      csia_active_evidence/hypotheses.py (an eight-entry model bank read from
      the simulator's own applicability matrix, plus an UNKNOWN sentinel that
      is deliberately not a generative model), csia_active_evidence/
      signatures.py (twelve residuals with declared physical scales, lineage
      families so residuals sharing a raw channel count once, and set-valued
      envelope separation), tools/research/aea_pair_campaign.py with five
      comparison arms, and 23 tests in tests/test_active_evidence_pairs.py.
    the_result: >-
      ACTIVE_PROBING_NOT_SUPPORTED_ON_THIS_GRID. Unresolved pairs out of 28
      summed over a three-point magnitude bracket: passive 5, and SIX for
      every one of opportunistic, fixed, random_safe and selected. All four
      active arms are identical in effect while costing 0.00, 3.03, 4.50 and
      2.40 amp-seconds. All four preregistered falsifiers fired.
    the_mechanism_exact_and_measured: >-
      source_impedance is gated on the load VARYING. effort_drift is gated on
      the operating point being STATIONARY. Every action opens the first and
      closes the second, exactly. A PROBE IS NOT FREE INFORMATION, IT IS A
      SWAP: minus two pairs at the low end of the bracket, zero at the
      middle, plus one at the top, net minus one.
    what_survived: >-
      The anchor. A steady hover cannot separate nominal from pack impedance
      rise at ANY magnitude in the bracket, and every active arm resolves it
      at the top -- so the pair is not unidentifiable, it is unidentifiable
      at a constant load. And abstention: a fault outside the bank entirely
      stayed ambiguous across three or more hypotheses on every arm, never
      forced into a single label.
    two_instrument_defects_caught_before_the_artifact: >-
      (AE-F10) The first pilot reported a PASSIVE hover separating 27 of 28
      pairs. Six of the twelve residuals have zero-width envelopes in this
      simulator -- the loop reads true vz, and the frame and sequence
      quantities are integers -- so disjointness degenerated into float
      inequality and pairs separated on 1e-17. The work order names this
      hazard in its own adversarial list and the first run walked into it.
      Fixed with a declared physical scale per residual, each one sigma of a
      declared sensor channel or one count of a counter. (AE-F11) The second
      pilot found the SELECTED probe was the worst of five arms at 9
      unresolved. triangle_soft closed effort_drift without opening
      source_impedance: the closed-form requirement said the probe was
      adequate while residuals.source_impedance refused to run at a realised
      0.2438 A against its declared min_current_sd of 0.25. Two unreconciled
      eligibility criteria for one relation. Fixed by reading the threshold
      out of the residual by introspection rather than copying it. The fix
      moved the arm from 9 to 6 and DID NOT RESCUE THE RESULT.
    what_this_means: >-
      On this evidence CSIA should WAIT rather than ASK. An ordinary mission
      manoeuvre delivers every bit of the separation a purpose-built probe
      delivers, at zero incremental energy, and the machinery to choose a
      probe earns nothing over choosing one at random. That is a reason not
      to build a subsystem. It does not retire the identifiability model,
      which is what predicts which manoeuvres carry information; it retires
      the selector as a source of value.
    a_process_failure_of_my_own: >-
      The pair campaign was NOT preregistered in a committed document before
      its first outcome-producing run. The arms, metric and falsifiers were
      fixed in the source beforehand and not edited after, but the H1 to H5
      labelling was written after seeing the numbers. That is weaker than a
      preregistration and is recorded as such rather than presented as one.
    honest_limit: >-
      E0. One simulator, one platform, eight hypotheses, three magnitudes,
      five seeds. The min-max envelope over five seeds is not a confidence
      interval; it understates the spread and is OPTIMISTIC about
      separation. Every arm is measured the same way so the comparison is
      fair, but the absolute counts are not bounds. The result is specific
      to a bank in which effort_drift is load-bearing: a platform without a
      stationarity-gated effort check would not pay this cost and the
      conclusion could reverse.
    novelty: >-
      NOVELTY_NOT_ESTABLISHED, and Gate G is BLOCKED. The nine sources the
      work order names were retried on this date and every scholarly host
      returned HTTP 000 with the proxy reporting connect_rejected. The
      matrix in research/active_evidence/PRIOR_ART_MATRIX.md now carries all
      eleven rows with every cell requiring a full text marked NOT READ.
      One row matters especially: the work order describes arXiv:2505.06410
      as showing why the naive delta-V over delta-I estimate is biased when
      open-circuit voltage changes, which on that description is the same
      drift-aliasing term derived in DERIVATIONS.md section 3. That
      derivation is therefore recorded as ASSUME KNOWN.
    verdict: RECORDED
    consequence: >-
      A measured reason not to add an active-probing subsystem to CSIA, with
      the mechanism named and a test that fails if the negative is ever
      softened rather than re-measured. The frozen core was not touched and
      nothing was promoted.
    artifact: >-
      csia_active_evidence/hypotheses.py;
      csia_active_evidence/signatures.py;
      csia_active_evidence/selector.py;
      tools/research/aea_pair_campaign.py;
      tests/test_active_evidence_pairs.py;
      research/active_evidence/results/AEA_PAIR_CAMPAIGN.json;
      research/active_evidence/RESULTS_PAIR_CAMPAIGN.md;
      research/active_evidence/PRIOR_ART_MATRIX.md;
      research/active_evidence/FAILURE_AND_COUNTEREXAMPLE_LOG.md;
      research/active_evidence/CLAIM_LEDGER.md

  - id: MX-039
    date: 2026-09-12
    phase: RESEARCH (realized-current excitation certificate, E0, owner-authorized energy-domain exception)
    kind: SIX_OF_MY_OWN_INSTRUMENTS_FAILED_AND_THE_RESULT_SURVIVED_ANYWAY
    owner_authorization: >-
      Recorded verbatim in
      research/active_evidence/realized_current/OWNER_AUTHORIZATION.md. The
      program owner authorized simulator-only energy-domain research on an
      isolated research branch. docs/CURRENT_PROGRAM_STATE.md section 1 is
      UNCHANGED and its energy-domain prohibition still stands; this is
      recorded as a narrow exception, not a revision of the rule. All
      results are quarantined post-freeze, research-only, awaiting review.
    what_was_asked: >-
      First, directly: run the MX-038 hypothesis bank without the
      stationarity-gated relation. Then build and falsify a Realized-Current
      Excitation Certificate that judges a diagnostic probe on the current
      the vehicle ACTUALLY drew rather than on the waveform it was asked for.
    the_direct_answer_first: >-
      MX-038's negative REVERSES. Removing effort_drift from the signature
      takes passive from 5 unresolved pairs to 9 while every active arm stays
      at 6. The MX-038 finding that active probing is a net loss was an
      artifact of one stationarity-gated relation, and is now bounded to
      platforms that have one.
    what_was_built: >-
      csia_active_evidence/battery_1rc.py (an independent one-RC Thevenin
      pack with curved OCV, temperature coefficient, command-to-current lag,
      saturation, and a measurement chain with offset, scale error, transport
      delay, quantisation, dropout and six independent noise streams; it
      imports nothing from the estimator under test and a test asserts that),
      realized_moments.py, rcec.py (ten states, five-term union-bounded error
      decomposition, and a fit-residual check that is the open-set detector),
      waveform_compensation.py, moment_feedback.py, rcec_selector.py with
      eight arms P0 to P7, tools/research/rcec_campaign.py, and 39 tests
      implementing the seventeen required controls.
    the_strongest_defensible_result: >-
      At constant amplitude and constant energy of 40.7 amp-seconds, moving
      a probe's energy from 0.41 Hz to 0.77 Hz cut the smallest resolvable
      pack resistance change from 0.020 ohm to 0.005 ohm, a factor of four.
      The certificate's own error decomposition predicted where the optimum
      would be WITHOUT running the sweep: the polarization bound falls as
      1/sqrt(1+(2 pi f tau)^2) while the noise term rises as the loop lag
      attenuates realized excitation, and at 6 cycles the two are equal to
      two significant figures (0.00083 against 0.00083).
    certificate_integrity: >-
      2000 adversarial draws over RC values, loop lag, sensor bias, scale
      error, transport delay, quantisation, dropout and open-circuit drift.
      1921 certified, ZERO false certifications. The bound is used rather
      than slack: worst observed error is 0.928 of the run's own limit and
      the median is 0.332, so it is neither violated nor vacuous. A 0.040 ohm
      rise moving the terminal voltage by -0.80 V at constant current is
      refused as INSUFFICIENT_EXCITATION, which is the control that matters
      most.
    six_instrument_failures_all_mine: >-
      (RC-1) The lag fit was biased 2.3x by a linearisation that diverges at
      the asymptote; replaced with direct residual minimisation, now
      recovering 0.71 to 0.93 of a known plant lag and under-estimating,
      which is conservative. (RC-2) The polarization bound used worst-case
      R1 outright, which made NO excitation able to clear the margin; the
      campaign's own negative control refused and forced the frequency-
      dependent derivation that made the main result possible. (RC-3) P3
      optimised a proxy rather than the certificate and chose a waveform the
      certificate then rejected, scoring zero certificates. (RC-4) THE WORST:
      the feedback arm's plumbing kept a state dict nothing ever wrote, so
      the accumulator saw ZERO samples and P4 ran as a byte-identical copy of
      P1 while being reported under its own name for a whole pilot campaign.
      (RC-5) Once wired, the feedback law capped 330 of 401 corrections and
      made the lever arm four times WORSE; the correction gain was guessed
      rather than derived and called a method that does not exist. (RC-6) The
      P3 search grid offered 2, 3 and 5 cycles and the optimum is 6 to 12 --
      a search cannot find what its grid excludes.
    what_was_rejected: >-
      H2 on outcome. P4 now genuinely cuts the realized lever arm from +0.033
      to -0.022 seconds and raises S_II by 12 percent, and the separation does
      not move at all, because B_drift is 9 percent of the error while
      B_dynamic is 59 percent. THE COMPENSATION IMPROVES A TERM THAT IS NOT
      BINDING. No closed-loop-aware arm beats the naive palindrome or a
      randomly chosen probe.
    what_this_does_not_establish: >-
      Robust operation across real battery chemistries: NOT SUPPORTED and not
      supportable from this host, because every pack parameter is synthetic
      and no cell data exists in this repository. Reliable hardware
      behaviour: E0 only. Novelty: BLOCKED_EXTERNAL_ACCESS, rechecked this
      session with every scholarly host returning HTTP 000 under
      organization policy; the drift-aliasing derivation is recorded as
      ASSUME KNOWN because the work order describes arXiv:2505.06410 as
      covering it. Production integration: forbidden by the authorization and
      not attempted. Formal safety: not claimed, Monte Carlo is not a proof.
      The clean-data residual ratio is 2.17 against a tolerance of 3.0, so
      the open-set detector already has thin headroom, and tau1_min is the
      single most load-bearing declaration in the budget.
    verdict: RECORDED
    consequence: >-
      A certificate that judges realized excitation rather than commanded
      waveforms, with a measured design rule for probe frequency and zero
      false certifications across its declared envelope. Frozen core
      untouched, nothing promoted, no production path altered.
    artifact: >-
      csia_active_evidence/battery_1rc.py;
      csia_active_evidence/realized_moments.py;
      csia_active_evidence/rcec.py;
      csia_active_evidence/waveform_compensation.py;
      csia_active_evidence/moment_feedback.py;
      csia_active_evidence/rcec_selector.py;
      tools/research/rcec_campaign.py; tests/test_rcec.py;
      research/active_evidence/realized_current/

  - id: MX-040
    date: 2026-09-12
    phase: RESEARCH (multi-RC pack with hysteresis, E0, owner-authorized energy-domain exception)
    kind: A_GENUINE_FALSE_CERTIFICATION_FOUND_CLOSED_AND_A_LIMIT_THAT_CANNOT_BE_CLOSED
    what_was_asked: >-
      Run the multi-RC pack with hysteresis, which MX-039's validity envelope
      named as the highest-value next experiment, and make it work without
      lying, verifying every point.
    the_prediction_that_failed: >-
      MX-039 predicted a richer pack would trip the open-set detector on
      HEALTHY data, because the clean residual ratio was already 2.17 of a
      3.0 tolerance. It went the other way: the multi-RC clean ratio is 1.84,
      LOWER, because the branch parameters happened to be gentler. A
      prediction that fails in the safe direction is still a failed
      prediction.
    a_vacuous_test_of_my_own: >-
      Hysteresis only moves when the current REVERSES SIGN. With a 20 A base
      current and an 8 A probe the current never went below 13 A and the
      hysteresis state sat at exactly +1.0000 for the entire window, so the
      term was a constant the regression absorbs into the intercept. Three of
      my first four configurations were testing nothing at all.
    a_false_alarm_on_a_healthy_pack: >-
      At 22 A and 3 cycles the certificate refused a HEALTHY multi-RC pack as
      UNKNOWN_OR_MODEL_MISMATCH at a residual ratio of 3.06, while its
      estimate was 0.00163 ohm from truth and inside the bound it would have
      issued. The predicted residual counted sensor noise only while the
      budget already declared a polarization branch. Conflating a mechanism
      nobody declared with a declared mechanism I chose a bad probe for is
      the error. Fixed by adding the declared polarization in quadrature;
      verified in BOTH directions, and detection improved, now catching 0.10
      V of ringing where it previously needed 0.20 V.
    the_false_certification: >-
      A multi-RC pack with 0.12 V of voltage hysteresis and fast relaxation
      returned CERTIFIED_IN_MODEL with an estimate of 0.032167 ohm against a
      truth of 0.039998, a signed error of -0.007831 ohm against a declared
      bound of 0.001627 -- FOUR POINT EIGHT ONE TIMES ITS OWN BOUND. The
      residual check sat at 2.39 of a 3.0 tolerance and could not have caught
      it at any tolerance.
    the_structural_reason: >-
      A NUISANCE THAT IS CORRELATED WITH THE REGRESSOR IS ABSORBED INTO THE
      SLOPE AND LEAVES NO RESIDUAL. Hysteresis voltage follows sign(I), which
      for a reversing probe is nearly in phase with I, so least squares
      attributes it to resistance and the fit looks clean. A residual check is
      structurally blind to exactly the errors that matter most.
    the_fix_and_its_verification: >-
      A sixth budget term derived from the realized current,
      B_hysteresis <= M_max * |cov(sign(I), I)| / var(I), which is exactly
      zero when the current never reverses. Verified at four points: declared
      truthfully at 0.15 the counterexample returns MODEL_MISMATCH_LIMITED; a
      non-reversing probe earns exactly 0.000000; an undeclared bound returns
      UNBOUNDED_TERM:B_hysteresis and fails closed; and over 400 draws inside
      the declared envelope there are ZERO false certifications with a worst
      ratio of 0.43.
    the_limit_that_cannot_be_closed_from_here: >-
      The certificate is TOLD M and never measures it. Declaring 0.05 V for a
      pack that has 0.12 V still yields certified estimates wrong by more than
      their bound: 11 false certifications out of 290 certified over 400
      draws, worst ratio 1.53. A CROSS-PROBE CONSISTENCY CHECK WAS BUILT AND
      DOES NOT WORK: measured disagreement-to-bound ratios of 0.33, 0.55 and
      0.85 for true M of 0.05, 0.08 and 0.12 against a declared 0.05, across
      three different probe pairs, never reaching one, because the same M that
      creates the disagreement also inflates the declared bound on the
      reversing probe. The two scale together. This is reported as a NULL
      RESULT rather than omitted.
    what_this_settles: >-
      It is the concrete reason robust operation across real battery
      chemistries is NOT SUPPORTED and cannot be supported from this host: the
      hysteresis declaration must come from cell characterisation, this
      repository has none, and no internal test substitutes for it.
    verdict: RECORDED
    consequence: >-
      A six-term certificate that holds inside its declared envelope over 400
      hysteresis draws and 2000 adversarial draws with zero false
      certifications, a measured price for under-declaring, and a documented
      null result for the check that would have rescued it. Frozen core
      untouched, nothing promoted.
    artifact: >-
      csia_active_evidence/battery_multirc.py; csia_active_evidence/rcec.py;
      tools/research/rcec_campaign.py; tests/test_rcec.py;
      research/active_evidence/realized_current/

  - id: MX-041
    date: 2026-09-13
    phase: "RESEARCH (evidence-base layer: ingestion, intent, corpus)"
    kind: THREE_GAPS_CLOSED_AND_TWO_OF_MY_OWN_DESIGNS_WERE_TOO_WEAK_ON_FIRST_RUN
    what_was_asked: >-
      Read an external requirements document as a specification for an
      evidence layer, take what generalises, and build it so it strengthens
      the CSIA core rather than serving one domain.
    what_was_built: >-
      csia_evidence/, three modules that qualify THE EVIDENCE rather than the
      vehicle, with 40 tests. Nothing in the package knows what an aircraft
      is: a channel is a named series, a commitment is a checkable predicate,
      a run is a record with declared factors.
    the_rule_the_package_is_built_under: >-
      NOTHING IN THIS PACKAGE PROMOTES ANYTHING. Each module returns a record
      and a human or an explicit policy decides. Asserted by a test against
      the package docstring and against the public API, and it is the same
      discipline csia_supervision/capability_bridge.py follows one layer
      down.
    gap_one_ingestion: >-
      CSIA's answer to an undeclared channel was NOT_EVALUABLE, which is safe
      and, against data it did not design, useless. Recognition now reports
      itself across seven ordered evidence kinds with NO NUMBER attached to
      any of them, because there is no calibrated population from which one
      could be computed. Only DECLARED and NAME_EXACT are usable without
      review. Conflicts are first class: when a name says one thing and a
      declared unit says another, the disagreement IS the finding and a
      conflicted mapping is never usable whatever its best grade.
    gap_two_intent: >-
      CSIA had no representation of tasking, so it could not tell a fault
      from a deliberate change of plan; those look identical in telemetry and
      mean opposite things. The non-obvious part is the reason to build it: a
      deviation CHANGES WHICH EVIDENCE IS ADMISSIBLE, because half of CSIA's
      relations are gated on an operating condition. A debrief that says it
      deviated at t=340 and stops has discarded the more useful half, which
      is that for the next 90 seconds these relations could not run.
      NOT_EVALUABLE is deliberately distinct from HELD, and the module
      refuses to judge whether deviating was correct -- a system that
      abandons a commitment to avoid a hazard has done the right thing.
    gap_three_corpus: >-
      This is the lineage rule lifted one level. csia_active_evidence/
      signatures.py refuses to let three residuals reading the same raw
      current count as three pieces of evidence; two runs sharing an airframe
      are likewise two views of one airframe. Effective n is the number of
      DISTINCT FACTOR VALUES, never the number of runs, and when a claim
      depends on several factors the honest figure is the smallest, because
      that is the one that runs out first. accumulate REFUSES to report a
      rate at an effective n of one; the naive rate is still returned so
      nothing is hidden, but it is labelled an observation about a single
      article.
    two_of_my_own_designs_were_too_weak: >-
      (1) DIMENSIONAL EVIDENCE COULD IDENTIFY A FIELD. A field named qqq
      holding the values 1.0 and 2.0 was confidently mapped to current,
      because those values are inside the plausible range of a current, a
      voltage and a temperature alike. Plausibility is a weak NEGATIVE test:
      it can say a field named like a current holds values no current takes,
      and it cannot say an unnamed field is a current. Dimensional evidence
      now corroborates and conflicts but never places, and it is still listed
      so a reader can see it was considered and rejected. (2) NORMALISATION
      FOLDED SEPARATORS ONLY, so PackCurrent became the single token
      packcurrent and matched nothing. Camel case is not an edge case in
      telemetry, it is the house style of most systems this layer exists to
      read.
    validated_against_something_real: >-
      Not only toy fields. The ingestion layer is run against the component
      simulator's actual channels, an existing independent part of this
      repository written before this module existed, and places
      pack_current, pack_voltage and vz with nothing unrecognised. A second
      test hands it the voltage series under the name pack_current and
      confirms the disagreement surfaces rather than being resolved in favour
      of the name.
    what_none_of_it_establishes: >-
      ingestion does not establish that any field IS the channel it
      resembles, only what evidence was found. intent does not establish that
      a deviation was wrong. corpus gives an UPPER BOUND on the independence
      available: runs sharing no declared factor value may still share
      something nobody declared. No domain-specific content from the external
      document is implemented, no mission autonomy, no targeting, nothing
      that decides anything.
    verdict: RECORDED
    consequence: >-
      CSIA can now be pointed at data it did not design and say what it
      recognised and what it could not, can distinguish a fault from a
      change of plan and price what the change cost in evidence, and can
      refuse to inflate twenty runs on one article into a population claim.
      Frozen core untouched, nothing promoted.
    artifact: >-
      csia_evidence/; tests/test_evidence_base.py;
      docs/architecture/EVIDENCE_BASE_LAYER.md

  - id: MX-042
    date: 2026-09-13
    phase: "RESEARCH (RCEC repair: unsound bound found, P3 failure classified)"
    kind: MY_OWN_SHIPPED_ERROR_BOUND_WAS_UNSOUND_AND_INVALIDATES_PART_OF_MX_039
    what_was_asked: >-
      Diagnose and repair the RCEC experiment rather than improve its
      reported result. Do not launch the final campaign.
    two_premises_corrected_before_acting: >-
      The instruction stated P3 never reaches a valid certificate. That is
      true of the PILOT and not of the committed state, where P3 reports
      CERTIFIED_IN_MODEL 50 of 50 in all three plant models; the failure was
      repaired before the first artifact existed and is recorded as RC-3. The
      instruction also stated the task metric reached its upper bound; it is
      worse than that, floored at 0.00 for every arm at 0.005 ohm AND
      ceilinged at 1.00 at 0.020 and 0.040, so exactly one of four grid
      points discriminates and every reported difference between arms rests
      on it.
    the_finding_that_matters: >-
      THE SHIPPED POLARIZATION BOUND IS UNSOUND. B_dynamic shipped as
      R1_max/sqrt(1+(2 pi f_eff tau_min)^2). Measured against direct
      simulation of the branch it bounds, on the three-cycle palindromic
      probe the headline arms used: committed bound 0.00155 ohm, true worst
      case over the declared envelope 0.00797 ohm. UNDERSTATED FIVEFOLD,
      which is the false-certification direction. Two independent errors: it
      used the MAGNITUDE of the branch impedance where a regression sees only
      the in-phase part, and the whole frequency-domain argument assumes a
      steady state the branch never reaches over a window shorter than its
      time constant. On a 1.2 A/s ramp the true apparent resistance is 0.0176
      ohm, LARGER THAN R1 ITSELF, which no steady-state formula produces.
    what_this_invalidates: >-
      Under the corrected bound a three-cycle palindromic probe totals
      0.01065 against an allowed 0.01000 and DOES NOT CERTIFY. That is the
      probe P1, P2, P4, P5 and P7 all used in MX-039, so that arm comparison
      was computed on an unsound bound and cannot stand as reported. It is
      withdrawn pending the amended campaign, and the MX-040 hysteresis limit
      is marked SUPERSEDED for the same reason.
    the_fix_and_why_no_closed_form: >-
      A Cauchy-Schwarz transient term was tried and is sound for oscillating
      probes and VIOLATED in 80 of 1200 (waveform, R1, tau, initial
      condition) combinations. No closed form is needed: the branch is linear
      with one scalar state, so polarization.bound integrates it over the
      declared envelope and takes the worst case. Zero violations in 1800
      draws across nine waveform families, tightness 0.57 to 0.90, about 40
      ms per bound, and it discriminates by a factor of 336 between a
      six-cycle probe and a slow ramp. It takes a waveform and an envelope
      and there is NO argument through which a fault label, hypothesis or
      outcome could reach it.
    p3_failure_classified_with_a_table_not_an_anecdote: >-
      Over all 120 grid candidates on the diagnostic partition the first
      binding condition is model mismatch or error budget for 76, CERTIFIED
      for 24, and excitation for only 20. THE FEASIBLE SET IS NOT EMPTY: the
      cheapest witness is a palindromic probe at 4 A over 8 s with 6 cycles,
      the repaired objective finds it, and the reconstructed pilot objective
      picks a 2 A 2 s chirp that does not certify. So the pilot failure was
      OBJECTIVE MISSPECIFICATION, a form of optimizer failure, not
      infeasibility, not prediction mismatch and not a certificate defect.
      RC-3's conclusion was right and its evidence was one data point.
    conservative_withdrawn: >-
      MX-039 called lag underestimation conservative because it
      under-compensates. Asserted, not shown. A signed sweep over
      assumed/true ratios from 0.25 to 4.0 measured the achieved error to be
      NOT MONOTONE in the lag ratio, and at a fourfold underestimate the
      REALIZED DRIFT LEVER CHANGES SIGN at true lags of 0.10 s and 0.25 s. A
      sign change puts the bias on the other side of the truth. What survives
      is a fact about the grid, not a property: worst error under
      underestimation 0.0196, exact 0.0204, overestimation 0.0232.
    a_process_failure_of_my_own: >-
      The failing pilot objective was never committed, so the pilot artifact
      never existed as a file and cannot be recovered. Fixing a defect before
      the first commit leaves no evidence and the correction trail then rests
      on prose alone. Everything preserved is labelled
      RECONSTRUCTED_NOT_RECOVERED.
    what_was_built_not_run: >-
      csia_active_evidence/partitions.py with four new immutable partitions,
      a hashed manifest and an accessor that refuses a sealed partition;
      csia_active_evidence/polarization.py; csia_active_evidence/difficulty.py
      declaring the sixteen-factor ladder, the signed resolution margin and
      the strategy x effort-drift x plant factorial; and
      tools/research/rcec_diagnostics.py. THE AMENDED LOCKED CAMPAIGN HAS NOT
      BEEN RUN and no locked seed, original or amended, was read.
    verdict: RECORDED
    consequence: >-
      An error bound that is sound over its declared envelope rather than
      fivefold optimistic, P3's failure classified against all four candidate
      causes with a table, a withdrawn conservatism claim, and a continuous
      signed margin replacing a metric that discriminated at one grid point.
      Part of MX-039 is withdrawn as a result.
    artifact: >-
      csia_active_evidence/polarization.py;
      csia_active_evidence/partitions.py;
      csia_active_evidence/difficulty.py;
      tools/research/rcec_diagnostics.py; tests/test_rcec_repair.py;
      research/active_evidence/realized_current/PREREGISTRATION_AMENDMENT_1.md;
      research/active_evidence/realized_current/FAILED_PILOT_RECONSTRUCTION.md;
      research/active_evidence/realized_current/results/RCEC_DIAGNOSTICS.json

  - id: MX-043
    date: 2026-09-13
    phase: "RESEARCH (amended locked campaign, opened once, E0)"
    kind: ACTIVE_PROBING_WINS_HERE_AND_THREE_MORE_OF_MY_CONSTRUCTS_FAILED
    authorization: >-
      Owner-authorized to open the sealed amended_locked partition exactly
      once, after a documentation-only clarification of the polarization
      bound's scope. Preregistration 84576af, amendment 020b0dd, scope
      clarification ef572c0, HEAD at run c3ee776, partition manifest
      e872d36f. Baseline 3069 tests green and blocking guards PASS
      immediately before opening. Frozen core identical.
    the_result: >-
      8640 rows, 209 s, ZERO false certificates. The delay-compensated probe
      P2 resolves a 0.006 ohm pack-resistance change where the naive
      palindromic probe needs 0.020 and where passive hover and an ordinary
      mission manoeuvre NEVER resolve at any magnitude tested. Paired on
      matched drift, magnitude and seed, P2 beats the mission manoeuvre on
      140 of 140 triples with a median difference of +0.03918 ohm, and the
      naive probe on 240 of 240 with +0.00606.
    this_reverses_mx_038_and_does_not_replicate_it: >-
      MX-038 concluded CSIA should wait rather than ask. On this plant and
      this metric the opposite holds and waiting never works, because a slow
      mission manoeuvre correlates current with time and carries a realized
      drift lever of 0.64 s, an order of magnitude worse than any
      purpose-built probe. The two results are on different plants with
      different nuisances and neither transfers to the other.
    the_worst_counterexample: >-
      THE BEST ARM IS THE MOST FRAGILE. At elevated drift P2 collapses from
      0.006 to never and P3 from 0.010 to never, while P4 feedback holds at
      0.010. An arm chosen on nominal performance is the wrong choice under
      the nuisance.
    three_more_of_my_own_constructs_failed: >-
      (RC-18) P7 IS NOT A CEILING. It has the highest realized excitation
      21445, the lowest drift lever 0.018 and the WORST frontier of every arm
      at 0.040, because it maximises the second moment of current, which is
      not the objective, and puts its energy at the window fundamental where
      the polarization branch follows it completely. A quantity that
      upper-bounds excitation does not upper-bound resolution; the oracle
      claim is withdrawn. (RC-19) THE RESOLUTION MARGIN CANNOT DISTINGUISH
      PLANT MODELS. Median M_R is identical to twelve decimal places across
      simple, one-RC and multi-RC in all 2012 comparable cells, because M_R
      is built from the DECLARED ENVELOPE and the realized current and the
      realized current is set by the control loop. The margin measures what
      the certificate can bound, not what the plant does; the
      simple-versus-one-RC comparison is withdrawn before being reported.
      (RC-20) The preregistered scalar delta_interaction came out NOT A
      NUMBER, because never encodes as infinity and the difference of two
      infinities is undefined. The interaction is reported as a table and the
      scalar is not redefined after the fact.
    other_findings: >-
      Unknown-fault routing has a floor: 0.40 V of unmodelled ringing routes
      to UNKNOWN_OR_MODEL_MISMATCH and 0.10 V is absorbed and certified. Only
      the EXACT lag certifies; both under and over estimation fail, and the
      fourfold underestimate flips the realized lever sign on locked data,
      confirming the withdrawal of conservative. Sensing defects barely move
      the margin: bias 1.0 A, scale 2 percent, current noise 0.2 A, 40 ms
      delay, 20 percent dropout and 0.05 A quantisation all certify. P3 is
      the cheapest feasible arm at 0.010 ohm for 20.37 amp-seconds, half of
      P1's energy.
    a_process_failure_of_my_own: >-
      One commit went in with a red guard test because a shell pipeline
      masked pytest's exit status. Caught and fixed in the next commit,
      before the seal was opened. Recorded rather than amended away.
    what_was_withdrawn: >-
      The MX-039 arm comparison (computed on a polarization bound
      understating fivefold), MX-039's P7 oracle ceiling (falsified), MX-039's
      conservative lag claim (withdrawn), the MX-040 hysteresis limit as
      measured (superseded), and this campaign's own plant-model comparison
      (withdrawn before reporting).
    honest_limit: >-
      E0, one synthetic pack family, one loop family, one platform. The
      polarization bound is exhaustive over a discrete 105-point grid and
      SAMPLED beyond it: zero observed violations in 1800 preregistered
      evaluations, rule-of-three upper limit p < 0.00167 under an IID
      interpretation, which is not a formal guarantee. Nothing here has run
      on hardware and no chemistry is characterised. Novelty remains
      BLOCKED_EXTERNAL_ACCESS.
    verdict: RECORDED
    consequence: >-
      A repaired experiment that discriminates: a continuous signed margin
      instead of a metric saturated at both ends, a detection frontier that
      separates seven arms into five levels, zero false certificates over
      8640 rows, and three of my own constructs falsified by their own
      locked data. The frozen core was not touched and nothing was promoted.
    artifact: >-
      tools/research/rcec_locked_campaign.py;
      research/active_evidence/realized_current/results/RCEC_LOCKED_CAMPAIGN.json;
      research/active_evidence/realized_current/RESULTS_LOCKED.md;
      research/active_evidence/realized_current/POLARIZATION_BOUND_SCOPE.md;
      tests/test_rcec_repair.py

  - id: FL-020
    date: 2026-09-20
    phase: Consequence Phase 3 (closed-loop consequence measurement)
    kind: NEGATIVE_RESULT
    what_happened: >-
      H2 was not supported. Over 216 locked scenarios, 28 decision conflicts
      were observed; 24 of them lie in the physically inconsistent
      armed_gate_pair control (a vehicle reporting disarmed while its own
      sensors show it flying) and are excluded by the preregistration. The
      remaining 4 are in heading_course conditions F and G. The seed-paired
      comparison between the gate-shut and gate-open conditions is 3/24
      versus 1/24 missed escalations, exact two-sided McNemar p = 0.625
      against a preregistered alpha of 0.05.
    found_by: >-
      research/consequence/phase3/analyze.py, reading the independent
      evaluator's output. The evaluator imports no CSIA module and was tested
      against one hand-built trace per outcome class before it ran.
    honest_limit: >-
      3 of 8 Phase-2 candidates, one airframe profile, one trajectory family,
      two fault families, in deterministic simulation at
      MODEL_BASED_ACTION_CONSEQUENCE. Nothing flew.
    verdict: RECORDED
    consequence: >-
      The occlusion enumerated in Phase 2 for accel_motor_current and
      accel_esc_rpm is structurally real and operationally unreachable on this
      airframe: its window has zero overlap with airborne flight, measured at
      0.00 s of fault-window occlusion over 48 locked scenarios, because
      armed_gate closes only while the vehicle is disarmed and a disarmed
      vehicle is not flying. The frozen failsafe abstains under the same
      condition. Preregistered rejection criteria (a) and (d).
    artifact: >-
      research/consequence/phase3/PHASE3_RESULTS.md;
      research/consequence/phase3/results/PHASE3_RESULTS_LOCKED.json;
      research/consequence/phase3/results/PHASE3_EVALUATION_LOCKED.json

  - id: FL-021
    date: 2026-09-20
    phase: Consequence Phase 3 (policy comparison)
    kind: NEGATIVE_RESULT
    what_happened: >-
      H3 was not supported, and could not have been tested. P0 made zero
      incorrect actionable decisions on all 216 locked scenarios, so the
      support-aware policy had nothing to reduce. P2 is identical to P0 on
      every scenario: no response withdrawn, no abstention, 0.0 s of
      abstention time. P1's freshness fallback also never fired, because the
      injected faults degrade data without stopping it.
    found_by: >-
      The locked campaign's policy table, derived from the independent
      evaluator.
    honest_limit: >-
      This is the absence of a test, not a result about either policy. The
      condition P2 exists for -- a confident attribution issued while the
      evidence that would separate it is gated off -- occurred 0 times in 216
      scenarios.
    verdict: RECORDED
    consequence: >-
      The reported costs of the support-aware policy (coverage loss,
      ambiguity, latency, abstention, false refusals) are all exactly zero,
      and they are zero because the policy was inert. No claim is made that
      P2 is safe, unnecessary or beneficial, and none that freshness logic
      covers the occlusion.
    artifact: >-
      research/consequence/phase3/PHASE3_RESULTS.md;
      research/consequence/phase3/results/PHASE3_RESULTS_LOCKED.json

  - id: FL-022
    date: 2026-09-20
    phase: Consequence Phase 3 (mutation)
    kind: NEGATIVE_RESULT
    what_happened: >-
      Two mutants survived: P3-03 (report every edge gate as fully open) and
      P3-04 (ask the global support question instead of the decision pair's).
      No test in the suite objects to either.
    found_by: tools/mutation/run_e2m_mutations.py, 38 evaluated, 36 killed.
    honest_limit: >-
      Re-running the development campaign with each mutation monkeypatched in
      changed 0 outcome classes. P3-03 moved 36 of 288 recorded support
      fields; P3-04 moved none at all, because the global and pair support
      states coincided on every development scenario.
    verdict: RECORDED
    consequence: >-
      Not patched with a test written to catch one mutant. Both survivors are
      a symptom of FL-021: when the support-aware path never withdraws a
      response, nothing downstream can distinguish real gate weights from
      all-open ones. The way to kill them is a scenario in which support
      changes a decision, which this campaign failed to produce.
    artifact: >-
      research/bus_provenance/results/E2M_MUTATION_RESULTS.json;
      research/consequence/phase3/PHASE3_RESULTS.md

  - id: FL-023
    date: 2026-09-20
    phase: Consequence Phase 3 (apparatus)
    kind: OUR_OWN_ERROR
    what_happened: >-
      Three defects in the measurement apparatus, each found by the check that
      was supposed to find it rather than by inspection. (1) Conditions A/B/C
      as first preregistered measured 0.00 s of overlap between the occlusion
      and airborne flight for armed_gate_pair, so the campaign could not have
      detected a consequence had one existed -- a test that cannot fail.
      (2) Condition F, added to force the overlap, confounded fault duration
      with gate state: F's fault is 4 s and B/C's is 25 s. (3) The occlusion
      metric summed airborne closed time over a whole flight, which in
      hover_circle is about half the mission whatever the fault is doing.
    found_by: >-
      Looking at development-partition results, which is what the development
      partition is for. The locked partition was not open.
    honest_limit: >-
      All three fixes were made with development results in view. They are
      recorded as Amendment 1 to the preregistration rather than folded into
      its body, and none of them changed a threshold, a model constant, a kill
      criterion or an outcome class.
    verdict: RECORDED
    consequence: >-
      Condition G (the same 4 s fault where the gate is open) and a
      fault-window occlusion metric. F versus G is the only comparison in the
      Phase-3 consequence table that isolates the gate, and the results
      document says so at the table.
    artifact: >-
      research/consequence/phase3/PREREGISTRATION_PHASE3.md (Amendment 1);
      research/consequence/phase3/campaign.py;
      research/consequence/phase3/independent_consequence_evaluator.py

  - id: FL-024
    date: 2026-09-20
    phase: Consequence Phase 3 (mutation sandbox)
    kind: GUARD_STOPPED_WORK
    what_happened: >-
      The mutation runner's unmutated-baseline check refused to report twice
