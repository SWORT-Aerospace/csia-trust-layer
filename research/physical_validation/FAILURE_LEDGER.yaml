  - id: MX-001
    date: 2026-09-07
    phase: MISSION EXTENSION (capability assurance)
    kind: SEMANTIC_DEFECT
    what_happened: >-
      THE RECERTIFICATION HOLD WAS COSMETIC. A capability held pending
      re-certification was given DEGRADED_SUPPORTED, on the reasoning that it
      was "working but qualified". But DEGRADED_SUPPORTED is an AUTHORIZING
      state: the planner gate accepts it and every product resting on the
      capability qualifies from it. So the hold relabelled the capability and
      changed nothing downstream -- a sensor coming back restored full
      mission authority immediately, which is BAD_PRODUCT_05, the exact
      defect the recovery machine exists to prevent.
    found_by: >-
      The disaster-corridor benchmark's S5 scenario, whose expected outcome
      table was written BEFORE the scenario was ever run. S5 predicted that
      the first tick after evidence returns would NOT restore the absolute
      products. It did restore them, and the capability recovery latency came
      out at 0.000 s -- which the metric definition had already named as the
      signature of restoring on presence.
    verdict: FIXED
    consequence: >-
      The hold is now UNKNOWN. That is semantically exact rather than a
      compromise: during re-measurement the evidence is returning but the
      re-establishment is incomplete, so the layer cannot yet SAY the
      capability is supported. NOT_SUPPORTED would have been stronger than
      what is known -- it asserts unavailability, which the returning
      evidence contradicts.
      UNKNOWN is also the one state that can never be promoted, so the hold
      is now enforced by the same rule that protects everything else in the
      layer rather than by a special case.
      THE EXPECTATION WAS RIGHT AND THE IMPLEMENTATION WAS WRONG. That is the
      direction a preregistered expectation is supposed to catch, and it is
      the first time in this programme that a declared-in-advance table has
      caught a defect in code written by the same session.
    artifact: >-
      csia_mission/capability.py;
      research/mission/results/DISASTER_CORRIDOR.json

  - id: MX-002
    date: 2026-09-07
    phase: MISSION EXTENSION (recovery)
    kind: CIRCULAR_DEPENDENCY
    what_happened: >-
      THE RECOVERY MACHINE WAS FED ITS OWN OUTPUT AND DEADLOCKED. With MX-001
      fixed, the hold makes a capability UNKNOWN. The benchmark then fed that
      UNKNOWN back into RecoveryState.observe() -- the state the machine's own
      hold had produced. An UNKNOWN observation correctly neither advances nor
      abandons recovery, so the machine reset its streak every tick and stayed
      in RESTRICTED forever. The capability never recovered, on any tick, and
      the recovery latency was None.
    found_by: >-
      The same S5 expectation, which after the MX-001 fix still did not match:
      the "after_recertification" row expected restoration and observed a
      permanent hold.
    verdict: FIXED
    consequence: >-
      The machine must observe the CANDIDATE state -- what the evidence says
      with the hold ignored -- while products, certificates and the planner
      consume the PUBLISHED state with the hold applied. Feeding it the
      published state makes it decide whether to lift the hold by reading the
      hold, which is circular and can only ever have one answer.
      csia_mission.recovery.step() now does both evaluations in the right
      order, so the wiring lives in a function rather than in a docstring
      anyone can skip. A regression test drives a full loss-and-recovery
      cycle and asserts the machine reaches NOMINAL.
    artifact: csia_mission/recovery.py; tests/test_mission_assurance.py

  - id: MX-003
    date: 2026-09-07
    phase: MISSION EXTENSION (benchmark)
    kind: EXPECTATION_CORRECTED
    what_happened: >-
      ONE EXPECTATION IN THE DECLARED TABLE WAS WRONG AND WAS CORRECTED AFTER
      THE RUN. S5's first tick expected global_rgb_orthomosaic to be
      PRODUCT_NOT_SUPPORTED; the implementation returned
      PRODUCT_NOT_EVALUABLE.
    found_by: The benchmark's own comparison against the declared table.
    verdict: EXPECTATION_CORRECTED_IMPLEMENTATION_UNCHANGED
    consequence: >-
      CHANGING AN EXPECTATION AFTER SEEING OUTPUT IS THE MOVE THIS DISCIPLINE
      FORBIDS, so the justification has to be that the expectation
      contradicted a rule declared BEFORE the run -- not that the output was
      inconvenient. It did: the hold makes the capability UNKNOWN, UNKNOWN is
      never promoted, and a product whose properties are all UNKNOWN with none
      NOT_SUPPORTED is PRODUCT_NOT_EVALUABLE by the state rule written in
      product.py before the table existed.
      PRODUCT_NOT_SUPPORTED would have claimed the orthomosaic is KNOWN to be
      unusable. It is not; nobody yet knows. That distinction is the entire
      reason there are four product states instead of three, and the
      expectation had collapsed it.
      The correction is recorded in the artifact itself under
      `expectations_corrected_after_the_run`, with the reason, and a test
      fails if that record is removed.
    artifact: >-
      tools/xr/disaster_corridor.py;
      research/mission/results/DISASTER_CORRIDOR.json

  - id: MX-004
    date: 2026-09-07
    phase: MISSION EXTENSION (bounded verification)
    kind: VACUOUS_PASS
    what_happened: >-
      TWO BOUNDED PROPERTIES REPORTED "NO COUNTEREXAMPLE" FROM ZERO CASES.
      P7 and P8 -- ranking alone cannot certify a capability or a product --
