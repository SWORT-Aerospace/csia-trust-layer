      coincidentally equals 0.7. The prose is "measured minimum fused evidence
      in the saturated cells". The artifact states that value only inside a
      prose `statement` field and its one 0.7 scalar is `predicted_e_f` -- the
      PREDICTION. Binding measured to predicted would have been wrong in the
