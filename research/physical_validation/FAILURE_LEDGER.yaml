  - id: MX-005
    date: 2026-09-07
    phase: MISSION EXTENSION (reconfiguration analysis)
    kind: INCOMPLETE_ANALYSIS
    what_happened: >-
      THE SELF-OCCLUSION ANALYSER DID NOT FOLLOW THE CAPABILITY CHAIN. Its
      satisfiability test checked only a capability's DIRECT evidence
      requirements. A capability whose requirements are entirely subordinate
      capabilities -- local_mapping requires relative_navigation and
      RGB_capture and no evidence of its own -- therefore came out satisfiable
      in every configuration, including ones that removed the camera it
      depends on. The analyser reported stowing the RGB camera as NOT
      self-occluding for local mapping, which is exactly wrong.
    found_by: >-
      Reading the analyser's own output table and noticing that the one
      transition which should obviously have been flagged was not.
    verdict: FIXED
    consequence: >-
      Satisfiability is now transitive over subordinate capabilities, with
      cycle detection that fails closed and an unmodelled subordinate treated
      as not-satisfiable rather than as absent. A capability with no direct
      evidence requirements is not a capability with no requirements, and
      following the chain is the difference between an analysis and a spot
      check.
      The analyser now DISCRIMINATES rather than flagging everything: stowing
      the camera is self-occluding for local_mapping (which needs it) and NOT
      for relative_navigation (whose reference-IMU path survives). A test
      pins both directions, because an analyser that flagged every reduction
      would make the term mean nothing.
    artifact: >-
      csia_mission/reconfiguration.py;
      research/mission/results/RECONFIGURATION_ANALYSIS.json

  - id: MX-006
    date: 2026-09-07
    phase: MISSION EXTENSION (guards)
    kind: SELF_INFLICTED_GUARD
    what_happened: >-
      TWO MORE FORBIDDEN-WORD GUARDS FIRED ON THEIR OWN DOCUMENTATION. A check
