      five before it. The pattern is now unmistakable: a substring scan that
      cannot distinguish a claim from its denial has exactly one cheap fix --
      delete the sentence explaining the rule -- and that fix makes the
      repository worse.
      The guard now strips comments and docstrings with tokenize and ast and
      scans the CODE, and it checks for the mechanisms as well as the phrase
