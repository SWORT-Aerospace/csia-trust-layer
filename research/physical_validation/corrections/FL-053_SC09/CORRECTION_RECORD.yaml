claim:
  id: SC-09
  source: research/systems-paper/CLAIMS.csv
  statement_verbatim: >-
    The CUSUM alarms earlier than the trust threshold in every faulted arm and
    never in the clean window.

historical_record:
  what_it_says: >-
    Commit 4e3ed38 (2026-09-03, "Finish the systems-paper red team") added a
    `policy_dwell` block to mechanism_b.json and its generator, recording for
    each arm `trust_latency_includes_dwell: true` and
    `trust_detector_only_latency_s = trust_latency_s - dwell_up`, and closed
    red-team objection 2.3 ("NONE -- this objection is CLOSED. It was correct,
    the decomposition was computed, and the conclusion survived it"), recorded
    elsewhere as "CLOSED by correction" (docs/CURRENT_PROGRAM_STATE.md gate 9;
    handoff V1). Its premise was that the raw trust latency included the
    failsafe's 1.0 s dwell and so flattered the CUSUM. The prose that rests on it is in MECHANISM_B.md sections 5 and 6,
    REVIEWER_RED_TEAM.md objection 2.3, the SC-09 rationale column of
    CLAIMS.csv, CUSUM_FAIRNESS.yaml and CUSUM_FAIRNESS_TABLE.csv, and the
    systems-paper handoffs given to the writing agent.
  stays: >-
    Every one of those files stays byte-identical, before and after adoption.
    They are the true record of what was asserted on 2026-09-03 and of the
    reasoning that produced it. Adoption adds a ledger entry and this record
    beside them; it rewrites none of them.
