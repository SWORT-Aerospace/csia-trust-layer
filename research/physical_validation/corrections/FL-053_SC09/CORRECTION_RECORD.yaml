# FL-053 / SC-09 -- CORRECTION RECORD (successor record; nothing regenerated)
#
# STATUS: PROPOSED. Drafting this record does not adopt it. It becomes the
# authoritative statement of the CUSUM-versus-trust comparison only when
# `adopt.py --apply` is run with an owner decision reference, which appends
# FL-053 to the failure ledger (rule R8) and flips `status` to ADOPTED.
# Until then the historical record below is the record, and this file is a
# proposal about it.
#
# This is a SUCCESSOR record, the mechanism the repository already uses for
# stale or wrong committed evidence (research/physical_validation/results/
# s0_rederivation.json beside the unedited escalation_algebra.json): the
# frozen artifact stays byte-identical and the correction is written beside it.
# research/systems-paper/results is `forbidden_without_tier_completion` in
# research/physical_validation/EVIDENCE_EXTENSION.yaml, so it is NOT
# regenerated, here or on adoption.
#
# verification/verify_correction.py checks every statement below that can be
# checked mechanically; tests/test_fl053_sc09_correction.py runs it.

