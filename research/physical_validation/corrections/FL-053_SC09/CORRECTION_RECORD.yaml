valid_values:
  source: research/systems-paper/results/mechanism_b.json
  source_sha256: 8237458edfb3b55750df99394f17237723d9712ed367975222aac131aa8eb1fc
  definition: >-
    trust_first_crossing_s is `arms/<arm>/crossing/trust_latency_s`: the first
    time after onset that the raw gps trust series from run_pipeline falls
    below FailsafeConfig.nav_caution = 0.75. cusum_first_alarm_s is
    `arms/<arm>/crossing/cusum_latency_s`. Both are seconds after the 20 s
    onset. Both are correct as committed and are reproduced exactly by
    re-running the generator on a clean archive.
  slow_ramp:  {drift_m_per_s: 1.0, trust_first_crossing_s: 8.72, cusum_first_alarm_s: 2.96, cusum_lead_raw_s: 5.76}
  spoof_3ms:  {drift_m_per_s: 3.0, trust_first_crossing_s: 3.36, cusum_first_alarm_s: 1.16, cusum_lead_raw_s: 2.20}
  fast_ramp:  {drift_m_per_s: 6.0, trust_first_crossing_s: 3.24, cusum_first_alarm_s: 0.72, cusum_lead_raw_s: 2.52}
  clean:      {trust_first_crossing_s: null, cusum_first_alarm_s: null, note: no crossing and no alarm in the clean window}

erroneous_items:
  - id: E1
    kind: metadata
    where: research/systems-paper/results/mechanism_b.json arms/*/policy_dwell/trust_latency_includes_dwell, and research/systems-paper/mechanism_b.py where the block is written
    recorded: true
    correct: false
    why: >-
      The trust series comes from csia/scenarios.py run_pipeline, which runs
      PredictionComparator, TrustEngine and CausalDiagnosis and never steps
      FailsafePolicy; mechanism_b.py imports FailsafeConfig only to read
      nav_caution and dwell_up. The dwell is applied by FailsafePolicy.update
      after a crossing. A crossing of the raw series cannot contain it.
  - id: E2
    kind: subtraction
    where: research/systems-paper/results/mechanism_b.json arms/*/policy_dwell/trust_detector_only_latency_s
    recorded: {slow_ramp: 7.72, spoof_3ms: 2.36, fast_ramp: 2.24}
    correct: {slow_ramp: 8.72, spoof_3ms: 3.36, fast_ramp: 3.24}
    why: >-
      Computed as trust_latency_s - dwell_up from a latency that already was
      detector-only, so each figure is 1.0 s too favourable to the trust path.
  - id: E3
    kind: prose and closure
    where: >-
      MECHANISM_B.md sections 5-6 ("The raw comparison flattered the CUSUM by
      one dwell period"; "The detector-only figure is the one to quote");
      REVIEWER_RED_TEAM.md objection 2.3 ("this objection is CLOSED"; "quoting
      8.72 against 2.96 is named as the error this objection identified");
      CLAIMS.csv
      SC-09 rationale; CUSUM_FAIRNESS.yaml header; CUSUM_FAIRNESS_TABLE.csv,
      whose fair_comparison and forbidden_comparison columns are inverted;
      PROSE_NUMERIC_BINDINGS.yaml PB-26 to PB-29 descriptions;
      docs/CURRENT_PROGRAM_STATE.md section 3 gate 9; handoff V1, handoff V2
      and DUAL_PAPER_COORDINATION_SUMMARY.md ("detector-to-detector, VERIFIED:
      7.72 vs 2.96")
    correct: >-
      Objection 2.3's premise does not hold for this measurement: the raw
      comparison is already detector against detector. The figures to quote
      are the raw crossings.

substantive_conclusion:
  sc_09: UNCHANGED
  statement: >-
    The CUSUM alarms earlier than the trust threshold in every faulted arm and
    never in the clean window. True on the raw figures, as it was on the
    subtracted ones; correcting the figures widens the lead on every arm.
  cusum_lead_s:
    slow_ramp: {raw: 5.76, as_previously_stated: 4.76}
    spoof_3ms: {raw: 2.20, as_previously_stated: 1.20}
    fast_ramp: {raw: 2.52, as_previously_stated: 1.52}
  scope_unchanged: >-
    Bench simulator only; one node (gps); one flight profile; one arm per drift
    rate; CUSUM h = 500 chosen on the same simulator's clean arm; the CUSUM bank
    cannot see either IMU. None of that is altered by this correction.

proposed_authoritative_statement:
  effective: only when status is ADOPTED
  text: >-
    Against the trust path's first crossing of nav_caution = 0.75, the CUSUM
    alarms 5.76 s earlier on the 1 m/s ramp (2.96 s against 8.72 s), 2.20 s
    earlier on the 3 m/s spoof (1.16 s against 3.36 s) and 2.52 s earlier on
    the 6 m/s ramp (0.72 s against 3.24 s), and never in the clean window.
    Both figures are detector-only: the trust figure is a crossing of the raw
    trust series, which no failsafe policy has acted on. The figures previously
    labelled detector-only (7.72 / 2.36 / 2.24 s) subtracted a 1.0 s dwell
    that the raw series never contained (FL-053).

supplementary_measurement:
  artifact: research/physical_validation/corrections/FL-053_SC09/verification/policy_alerts.json
  status: verification inside a proposed record; not an adopted result and not for quotation
  what: >-
    The shipped FailsafePolicy stepped per tick over the same three arms. The
    first escalation (CAUTION, reason "GPS trust ...") comes exactly dwell_up
    = 1.00 s after the trust crossing on every faulted arm: 9.72 / 4.36 /
    4.24 s after onset. The clean arm never escalates. This places the dwell
    after the crossing on the exact arms, which the 2026-09-26 draft could only
    infer.
  supersedes_in_the_draft: >-
    The draft's DERIVED detector-plus-policy times 9.76 / 4.40 / 4.28 s
    (crossing + 1.04 s, transferred from the online-runtime audit of a
    different scenario). On these arms, in batch replay, the measured offset
    is 1.00 s, not 1.04 s.

