%YAML 1.2
---
# EVERY HEADLINE NUMBER IN PROSE, BOUND TO THE ARTIFACT IT CAME FROM.
#
# WHY THIS FILE EXISTS
# --------------------
# The documents written for the two papers quote numbers that were copied by
# hand out of JSON artifacts: 378,000 agreements, 76 ticks, 15,595 ticks,
# 2,721 instances, 22,130 microseconds. Nothing checked them. A regeneration on
# a different host, a rerun after a code change, or a simple typo would leave
# the prose confidently stating a number the artifact no longer contains, and
# the first person to notice would be a referee.
#
# `papers/csia_systems/PAPER1_ARTIFACT_MAP.yaml` already does this for the
# systems manuscript. This file does it for the research prose around it,
# which had no equivalent. `tests/test_prose_numeric_bindings.py` enforces it
# and checks BOTH directions:
#
#   1. the bound value equals what the artifact says today
#   2. the rendered form actually appears in every document that cites it
#
# Direction 2 is the one that catches drift. A binding whose value is correct
# but whose document says something else is exactly the failure this prevents,
# and a binding that names no document is rejected as vacuous.
#
# HOW TO ADD A ROW
# ----------------
# Give the artifact, a JSON pointer, the documents that quote it, and every
# rendering the prose uses (thousands separators, rounding, units). If a
# rendering is not derivable from the value, that is a transcription error and
# the test says so rather than the row being widened to accept it.

schema: csia.research.prose_numeric_bindings/1

bindings:

  # ---------------------------------------------------------------- checker
  - id: PB-01
    what: tick-by-pair comparisons between the independent checker and production
    artifact: research/systems-paper/results/checker_agreement.json
    pointer: /totals/agree
    renderings: ["378,000", "378 000", "378000", "$378{,}000$"]
    documents:
      - research/systems-paper/MECHANISM_A.md
      - research/systems-paper/CLAIMS.csv
      - docs/CURRENT_PROGRAM_STATE.md
      - papers/gate_conditioning/main.tex

  - id: PB-02
    what: real disagreements between the checker and production
    artifact: research/systems-paper/results/checker_agreement.json
    pointer: /totals/real_disagreements
    renderings: ["0"]
    documents:
      - research/systems-paper/MECHANISM_A.md

  - id: PB-03
