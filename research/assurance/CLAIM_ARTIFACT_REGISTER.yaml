%YAML 1.2
---
schema: csia.assurance.claim_artifact_register/1
what_this_is: 'The 21 artifacts the two papers'' artifact maps cite as backing a
  stated number, with what is KNOWN about each one''s provenance. Read-only: nothing
  here regenerates, refreshes or modifies any artifact.'
what_this_is_not: Not a claim that these artifacts are governed. A hash in this
  file DETECTS later modification; it does not control whether a result may be generated
  or refreshed. Nothing here is an evidence gate, and an artifact listed with a
  valid hash is still ungated.
how_generators_were_established: 'Candidates were taken from the papers'' own artifact
  maps (`script`, and `inputs` on figure rows, which names the PRODUCING script
  rather than an artifact). Each candidate was then read to see whether it writes
  the artifact''s path. generator_evidence records which basis applies: VERIFIED_WRITES_PATH
  where the source writes it, DECLARED_BY_ARTIFACT_MAP_ONLY where the script writes
  through a runtime --out and the binding rests on the map''s assertion, MISSING
  where neither holds. No generator was inferred from a filename match alone.'
why_input_artifacts_are_all_unknown: Neither the maps nor the scripts declare per-artifact
  input ARTIFACTS. The maps' figure rows carry an `inputs` field, but it names the
  producing SCRIPT, not an input artifact, and recording a script there would be
  a category error that made the register look more complete than it is.
two_entries_cited_outside_the_artifact_field: campaigns/bench.json and research/math-paper/PRIOR_ART_MATRIX.csv
  are cited through `benchmark_artifact` and a `formal_sources` path rather than
  an `artifact:` field. Their claim ids come from those fields.
entry_count: 21
