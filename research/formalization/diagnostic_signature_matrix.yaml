artifact_version: 1.0.0
source_of_truth: csia/diagnosis/bayes.py CAUSES (lines 44-56)
likelihood: L(c|LOW)=log(1-c+EPS), L(c|HIGH)=log(c+EPS), EPS=0.02
accumulation: EW alpha=0.06 (~15 ticks), tempered x1.5, softmax over log-prior
prior:
  nominal: 0.86
  each_fault: 0.02
note: 'A gated feature (gate<=1e-9) is SKIPPED entirely (bayes.py:99-100): it is neither evidence for
  nor against any hypothesis. Two hypotheses whose LOW sets coincide after gating therefore receive identical
  log-likelihood on EVERY remaining feature, so their posterior ratio stays pinned at the prior ratio
  forever. That is indistinguishability, not merely weak evidence.'
hypotheses:
  nominal: []
  gps_fault:
  - phys_gps
  imu0_bias_drift:
  - accel_motor_current
  - redundant_imu
  imu1_bias_drift:
  - accel_esc_rpm
  - redundant_imu
  mag_interference:
  - attitude_gravity_mag
  - heading_course
  - phys_mag
  - temp_mag
  power_fault:
  - accel_esc_rpm
  - accel_motor_current
  - phys_battery
  - phys_motor_esc
  - temp_battery
  vibration_anomaly:
  - phys_vibration
  - temp_vibration
  - vibration_prop_freq
  unexpected_maneuver:
  - temp_gps
modes:
  all_gates_open:
    gate_source: 'baseline: every gate at 1.0'
    features_removed: []
    observable_low_signatures:
