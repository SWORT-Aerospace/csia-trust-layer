    observable_low_signatures:
      nominal: []
      gps_fault: []
      imu0_bias_drift:
      - attitude_gravity_mag
      - redundant_imu
      imu1_bias_drift:
      - redundant_imu
      mag_interference:
      - attitude_gravity_mag
      - phys_mag
      - temp_mag
      power_fault:
      - phys_battery
      - temp_battery
      vibration_anomaly:
      - phys_vibration
      - temp_vibration
      - vibration_prop_freq
      unexpected_maneuver:
      - temp_gps
    collisions:
    - gps_fault == nominal
