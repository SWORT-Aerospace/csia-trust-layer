changelog:
- '1.1.0 (2026-08-22, WP-C3): attitude_gravity_mag added to imu0_bias_drift''s LOW set in
  csia/diagnosis/bayes.py. Repairs the F-D1 collision (imu0_bias_drift == imu1_bias_drift
  when the motor edges gate off). Derived mode blocks below regenerated from the new CAUSES.'
- "1.1.0 (2026-08-22, WP-C3): corrected features_removed for ['gps_fix_invalid', 'gps_invalid_and_disarmed']\
  \ \u2014 temp_gps was listed as gating off with the GPS fix, but bayes.py:135-136 gates\
  \ every temp_* feature with np.ones unconditionally, so no gate can close it. The v1.0.0\
  \ record therefore reported a three-way collision (gps_fault == nominal == unexpected_maneuver)\
  \ where source gives a two-way one. Found by WP-E1's independent recomputation and corrected\
  \ here."
- '1.0.0: initial WP1 recovery of the implemented system.'
