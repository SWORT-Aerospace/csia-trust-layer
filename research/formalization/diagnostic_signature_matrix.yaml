      classification: nested_signature
      residual_low_a: []
      residual_low_b:
      - accel_esc_rpm
      - redundant_imu
    - pair:
      - nominal
      - mag_interference
      classification: nested_signature
      residual_low_a: []
      residual_low_b:
      - attitude_gravity_mag
      - heading_course
