artifact_version: 1.1.0
source_of_truth: csia/diagnosis/bayes.py CAUSES (lines 44-56)
likelihood: L(c|LOW)=log(1-c+EPS), L(c|HIGH)=log(c+EPS), EPS=0.02
accumulation: EW alpha=0.06 (~15 ticks), tempered x1.5, softmax over log-prior
prior:
  nominal: 0.86
  each_fault: 0.02
note: 'A gated feature (gate<=1e-9) is SKIPPED entirely (bayes.py:99-100): it is neither evidence
  for nor against any hypothesis. Two hypotheses whose LOW sets coincide after gating therefore
  receive identical log-likelihood on EVERY remaining feature, so their posterior ratio stays
  pinned at the prior ratio forever. That is indistinguishability, not merely weak evidence.'
hypotheses:
  nominal: []
  gps_fault:
  - phys_gps
  imu0_bias_drift:
  - accel_motor_current
  - attitude_gravity_mag
  - redundant_imu
  imu1_bias_drift:
  - accel_esc_rpm
  - redundant_imu
  mag_interference:
  - attitude_gravity_mag
  - heading_course
  - phys_mag
  - temp_mag
  power_fault:
  - accel_esc_rpm
  - accel_motor_current
  - phys_battery
  - phys_motor_esc
  - temp_battery
  vibration_anomaly:
  - phys_vibration
  - temp_vibration
  - vibration_prop_freq
  unexpected_maneuver:
  - temp_gps
modes:
  all_gates_open:
    gate_source: 'baseline: every gate at 1.0'
    features_removed: []
    observable_low_signatures:
      nominal: []
      gps_fault:
      - phys_gps
      imu0_bias_drift:
      - accel_motor_current
      - attitude_gravity_mag
      - redundant_imu
      imu1_bias_drift:
      - accel_esc_rpm
      - redundant_imu
      mag_interference:
      - attitude_gravity_mag
      - heading_course
      - phys_mag
      - temp_mag
      power_fault:
      - accel_esc_rpm
      - accel_motor_current
      - phys_battery
      - phys_motor_esc
      - temp_battery
      vibration_anomaly:
      - phys_vibration
      - temp_vibration
      - vibration_prop_freq
      unexpected_maneuver:
      - temp_gps
    collisions: []
    collision_count: 0
  disarmed_or_prearm:
    gate_source: csia/runtime/online.py:491-496 armed_gate=0.0 when self._armed is False
    features_removed:
    - accel_esc_rpm
    - accel_motor_current
    - phys_motor_esc
    observable_low_signatures:
      nominal: []
      gps_fault:
      - phys_gps
      imu0_bias_drift:
      - attitude_gravity_mag
      - redundant_imu
      imu1_bias_drift:
      - redundant_imu
      mag_interference:
      - attitude_gravity_mag
      - heading_course
      - phys_mag
      - temp_mag
      power_fault:
      - phys_battery
      - temp_battery
      vibration_anomaly:
      - phys_vibration
      - temp_vibration
      - vibration_prop_freq
      unexpected_maneuver:
      - temp_gps
    collisions: []
    collision_count: 0
  gps_fix_invalid:
    gate_source: csia/prediction/comparator.py:198-199 P['gps'] gate=gvalid*(ticks>3); :144,:155,:168
      gvalid on baro/doppler/heading
    features_removed:
    - altitude_baro
    - heading_course
    - phys_gps
    - velocity_gps_doppler
    observable_low_signatures:
      nominal: []
      gps_fault: []
      imu0_bias_drift:
      - accel_motor_current
      - attitude_gravity_mag
      - redundant_imu
      imu1_bias_drift:
      - accel_esc_rpm
      - redundant_imu
      mag_interference:
      - attitude_gravity_mag
      - phys_mag
      - temp_mag
      power_fault:
      - accel_esc_rpm
      - accel_motor_current
      - phys_battery
      - phys_motor_esc
      - temp_battery
      vibration_anomaly:
      - phys_vibration
      - temp_vibration
      - vibration_prop_freq
      unexpected_maneuver:
      - temp_gps
    collisions:
    - gps_fault == nominal
    collision_count: 1
  low_speed_hover:
    gate_source: csia/prediction/comparator.py:33-34,112,168 GATE_SPEED_LO=2.0 GATE_SPEED_HI=3.0
    features_removed:
    - heading_course
    observable_low_signatures:
      nominal: []
      gps_fault:
      - phys_gps
      imu0_bias_drift:
      - accel_motor_current
      - attitude_gravity_mag
      - redundant_imu
      imu1_bias_drift:
      - accel_esc_rpm
      - redundant_imu
      mag_interference:
      - attitude_gravity_mag
      - phys_mag
      - temp_mag
      power_fault:
      - accel_esc_rpm
      - accel_motor_current
      - phys_battery
      - phys_motor_esc
      - temp_battery
      vibration_anomaly:
