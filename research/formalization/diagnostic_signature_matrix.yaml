      - accel_motor_current
      - phys_battery
      - phys_motor_esc
      - temp_battery
      vibration_anomaly:
      - phys_vibration
      - temp_vibration
      - vibration_prop_freq
      unexpected_maneuver:
      - temp_gps
    collisions:
    - pair:
      - nominal
      - gps_fault
      classification: nested_signature
      residual_low_a: []
      residual_low_b:
      - phys_gps
    - pair:
      - nominal
      - imu0_bias_drift
      classification: nested_signature
      residual_low_a: []
      residual_low_b:
      - accel_motor_current
