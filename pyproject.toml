[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csia-trust-layer"
version = "0.8.0"
description = "SWORT LLC Cross-Sensor Intelligence Architecture (CSIA) Trust Layer — research prototype / desktop simulation. NOT flight software."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "build>=1", "pyflakes>=3"]
mavlink = ["pymavlink>=2.4"]
logs = ["pyulog>=1.0"]
# Research data lake only — the embedded runtime path (csia/runtime,
# csia/native) must never import these; enforced by test.
data = ["duckdb>=1.0", "huggingface_hub>=0.34", "polars>=1.0", "pyarrow>=25",
        "PyYAML>=6"]

[project.scripts]
csia = "csia.cli:main"
csia-shadow = "csia.deploy.cli:main"
csia-edge = "csia.deploy.edge:main"

[tool.setuptools.packages.find]
include = ["csia*"]

[tool.setuptools.package-data]
"csia.dashboard" = ["web/*"]
"csia.contracts" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end runs through the full detector (seconds, not ms)",
    "sitl: needs a live ArduPilot or PX4 SITL binary; excluded from the fast CI lane",
]
