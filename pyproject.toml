[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csia-trust-layer"
version = "0.8.0"
description = "SWORT LLC Cross-Sensor Intelligence Architecture (CSIA) Trust Layer — research prototype / desktop simulation. NOT flight software."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "build>=1", "pyflakes>=3"]
# Post-E1 assurance hardening: the bounded verifier (z3), the
# property-based tests (hypothesis) and the resource-envelope probe
# (psutil). NOT imported by the runtime path or by the frozen core --
# only by tools/assurance/ and its tests.
assurance = ["z3-solver>=4.12", "hypothesis>=6", "psutil>=5.9"]
mavlink = ["pymavlink>=2.4"]
# E2M sensor-bus bench acquisition. pyserial is imported by exactly one
# module -- csia_e2m/transport.py -- and lazily, inside SerialTransport.open(),
# so importing csia_e2m pulls in no hardware library and the test suite needs
# no port to exist. Declared as its own extra rather than folded into `dev`
# because a hardware dependency should be visible as one.
hardware = ["pyserial>=3.5"]
logs = ["pyulog>=1.0"]
# Research data lake only — the embedded runtime path (csia/runtime,
# csia/native) must never import these; enforced by test.
data = ["duckdb>=1.0", "huggingface_hub>=0.34", "polars>=1.0", "pyarrow>=25",
        "PyYAML>=6"]

[project.scripts]
csia = "csia.cli:main"
csia-shadow = "csia.deploy.cli:main"
csia-edge = "csia.deploy.edge:main"

[tool.setuptools.packages.find]
include = ["csia*"]

[tool.setuptools.package-data]
"csia.dashboard" = ["web/*"]
"csia.contracts" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end runs through the full detector (seconds, not ms)",
    "sitl: needs a live ArduPilot or PX4 SITL binary; excluded from the fast CI lane",
]
